full registered name for an instant structural check — then go further with the full verification guide.","articleCtaBtn":"Open the free check","articlesRelated":[{"label":"Free instant USCC check","href":"../free-uscc-check.html"},{"label":"Tariff stack calculator","href":"../tools/tariff-stack-calculator.html"},{"label":"Pricing & reports","href":"../index.html#pricing"},{"label":"MCP server for AI agents","href":"../mcp-server.html"},{"label":"12 China sourcing scams in 2026","href":"../../articles/12-china-sourcing-scams-2026.html"}],"related":[{"label":"12 China Sourcing Scams in 2026","href":"articles/12-china-sourcing-scams-2026.html"},{"label":"Free USCC checker","href":"doors/sourcing-audit/free-uscc-check.html"}],"article":{"title":"Chinese Business Licence Explained Field by Field","desc":"A field-by-field guide to a Chinese business licence, covering company name, USCC, legal representative, capital, address, scope, date, and term.","tags":["business licence","china sourcing","uscc","supplier verification"],"html":"<p>A Chinese business licence is the single most useful document you can request from a supplier, and the one most often misread. It is short, it is standardized, and every field on it answers a specific question about risk. This guide decodes each field so you know what you are looking at, what it proves, and what it does not.<\/p>\n<p>Ask for a clear, full photo of the licence. Not a logo, and not a certificate of incorporation from some other country. The licence itself, photographed whole so nothing is cropped out.<\/p>\n<h2>Company name<\/h2>\n<p>The full registered name, usually ending in 有限公司 (Co., Ltd.). This is the only name that matters legally. Trademarks, brand names, and the friendly English name your contact uses carry no legal weight. If your invoice, contract, and bank details do not all use the registered name, find out why. A mismatch here is one of the most common warning signs in a bad deal.<\/p>\n<h2>USCC<\/h2>\n<p>The Unified Social Credit Code, an 18-character code with a check digit. It is the company's permanent identity number. A well-formed code proves format only. It does not prove the company is active, solvent, or controlled by the person talking to you. Use the USCC as a lookup key into public records, not as a trust signal on its own.<\/p>\n<h2>Legal representative<\/h2>\n<p>The individual legally responsible for the company. This is not always the owner, and rarely the sales contact you deal with daily. Check whether this person appears on the dishonest-debtor (laolai) list or has a history of enforcement actions. A legal representative with a clean record is a baseline expectation, not a bonus.<\/p>\n<h2>Registered capital<\/h2>\n<p>The amount declared in the registry, usually in CNY. It is a disclosure figure, not proof of cash in the bank. Watch for changes over time. A recent capital reduction means money is leaving the entity or the owners are limiting their exposure. A capital reduction is one of the most useful warning signals in public data, and it is easy to miss if you only look at the licence once.<\/p>\n<h2>Registered address<\/h2>\n<p>Where the company is officially located. Compare it to where it claims to operate. An industrial park is consistent with manufacturing. A residential flat or shared office is consistent with trading or an intermediary. The address should match the story you have been told, and it should survive a look at a satellite map.<\/p>\n<h2>Business scope<\/h2>\n<p>The range of activities the company is registered to perform. Manufacturing companies typically show production or processing wording. Trading-focused companies show sales, wholesale, retail, or import and export. Scope is a clue, not proof, but a total absence of production activity should prompt a direct question about who actually makes the goods.<\/p>\n<h2>Establishment date and term<\/h2>\n<p>When the company was formed, and how long it is registered to operate. A very new company claiming a long track record is a contradiction. A short remaining term can also matter for a long supply relationship. Both fields are easy to read and easy to ignore, which is exactly why they are worth checking.<\/p>\n<h2>What the licence does not tell you<\/h2>\n<p>The licence is a legal identity card, not a health report. It will not tell you whether the company pays its bills, whether it is profitable, whether it has been sued, or whether the person emailing you has any authority to sign on its behalf. Those answers live in other records: court judgments, enforcement actions, the dishonest-debtor (laolai) list, sanctions screening, and adverse media.<\/p>\n<p>A full verification report combines the licence with those sources and covers registration status, ownership and shareholders, litigation and enforcement records, sanctions screening, and adverse media, with bilingual (Chinese and English) evidence. Read the licence first, then treat every field on it as a starting point for a lookup rather than a conclusion on its own.<\/p>\n<h2>Quick Verification Checklist<\/h2>\n<ul>\n<li>Pull the supplier's registry record (GSXT/SAMR) and read the <strong>capital trend<\/strong>, not the snapshot.<\/li>\n<li>Match the bank account name to the registered company name exactly.<\/li>\n<li>Look at hiring activity over the last 12 months — a sudden collapse is a warning.<\/li>\n<li>Verify every certificate serial with the issuing body.<\/li>\n<li>Search the address: one building hosting many &quot;different factories&quot; is a front farm.<\/li>\n<\/ul>\n<h2>What this means if you are about to pay<\/h2>\n<p>Before you send money, read the licence next to your invoice and your bank instructions. The registered name, the USCC, and the bank account name should all point to the same legal entity. If the licence you were shown does not match the paperwork you are paying against, stop and resolve it first. Paying the wrong name is a mistake you cannot un-do.<\/p>\n<h2>Check the fields yourself<\/h2>\n<p>Keep the licence on file next to your contract and your payment instructions, and re-check the key fields before each new order rather than only once at the start. Entities change, and a field that was clean a year ago is not automatically clean today. Run a free instant USCC check at https://lu7897859-tech.github.io/doors/sourcing-audit/ to confirm the code and the entity are real. For a field-by-field walkthrough with the records to pull for each entry, the $14 verification guide covers the whole licence and what to do when a field looks wrong.<\/p>\n<p><strong>Want to verify a specific supplier before you pay?<\/strong><\/p>\n<p>→ Free instant check: https://lu7897859-tech.github.io/doors/sourcing-audit/<\/p>\n<p>→ Full 5-layer verification guide ($14): https://lunarwave8803.gumroad.com/l/kbgmsy<\/p>","cta":"https://lu7897859-tech.github.io/doors/sourcing-audit/","ctaTitle":"Check a supplier for free, right now","ctaText":"Paste the supplier's 18-digit USCC or full registered name for an instant structural check — then go further with the full verification guide.","ctaBtn":"Open the free check"},"type":"article"};</script>

  function wireDemo(){
    var inp = document.getElementById('dq'), btn = document.getElementById('db'), out = document.getElementById('dout');
    if(!inp||!btn) return;
    function setOut(msg, cls){ out.className = 'out' + (cls?(' '+cls):''); out.textContent = msg; }

    // ---- client-side USCC (Unified Social Credit Code) checker: real, zero-dependency free hook ----
    var CS = '0123456789ABCDEFGHJKLMNPQRTUWXY';
    var W = [1,3,9,27,19,26,16,17,20,29,25,13,8,24,10,30,28];
    var REG = {'1':'Market regulation','5':'Civil affairs','9':'Other','Y':'Other','1A':'Regulator A'};
    function decodeUSCC(code){
      var s = String(code||'').toUpperCase().replace(/\s+/g,'');
      if(s.length!==18) return {ok:false, reason:'Length is '+s.length+', a USCC is exactly 18 characters.'};
      for(var i=0;i<18;i++){ if(CS.indexOf(s.charAt(i))<0) return {ok:false, reason:'Invalid character "'+s.charAt(i)+'" (letters I, O, S, V, Z are not used).'}; }
      var sum=0; for(var j=0;j<17;j++) sum += CS.indexOf(s.charAt(j))*W[j];
      var expect = CS.charAt((31 - (sum % 31)) % 31);
      var ok = (expect === s.charAt(17));
      return {ok:ok, expect:expect, given:s.charAt(17),
        region:s.slice(2,8), org: s.charAt(8), kind: s.charAt(9), serial:s.slice(10,17)};
    }
    function explain(x){
      if(x.ok){
        return '✅ Structurally valid USCC\n\n'+
          'Region / admin code : '+x.region+'\n'+
          'Entity-type code   : '+x.kind+'\n'+
          'Org code           : '+x.org+'\n'+
          'Serial             : '+x.serial+'\n'+
          'Check digit        : '+x.given+' (valid)\n\n'+
          'Format checks out. What a valid code does NOT tell you: whether the company is still active, who really owns it, or whether it has litigation, sanctions or adverse media. That is what the full report covers.';
      }
      return '❌ Not a structurally valid USCC\n\n'+x.reason+'\n\nTip: paste the 18-character Unified Social Credit Code from the supplier\u2019s business licence, or try the company\u2019s full registered name.';
    }

    async function run(){
      var q = (inp.value||'').trim();
      if(!q){ setOut(D.demoEmpty||'Please enter a company name or 18-digit registration number.','err'); return; }
      btn.disabled = true; var old = btn.textContent; btn.textContent = D.demoBusy||'Checking…';
      try{
        if(D.demoMode === 'uscc'){
          setOut(D.demoBusy||'Checking…','');
          var x = decodeUSCC(q);
          setOut(explain(x), x.ok?'ok':'err');
          beacon(q, x.ok?'valid':'invalid');
        } else if(D.demoMode === 'endpoint' && D.demoEndpoint){
          setOut(D.demoBusy||'Contacting verification service…','');
          var r = await fetch(D.demoEndpoint, { method:'POST', headers:{'content-type':'application/json','accept':'application/json'}, body: JSON.stringify({ keyword: q, tool:'verify_supplier' }) });
          var txt = await r.text(); var j=null; try{ j=JSON.parse(txt); }catch(e){}
          if(r.status===200 && j){ setOut(JSON.stringify(j,null,2).substring(0,1400),'ok'); }
          else if(r.status===402){ setOut((D.paywallNote||'Free instant checks used. Get the full verified report to continue.'),'err'); }
          else { setOut('Service returned status '+r.status+'. '+(D.demoFallback||''),'err'); }
        } else {
          var x2 = decodeUSCC(q);
          setOut(explain(x2), x2.ok?'ok':'err');
        }
      }catch(e){
        setOut((D.demoOffline||'The live demo is momentarily unavailable. The full verification report still works.')+'\n\n'+(D.demoEndpoint||''),'err');
      }
      btn.disabled=false; btn.textContent=old;
    }
    // anonymous use-signal: lets us see the first real visitor arrive (never sent to the supplier)
    function beacon(q, result){
      if(!D.demoEndpoint) return;
      try{
        fetch(D.demoEndpoint, { method:'POST', keepalive:true, headers:{'content-type':'application/json'}, body: JSON.stringify({ keyword:q, tool:'verify_supplier', source:'door-free-hook', result:result }) }).catch(function(){});
      }catch(e){}
    }
    btn.addEventListener('click',run);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  }
