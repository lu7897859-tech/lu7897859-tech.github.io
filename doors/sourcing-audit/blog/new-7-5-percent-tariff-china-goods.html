h the full verification guide.","articleCtaBtn":"Open the free check","articlesRelated":[{"label":"Free instant USCC check","href":"../free-uscc-check.html"},{"label":"Pricing & reports","href":"../index.html#pricing"},{"label":"MCP server for AI agents","href":"../mcp-server.html"},{"label":"12 China sourcing scams in 2026","href":"../../articles/12-china-sourcing-scams-2026.html"}],"related":[{"label":"12 China Sourcing Scams in 2026","href":"articles/12-china-sourcing-scams-2026.html"},{"label":"Free USCC checker","href":"doors/sourcing-audit/free-uscc-check.html"}],"article":{"title":"Trump's New 7.5% Tariff on Chinese Goods: What Importers Need to Know","desc":"On August 24, 2026, the Associated Press reported that President Trump is moving toward levying a new tariff on China for \"flooding the market with chea","tags":["tariffs","trade war","duty"],"html":"<p><strong>Filename:<\/strong> 20260826_033_75percent_china_tariff_seo.md<\/p>\n<p><strong>Date:<\/strong> 2026-08-26<\/p>\n<p><strong>Series:<\/strong> 026-033（关税系列第 5 篇；030《Will Section 301 Tariffs End Aug 23?》/032《Post-Deadline》的<strong>新事件分支<\/strong>——非四年期审查延续，而是「产能过剩/廉价商品」新关税动议）<\/p>\n<p><strong>Target keyword:<\/strong> new china tariff 7.5% 2026 / trump overcapacity tariff china / china tariff august 2026 update / section 301 overcapacity investigation / china cheap goods flooding tariff<\/p>\n<p><strong>Product tie-in:<\/strong> https://lunarwave8803.gumroad.com/l/section301（Section 301 Tariff Quick-Check Guide）<\/p>\n<p><strong>Word count target:<\/strong> ~1100 words（正文）<\/p>\n<hr>\n<h2>Trump's New 7.5% Tariff on Chinese Goods: What Importers Need to Know<\/h2>\n<p><strong>Meta description:<\/strong> The U.S. is reportedly moving toward a new 7.5% tariff on Chinese goods over &quot;overcapacity&quot; and cheap-goods flooding — reportedly ahead of a planned U.S.-China summit. Here's what's confirmed, what's still reporting, and how to prepare without guessing.<\/p>\n<hr>\n<p>On August 24, 2026, the Associated Press reported that President Trump is <strong>moving toward levying a new tariff on China for &quot;flooding the market with cheap goods,&quot;<\/strong> with the rate under consideration reportedly <strong>7.5%<\/strong>. A day later, The Seattle Times reported the same move in the context of <strong>allegations of excess manufacturing capacity<\/strong> — and noted the action is being teed up <strong>before a planned U.S.-China summit<\/strong>.<\/p>\n<p>If you import from China, this is not a background story. It is a new, separate tariff layer being considered <strong>on top of<\/strong> the existing Section 301, Section 232, and forced-labor measures your goods already carry. Here's what is actually confirmed, what the 7.5% figure means, and the moves that make sense right now — without betting your pricing on a headline.<\/p>\n<h2>What was actually reported (and when)<\/h2>\n<p>Two independent wire reports in the last 48 hours frame the story:<\/p>\n<ul>\n<li><strong>AP (August 24, 2026):<\/strong> Trump is moving toward a new tariff on China over cheap-goods flooding; the rate under consideration is <strong>7.5%<\/strong>.<\/li>\n<li><strong>The Seattle Times (August 25, 2026):<\/strong> The U.S. is set to impose a <strong>7.5% tariff<\/strong> on Chinese goods over <strong>excess manufacturing capacity<\/strong> — reportedly timed <strong>before a planned summit<\/strong> with China's leadership.<\/li>\n<\/ul>\n<p>The consistent number across both reports is <strong>7.5%<\/strong>. The consistent trigger is <strong>overcapacity / market flooding<\/strong> — the &quot;cheap exports&quot; angle that has been a running theme in U.S.-China trade policy since 2025.<\/p>\n<h2>What is confirmed vs. what is still reporting<\/h2>\n<p>This matters, because the biggest cost in trade policy is reacting to rumor as if it were law.<\/p>\n<table><thead><tr><th>Item<\/th><th>Status as of August 26, 2026<\/th><\/tr><\/thead><tbody><tr><td>A new tariff on China is under consideration<\/td><td><strong>Reported<\/strong> (AP, Seattle Times) — no final decision confirmed in indexed reporting<\/td><\/tr><tr><td>Proposed rate<\/td><td><strong>7.5%<\/strong> (reported in both AP and Seattle Times coverage)<\/td><\/tr><tr><td>Legal mechanism (Section 301 investigation? separate action?)<\/td><td><strong>Not yet confirmed<\/strong> in public reporting<\/td><\/tr><tr><td>Products / HTS codes covered<\/td><td><strong>Not yet specified<\/strong><\/td><\/tr><tr><td>Effective date<\/td><td><strong>Not announced<\/strong><\/td><\/tr><tr><td>Tied to a planned U.S.-China summit<\/td><td><strong>Reported<\/strong> (Seattle Times)<\/td><\/tr><\/tbody><\/table>\n<p>In short: this is a <strong>credible, fast-moving development — not a law yet.<\/strong> Treating it as either &quot;nothing will happen&quot; or &quot;it's already in effect&quot; are the two most expensive mistakes available. Both reports are wire-level journalism describing intent and movement, not a signed proclamation or a Federal Register notice.<\/p>\n<h2>Why 7.5% is a loaded number<\/h2>\n<p>If you've been working through Section 301 for years, 7.5% should sound familiar — and that familiarity is exactly why importers misread this story.<\/p>\n<ul>\n<li>The original Section 301 China actions (Lists 1–4A) imposed additional duties of <strong>7.5% to 25% on roughly $370 billion<\/strong> of imports (CRS, strtrade).<\/li>\n<li>Under the Phase One trade deal, duties on List 4A/4B goods were <strong>reduced to 7.5%<\/strong> effective February 2020 — meaning a large share of existing China imports already sits at a 7.5% Section 301 rate.<\/li>\n<\/ul>\n<p>So a new <strong>7.5%<\/strong> figure can get confused with the *existing* 7.5% on List 4A/4B goods. The two are not the same. The reported new tariff would be an <strong>additional layer<\/strong>, stacked on whatever your goods already carry — not a restatement of the old one. If both apply to your product, the math is <strong>existing rate + 7.5%<\/strong>, not a replacement.<\/p>\n<h2>What would change if it lands<\/h2>\n<p>Nothing is final, but the scenario is worth modeling now because it's cheap to model and expensive to ignore:<\/p>\n<ul>\n<li><strong>Landed cost jumps by 7.5 points on covered goods<\/strong> — on top of existing Section 301 (7.5%–25%), any Section 232 exposure, and the 2026 forced-labor measures (10%/12.5%). For a typical China-sourced product, this can move your all-in duty from &quot;manageable&quot; to &quot;margin-killing&quot; on specific SKUs.<\/li>\n<li><strong>Supplier negotiations happen before the tariff, not after.<\/strong> Chinese suppliers' ex-works prices won't drop because a U.S. tariff rises. If the action is real, the only levers are your own — re-negotiated incoterms, landed-cost re-modeling, or qualification for any exclusion process that may open.<\/li>\n<li><strong>Timing signal: the reported summit link.<\/strong> If the tariff is being teed up before a planned U.S.-China summit, the announcement window could be <strong>days to weeks away<\/strong>, and the summit itself could change the outcome (delay, carve-outs, or a bigger number). Plan around a decision, not around a guess.<\/li>\n<li><strong>Exclusions, if any, are a process you must actively join.<\/strong> In every prior Section 301 round, exclusion-eligible importers who didn't apply left real money on the table. Watch for USTR to open a comment or exclusion window — and be ready to document &quot;no domestic substitute available&quot; for your HTS lines.<\/li>\n<\/ul>\n<h2>What importers should do right now<\/h2>\n<ul>\n<li><strong>Check whether your HTS subheadings are even in scope.<\/strong> A new 7.5% tariff is not universal until the product list is published. Don't assume your goods are covered — and don't assume they aren't.<\/li>\n<li><strong>Re-run your landed-cost model two ways: with and without +7.5%.<\/strong> Identify which SKUs flip from profitable to loss-making. That list is your real exposure, not the headline.<\/li>\n<li><strong>Hold price-list rewrites and quote locks for the announcement.<\/strong> If you re-quote customers today on today's rates and a new layer lands next week, you're eating the difference or redoing the work — either way, at your cost.<\/li>\n<li><strong>Ask your customs broker to subscribe to the relevant Federal Register / USTR alerts.<\/strong> Brokers see official notices the same day; the official record, not wire reporting, is what determines your actual duty at entry.<\/li>\n<li><strong>Watch the summit.<\/strong> If a U.S.-China summit is confirmed, the tariff timing and size may shift right up to the announcement. Plan for the announcement to be the trigger for action — not the rumors.<\/li>\n<\/ul>\n<h2>The bigger picture: one more layer, not a reset<\/h2>\n<p>Even if this 7.5% action does not materialize, the trend line is unchanged: the effective U.S. tariff burden on Chinese goods has been climbing through 2025–2026, with multiple independent analyses projecting further increases into late 2026. The de minimis suspension continues, the 2026 forced-labor measures are separate and live, and the Section 301 family spans multiple actions. This new report is one more input into a planning environment where <strong>the default assumption should be &quot;duties go up,&quot; and the discipline should be verifying your own HTS lines against the official record.<\/strong><\/p>\n<h2>Bottom line<\/h2>\n<p>A new 7.5% tariff on Chinese goods over overcapacity is <strong>reported, fast-moving, and not yet law.<\/strong> The importers who win this round will be the ones who (a) know which of their SKUs are actually exposed, (b) have modeled the +7.5% scenario before it lands, and (c) refuse to build pricing on a headline — in either direction.<\/p>\n<p>Verify your HTS coverage, model both scenarios, and wait for the official notice before you lock in new quotes.<\/p>\n<hr>\n<p>*Need to check whether your specific HTS codes fall under the existing Section 301 actions — the baseline this new tariff would stack on — in five minutes? The <a href=\"https://lunarwave8803.gumroad.com/l/section301\" rel=\"noopener\">Section 301 Tariff Quick-Check Guide<\/a> walks through the action lists, the continuation/exclusion process, and the 2026 updates in a two-minute workflow.*<\/p>\n<p>*Disclaimer: This article is for general information only and is not legal, customs, or tax advice. Tariff determinations depend on your specific goods, HTS classification, and entry details. As of the publication date, the reported 7.5% tariff on Chinese goods had not been confirmed in the official record; always verify against USTR.gov and the Federal Register before making business decisions.*<\/p>\n<hr>\n<p><strong>Sources (verified via search 2026-08-26; all URLs real):<\/strong><\/p>\n<ul>\n<li>AP via Yahoo News — Trump moves toward levying new tariff on China for flooding market with cheap goods (Aug 24, 2026): https://www.yahoo.com/news/politics/articles/trump-moves-toward-levying-tariff-215222117.html<\/li>\n<li>The Seattle Times — U.S. Eyes China Overcapacity Tariffs of 7.5% Before Xi Visits (Aug 25, 2026): https://www.seattletimes.com/business/u-s-eyes-china-overcapacity-tariffs-of-7-5-before-xi-visits<\/li>\n<li>MyJournalCourier (AP wire) — Trump moves toward levying new tariff on China (7.5% under consideration, Aug 24, 2026): https://www.myjournalcourier.com/business/article/trump-moves-toward-levying-new-tariff-on-china-22401819.php<\/li>\n<li>CRS (congress.gov) — Section 301 and China (four rounds, 7.5%–25% on ~$370B): https://www.congress.gov/crs-product/IF12125<\/li>\n<li>STR Trade — Section 301 Tariffs on China (rate structure 7.5%–25%, Lists 1–4A): https://www.strtrade.com/trade-news-resources/tariff-actions-resources/section-301-tariffs-on-china<\/li>\n<li>Scarbrough Global — Section 301 Tariffs from China Summary (List duties reduced to 7.5% effective Feb 14, 2020): https://scarbroughglobal.com/section-301-tariffs-from-china-summary<\/li>\n<\/ul>","cta":"https://lu7897859-tech.github.io/doors/sourcing-audit/","ctaTitle":"Check a supplier for free, right now","ctaText":"Paste the supplier's 18-digit USCC or full registered name for an instant structural check — then go further with the full verification guide.","ctaBtn":"Open the free check"},"type":"article"};</script>
<script>
(function(){
  var D = window.DOOR || {};
  var t = D.type || 'door';
  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var ROOT = D.root || '';   // -> GH Pages root
  var UP = D.up || '';       // -> door dir ('' or '../')
  function isExt(u){ return /^https?:|^mailto:/.test(String(u||'')); }
  function dlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; if(u.charAt(0)==='#') return UP+'index.html'+u; return UP+u.replace(/^\.?\//,''); }
  function rlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; return ROOT+u.replace(/^\.?\//,''); }
  document.getElementById('brand').textContent = D.brand || '';

  // nav
  var nav = document.getElementById('nav');
  (D.nav || []).forEach(function(n){ nav.appendChild(el('<a href="'+dlink(n.href)+'">'+esc(n.label)+'</a>')); });

  var app = document.getElementById('app');

  function renderDoor(){
    var h = D.hero || {};
    var html = '';
    html += '<section class="hero"><div class="wrap">';
    if(h.eyebrow) html += '<span class="eyebrow">'+esc(h.eyebrow)+'</span>';
    html += '<h1>'+esc(h.h1||'')+'</h1>';
    if(h.sub) html += '<p class="sub">'+esc(h.sub)+'</p>';
    // demo box
    html += '<div class="demo"><div class="dt"><span>'+esc(h.demoTitle||'Try it free')+'</span><b>'+esc(h.demoBadge||'Live')+'</b></div>';
    html += '<div class="row"><input id="dq" placeholder="'+esc(h.demoPlaceholder||'')+'" aria-label="'+esc(h.demoLabel||'query')+'">';
    html += '<button id="db">'+esc(h.demoBtn||'Check')+'</button></div>';
    html += '<div class="out" id="dout"></div>';
    if(h.demoNote) html += '<div class="note">'+esc(h.demoNote)+'</div>';
    html += '</div>';
    if((D.trust||[]).length){ html += '<div class="trust">'+D.trust.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'; }
    html += '</div></section>';

    if((D.steps||[]).length){
      html += '<section><div class="wrap"><h2>'+esc(D.stepsTitle||'How it works')+'</h2><p class="sect-sub">'+esc(D.stepsSub||'')+'</p><div class="grid g3">';
      D.steps.forEach(function(s,i){ html += '<div class="card"><div class="step-n">'+(i+1)+'</div><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div>'; });
      html += '</div></div></section>';
    }

    if((D.products||[]).length){
      html += '<section id="products"><div class="wrap"><h2>'+esc(D.productsTitle||'Products')+'</h2><p class="sect-sub">'+esc(D.productsSub||'')+'</p><div class="grid g3">';
      D.products.forEach(function(p){
        html += '<div class="card prod"><div class="p-top"><div><h3>'+esc(p.name)+'</h3></div>'+(p.price?'<span class="price">'+esc(p.price)+'</span>':'')+'</div>';
        if(p.tagline) html += '<p>'+esc(p.tagline)+'</p>';
        if((p.bullets||[]).length) html += '<ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
        if(p.page) html += '<a class="btn ghost" href="'+dlink(p.page)+'">Details</a>';
        if(p.cta) html += '<a class="btn" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a>';
        html += '</div>';
      });
      html += '</div></div></section>';
    }

    if((D.tiers||[]).length){
      html += '<section id="pricing"><div class="wrap"><h2>'+esc(D.tiersTitle||'Pricing')+'</h2><p class="sect-sub">'+esc(D.tiersSub||'')+'</p><div class="grid g3 tiers">';
      D.tiers.forEach(function(t){
        html += '<div class="card tier'+(t.popular?' pop':'')+'">'+(t.popular?'<span class="badge">'+(esc(t.badge||'Popular'))+'</span>':'')+'<h3>'+esc(t.name)+'</h3><div class="amt">'+esc(t.price)+'</div><div class="per">'+esc(t.per||'')+'</div><ul>'+ (t.features||[]).map(function(f){return '<li>'+esc(f)+'</li>';}).join('') +'</ul>';
        html += '<a class="btn'+(t.ghost?' ghost':'')+'" href="'+dlink(t.cta)+'" rel="noopener">'+esc(t.ctaText||'Choose')+'</a></div>';
      });
      html += '</div></div></section>';
    }

    if((D.faq||[]).length){
      html += '<section id="faq"><div class="wrap"><h2>FAQ</h2><p class="sect-sub"></p><div class="faq">';
      D.faq.forEach(function(f){ html += '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>'; });
      html += '</div></div></section>';
    }
    app.innerHTML = html;
    wireDemo();
  }

  function renderProduct(){
    var p = D.product || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('index.html')+'">← '+esc(D.brand)+'</a></p>';
    html += '<h1>'+esc(p.name)+'</h1>';
    if(p.tagline) html += '<p class="sub" style="margin:0 0 10px">'+esc(p.tagline)+'</p>';
    html += '<p>'+(p.price?'<span class="pill">'+esc(p.price)+'</span>':'')+((p.tags||[]).map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join(''))+'</p>';
    if((p.bullets||[]).length) html += '<h3>What you get</h3><ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
    if(p.sample) html += '<h3>Sample output</h3><pre class="out">'+esc(p.sample)+'</pre>';
    if(p.body) html += p.body; // trusted markdown-lite html from config
    if(p.cta) html += '<p style="margin-top:22px"><a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:700" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a></p>';
    if((D.related||[]).length){
      html += '<h3>Related</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function wireDemo(){
    var inp = document.getElementById('dq'), btn = document.getElementById('db'), out = document.getElementById('dout');
    if(!inp||!btn) return;
    function setOut(msg, cls){ out.className = 'out' + (cls?(' '+cls):''); out.textContent = msg; }

    // ---- client-side USCC (Unified Social Credit Code) checker: real, zero-dependency free hook ----
    var CS = '0123456789ABCDEFGHJKLMNPQRTUWXY';
    var W = [1,3,9,27,19,26,16,17,20,29,25,13,8,24,10,30,28];
    var REG = {'1':'Market regulation','5':'Civil affairs','9':'Other','Y':'Other','1A':'Regulator A'};
    function decodeUSCC(code){
      var s = String(code||'').toUpperCase().replace(/\s+/g,'');
      if(s.length!==18) return {ok:false, reason:'Length is '+s.length+', a USCC is exactly 18 characters.'};
      for(var i=0;i<18;i++){ if(CS.indexOf(s.charAt(i))<0) return {ok:false, reason:'Invalid character "'+s.charAt(i)+'" (letters I, O, S, V, Z are not used).'}; }
      var sum=0; for(var j=0;j<17;j++) sum += CS.indexOf(s.charAt(j))*W[j];
      var expect = CS.charAt((31 - (sum % 31)) % 31);
      var ok = (expect === s.charAt(17));
      return {ok:ok, expect:expect, given:s.charAt(17),
        region:s.slice(2,8), org: s.charAt(8), kind: s.charAt(9), serial:s.slice(10,17)};
    }
    function explain(x){
      if(x.ok){
        return '✅ Structurally valid USCC\n\n'+
          'Region / admin code : '+x.region+'\n'+
          'Entity-type code   : '+x.kind+'\n'+
          'Org code           : '+x.org+'\n'+
          'Serial             : '+x.serial+'\n'+
          'Check digit        : '+x.given+' (valid)\n\n'+
          'Format checks out. What a valid code does NOT tell you: whether the company is still active, who really owns it, or whether it has litigation, sanctions or adverse media. That is what the full report covers.';
      }
      return '❌ Not a structurally valid USCC\n\n'+x.reason+'\n\nTip: paste the 18-character Unified Social Credit Code from the supplier\u2019s business licence, or try the company\u2019s full registered name.';
    }

    async function run(){
      var q = (inp.value||'').trim();
      if(!q){ setOut(D.demoEmpty||'Please enter a company name or 18-digit registration number.','err'); return; }
      btn.disabled = true; var old = btn.textContent; btn.textContent = D.demoBusy||'Checking…';
      try{
        if(D.demoMode === 'uscc'){
          setOut(D.demoBusy||'Checking…','');
          var x = decodeUSCC(q);
          setOut(explain(x), x.ok?'ok':'err');
          beacon(q, x.ok?'valid':'invalid');
        } else if(D.demoMode === 'endpoint' && D.demoEndpoint){
          setOut(D.demoBusy||'Contacting verification service…','');
          var r = await fetch(D.demoEndpoint, { method:'POST', headers:{'content-type':'application/json','accept':'application/json'}, body: JSON.stringify({ keyword: q, tool:'verify_supplier' }) });
          var txt = await r.text(); var j=null; try{ j=JSON.parse(txt); }catch(e){}
          if(r.status===200 && j){ setOut(JSON.stringify(j,null,2).substring(0,1400),'ok'); }
          else if(r.status===402){ setOut((D.paywallNote||'Free instant checks used. Get the full verified report to continue.'),'err'); }
          else { setOut('Service returned status '+r.status+'. '+(D.demoFallback||''),'err'); }
        } else {
          var x2 = decodeUSCC(q);
          setOut(explain(x2), x2.ok?'ok':'err');
        }
      }catch(e){
        setOut((D.demoOffline||'The live demo is momentarily unavailable. The full verification report still works.')+'\n\n'+(D.demoEndpoint||''),'err');
      }
      btn.disabled=false; btn.textContent=old;
    }
    // anonymous use-signal: lets us see the first real visitor arrive (never sent to the supplier)
    function beacon(q, result){
      if(!D.demoEndpoint) return;
      try{
        fetch(D.demoEndpoint, { method:'POST', keepalive:true, headers:{'content-type':'application/json'}, body: JSON.stringify({ keyword:q, tool:'verify_supplier', source:'door-free-hook', result:result }) }).catch(function(){});
      }catch(e){}
    }
    btn.addEventListener('click',run);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  }

  function renderArticle(){
    var a = D.article || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('blog/index.html')+'">← All guides</a></p>';
    html += '<h1>'+esc(a.title)+'</h1>';
    if(a.desc) html += '<p class="sub" style="margin:0 0 18px">'+esc(a.desc)+'</p>';
    if((a.tags||[]).length) html += '<p>'+a.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
    html += '<div data-article>'+(a.html||'')+'</div>';
    if(a.cta){
      html += '<div class="card" style="margin-top:30px;border-color:var(--accent)"><h3>'+esc(a.ctaTitle||'Check a supplier now')+'</h3><p style="margin-bottom:14px">'+esc(a.ctaText||'')+'</p>';
      html += '<a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700" href="'+dlink(a.cta)+'" rel="noopener">'+esc(a.ctaBtn||'Open the free check')+'</a></div>';
    }
    if((D.related||[]).length){
      html += '<h3>Related guides</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function renderBlogIndex(){
    var posts = D.posts || [];
    var html = '<section class="hero"><div class="wrap"><span class="eyebrow">'+esc(D.blogEyebrow||'Guides')+'</span><h1>'+esc(D.blogTitle||'China sourcing guides')+'</h1>';
    if(D.blogSub) html += '<p class="sub">'+esc(D.blogSub)+'</p>';
    html += '</div></section><section><div class="wrap"><div class="grid g2">';
    posts.forEach(function(p){
      html += '<div class="card"><h3><a href="'+dlink(p.href)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.desc||'')+'</p>';
      if(p.tags&&p.tags.length) html += '<p style="margin-top:10px">'+p.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
      html += '</div>';
    });
    html += '</div></div></section>';
    app.innerHTML = html;
  }

  if(t==='product') renderProduct(); else if(t==='article') renderArticle(); else if(t==='blog') renderBlogIndex(); else renderDoor();

  // footer
  var foot = document.getElementById('foot');
  (D.footer||[]).forEach(function(col){
    foot.appendChild(el('<div><h4>'+esc(col.t)+'</h4>'+ (col.links||[]).map(function(l){ return '<a href="'+rlink(l.href)+'"'+(isExt(l.href)?' rel="noopener"':'')+'>'+esc(l.label)+'</a>'; }).join('') +'</div>'));
  });
  document.getElementById('legalLeft').textContent = D.legalLeft || ('© ' + new Date().getFullYear() + ' ' + (D.brand||''));
  document.getElementById('legalRight').textContent = D.legalRight || '';
})();
</script>
