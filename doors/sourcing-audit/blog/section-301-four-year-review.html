full registered name for an instant structural check — then go further with the full verification guide.","articleCtaBtn":"Open the free check","articlesRelated":[{"label":"Free instant USCC check","href":"../free-uscc-check.html"},{"label":"Tariff stack calculator","href":"../tools/tariff-stack-calculator.html"},{"label":"Pricing & reports","href":"../index.html#pricing"},{"label":"MCP server for AI agents","href":"../mcp-server.html"},{"label":"12 China sourcing scams in 2026","href":"../../articles/12-china-sourcing-scams-2026.html"}],"related":[{"label":"12 China Sourcing Scams in 2026","href":"articles/12-china-sourcing-scams-2026.html"},{"label":"Free USCC checker","href":"doors/sourcing-audit/free-uscc-check.html"}],"article":{"title":"Section 301 Four-Year Review: Will China Tariffs End August 23, 2026?","desc":"If you import from China, August 23, 2026 is a date you should have circled months ago. That's the statutory four-year anniversary of the 2018 Section 3","tags":["tariffs","section 301","policy"],"html":"<p><strong>Filename:<\/strong> 20260820_030_section301_fouryear_review_seo.md<\/p>\n<p><strong>Date:<\/strong> 2026-08-20<\/p>\n<p><strong>Series:<\/strong> 026-030（关税系列第 3 篇，衔接 026 关税地图）<\/p>\n<p><strong>Target keyword:<\/strong> section 301 four year review august 23 2026 / will china tariffs end / section 301 continuation request<\/p>\n<p><strong>Product tie-in:<\/strong> https://lunarwave8803.gumroad.com/l/section301（Section 301 Tariff Quick-Check Guide, $9）<\/p>\n<p><strong>Word count target:<\/strong> ~1150 words（正文）<\/p>\n<hr>\n<h2>Will Section 301 China Tariffs End August 23, 2026? The Four-Year Review Deadline, Explained<\/h2>\n<p><strong>Meta description:<\/strong> The statutory four-year review of the 2018 Section 301 China tariffs hits its deadline August 23, 2026. Here's what importers need to know — and what happens if the action terminates.<\/p>\n<hr>\n<p>If you import from China, August 23, 2026 is a date you should have circled months ago. That's the statutory four-year anniversary of the 2018 Section 301 trade action — and under U.S. trade law, if no one asks to keep it alive, it lapses.<\/p>\n<p>Here's the problem: most importers won't know what happened until after it happens. By then, your landed-cost model, your price lists, and your supplier contracts may all be built on the wrong assumption.<\/p>\n<p>This guide walks through what the four-year review actually is, the real deadlines, and the three scenarios every importer should plan for.<\/p>\n<h2>What is the four-year review?<\/h2>\n<p>Section 301 of the Trade Act of 1974 lets the U.S. Trade Representative (USTR) investigate and respond to foreign trade practices it considers unfair. The tariff actions on Chinese goods that took effect in July 2018 and August 2018 were taken under this authority.<\/p>\n<p>The law also has a sunset mechanism: <strong>each Section 301 action expires four years after it takes effect, unless a continuation is requested and the review determines the action is still warranted.<\/strong><\/p>\n<p>On May 6, 2026, USTR formally initiated the second four-year review of these actions — the notice was published in the Federal Register (document 2026-08806). That started two parallel clocks running toward two different expiration dates.<\/p>\n<h2>The two deadlines that matter<\/h2>\n<p>The 2018 actions fall into two groups, and they expire on different dates:<\/p>\n<table><thead><tr><th>Action<\/th><th>Effective date<\/th><th>Expiration if no continuation<\/th><\/tr><\/thead><tbody><tr><td>List 1 (approx. $34B of imports, 25% duties)<\/td><td>July 6, 2018<\/td><td><strong>July 6, 2026<\/strong><\/td><\/tr><tr><td>List 3 (approx. $200B of imports, 25% duties)<\/td><td>August 23, 2018<\/td><td><strong>August 23, 2026<\/strong><\/td><\/tr><\/tbody><\/table>\n<p><strong>The July 6 deadline has already passed.<\/strong> That group's status is now a matter of official record — and with it settled, all attention is on the second clock: <strong>the August 23, 2026 termination date, which falls this Sunday.<\/strong><\/p>\n<h2>When did the continuation window close?<\/h2>\n<p>USTR set a specific window for interested parties to request continuation of each action:<\/p>\n<ul>\n<li><strong>July 6, 2018 action:<\/strong> requests accepted <strong>May 7 – July 5, 2026<\/strong> (now closed)<\/li>\n<li><strong>August 23, 2018 action:<\/strong> requests accepted <strong>June 24 – August 22, 2026<\/strong> — <strong>the window closes this Saturday, August 22, 2026<\/strong><\/li>\n<\/ul>\n<p>In plain terms: <strong>as of today (August 20), the official window to request continuation of the August 23 action closes at the end of Saturday, August 22 — just over two days from now.<\/strong> If a continuation request has been filed, the action stays in place while USTR conducts the review. If no request was received, the action terminates on August 23.<\/p>\n<p>Sources for these dates: the Federal Register initiation notice (May 6, 2026), USTR's Four-Year Review page, and the summaries published by KPMG (May 5), Thompson Hines (May 6), Steptoe (May 13), and Baker Botts (May 8), all of which confirm the same request windows and termination dates.<\/p>\n<h2>What actually happens on August 23?<\/h2>\n<p>Three scenarios — and they produce very different planning situations:<\/p>\n<p><strong>Scenario 1: Continuation requested (most likely for this action).<\/strong> The tariffs stay in effect while USTR conducts its review. Expect continued 25% duties and no refunds. The only change: the review process itself may lead to adjustments — and possibly new exclusion requests, which importers should watch for.<\/p>\n<p><strong>Scenario 2: No request received — action terminates.<\/strong> The additional duties would stop applying to goods entered on or after the termination date. This is the &quot;tariff drop&quot; scenario. Note: termination does <strong>not<\/strong> automatically refund duties paid before that date, and it does not roll back other tariff layers (Section 232, de minimis rules, and the 2025-2026 trade actions all remain separate).<\/p>\n<p><strong>Scenario 3: Continuation requested but review later modifies the action.<\/strong> USTR can adjust product coverage, duty rates, or exclusions as part of the review outcome. This is where the real supply-chain decisions get made — and where most of the 2027 planning will happen.<\/p>\n<h2>What importers should do right now (checklist)<\/h2>\n<ul>\n<li><strong>Confirm the continuation status for the August 23 action.<\/strong> Check USTR's Four-Year Review page and the Federal Register notice. Do not rely on news headlines — verify the official record.<\/li>\n<li><strong>Re-run your landed-cost model under both scenarios.<\/strong> A 25% duty swing on your top HTS codes changes margin math. Model &quot;duties continue&quot; and &quot;duties end&quot; and see which of your SKUs flip from loss to profit.<\/li>\n<li><strong>Hold off on price-list rewrites until the official record is clear.<\/strong> If the action terminates, your suppliers will still be quoting you the same ex-works prices — the change is on the U.S. side, and your customers will ask why your prices didn't move.<\/li>\n<li><strong>Check whether your goods fall under the action at all.<\/strong> Not every China import is covered. HTS subheadings outside the 2018 action lists are unaffected by this review — but they may still be subject to other tariff layers.<\/li>\n<li><strong>Watch the exclusion process.<\/strong> If the action is continued, USTR typically opens or maintains exclusion mechanisms. Exclusion-eligible importers who don't apply leave money on the table.<\/li>\n<li><strong>Remember: this review only covers the 2018 actions.<\/strong> The broader tariff landscape — including the 2026 forced-labor Section 301 measures (10%/12.5%) and the de minimis rules — is separate. Economist projections (e.g., Allianz Research, July 2026) put the effective U.S. tariff rate on Chinese goods still climbing into Q4 2026 even with these reviews running.<\/li>\n<\/ul>\n<h2>The bigger picture: this is not the end of tariffs<\/h2>\n<p>A common misread is &quot;August 23 = tariffs end.&quot; That's wrong in three ways:<\/p>\n<ul>\n<li>The August 23 action is one of <strong>several<\/strong> Section 301 actions; earlier actions and later measures continue independently.<\/li>\n<li>Termination only happens if no continuation was requested — and a continuation request for this action was expected well before the window closes.<\/li>\n<li>Even a full termination of the 2018 actions leaves the 2025-2026 tariff regime (Section 232, de minimis changes, forced-labor 301) in place. The effective tariff rate on China imports is projected to keep rising into Q4 2026, not falling.<\/li>\n<\/ul>\n<p>In other words: <strong>the review is a milestone, not a reset.<\/strong><\/p>\n<h2>Bottom line for your business<\/h2>\n<p>The August 23, 2026 four-year review deadline is a genuine planning trigger, not a headline event. The window for continuation requests closes <strong>August 22<\/strong> — so by Monday morning, the official record will tell you which scenario you're in.<\/p>\n<p>Do the checklist above now, while the window is still open. The importers who benefit are the ones who modeled both scenarios before the deadline — not the ones who read about it after.<\/p>\n<hr>\n<p>*Need to check whether your specific HTS codes fall under the Section 301 actions — and what to do about it in 5 minutes? The <a href=\"https://lunarwave8803.gumroad.com/l/section301\" rel=\"noopener\">Section 301 Tariff Quick-Check Guide<\/a> ($9) walks through the action lists, the exclusion process, and the 2026 updates in a two-minute workflow.*<\/p>\n<p>*Disclaimer: This article is for general information only and is not legal, customs, or tax advice. Tariff determinations depend on your specific goods, HTS classification, and entry details. Always verify the official record at USTR.gov and the Federal Register before making business decisions.*<\/p>\n<hr>\n<p><strong>Sources (all verified via search 2026-08-20):<\/strong><\/p>\n<ul>\n<li>Federal Register — Initiation of Second Four-Year Review Process (2026-08806, May 6, 2026): https://www.federalregister.gov/documents/2026/05/06/2026-08806/initiation-of-second-four-year-review-process-chinas-acts-policies-and-practices-related-to<\/li>\n<li>USTR — Four-Year Review page: https://ustr.gov/trade-topics/enforcement/section-301-investigations/section-301-china-technology-transfer/china-section-301-tariff-actions-and-exclusion-process/four-year-review<\/li>\n<li>KPMG TaxNewsFlash (May 5, 2026): https://kpmg.com/us/en/taxnewsflash/news/2026/05/ustr-second-four-year-review-china-section-301-tariffs.html<\/li>\n<li>Thompson Hines (May 6, 2026): https://www.thompsonhinesmartrade.com/2026/05/ustr-initiates-second-four-year-review-of-section-301-tariff-actions-on-imports-of-certain-chinese-products<\/li>\n<li>Steptoe (May 13, 2026): https://www.steptoe.com/en/news-publications/global-trade-and-investment-law-blog/ustr-initiates-second-four-year-review-of-section-301-china-technology-transfer-tariffs.html<\/li>\n<li>Baker Botts Tariff Tracker (May 8, 2026): https://ourtake.bakerbotts.com/post/102ms7t/trump-tariff-tracker-may-8-2026<\/li>\n<li>Allianz Research — Trade war 3.0 (July 22, 2026): https://www.allianz.com/content/dam/onemarketing/azcom/Allianz_com/economic-research/publications/specials/en/2026/july/2026_07_22_Trade-war-update.pdf<\/li>\n<\/ul>","cta":"https://lu7897859-tech.github.io/doors/sourcing-audit/","ctaTitle":"Check a supplier for free, right now","ctaText":"Paste the supplier's 18-digit USCC or full registered name for an instant structural check — then go further with the full verification guide.","ctaBtn":"Open the free check"},"type":"article"};</script>
<script>
(function(){
  var D = window.DOOR || {};
  var t = D.type || 'door';
  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var ROOT = D.root || '';   // -> GH Pages root
  var UP = D.up || '';       // -> door dir ('' or '../')
  function isExt(u){ return /^https?:|^mailto:/.test(String(u||'')); }
  function dlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; if(u.charAt(0)==='#') return UP+'index.html'+u; return UP+u.replace(/^\.?\//,''); }
  function rlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; return ROOT+u.replace(/^\.?\//,''); }
  document.getElementById('brand').textContent = D.brand || '';

  // nav
  var nav = document.getElementById('nav');
  (D.nav || []).forEach(function(n){ nav.appendChild(el('<a href="'+dlink(n.href)+'">'+esc(n.label)+'</a>')); });

  var app = document.getElementById('app');

  function renderDoor(){
    var h = D.hero || {};
    var html = '';
    html += '<section class="hero"><div class="wrap">';
    if(h.eyebrow) html += '<span class="eyebrow">'+esc(h.eyebrow)+'</span>';
    html += '<h1>'+esc(h.h1||'')+'</h1>';
    if(h.sub) html += '<p class="sub">'+esc(h.sub)+'</p>';
    // demo box
    html += '<div class="demo"><div class="dt"><span>'+esc(h.demoTitle||'Try it free')+'</span><b>'+esc(h.demoBadge||'Live')+'</b></div>';
    html += '<div class="row"><input id="dq" placeholder="'+esc(h.demoPlaceholder||'')+'" aria-label="'+esc(h.demoLabel||'query')+'">';
    html += '<button id="db">'+esc(h.demoBtn||'Check')+'</button></div>';
    html += '<div class="out" id="dout"></div>';
    if(h.demoNote) html += '<div class="note">'+esc(h.demoNote)+'</div>';
    html += '</div>';
    if((D.trust||[]).length){ html += '<div class="trust">'+D.trust.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'; }
    html += '</div></section>';

    if((D.steps||[]).length){
      html += '<section><div class="wrap"><h2>'+esc(D.stepsTitle||'How it works')+'</h2><p class="sect-sub">'+esc(D.stepsSub||'')+'</p><div class="grid g3">';
      D.steps.forEach(function(s,i){ html += '<div class="card"><div class="step-n">'+(i+1)+'</div><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div>'; });
      html += '</div></div></section>';
    }

    if((D.products||[]).length){
      html += '<section id="products"><div class="wrap"><h2>'+esc(D.productsTitle||'Products')+'</h2><p class="sect-sub">'+esc(D.productsSub||'')+'</p><div class="grid g3">';
      D.products.forEach(function(p){
        html += '<div class="card prod"><div class="p-top"><div><h3>'+esc(p.name)+'</h3></div>'+(p.price?'<span class="price">'+esc(p.price)+'</span>':'')+'</div>';
        if(p.tagline) html += '<p>'+esc(p.tagline)+'</p>';
        if((p.bullets||[]).length) html += '<ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
        if(p.page) html += '<a class="btn ghost" href="'+dlink(p.page)+'">Details</a>';
        if(p.cta) html += '<a class="btn" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a>';
        html += '</div>';
      });
      html += '</div></div></section>';
    }

    if((D.tiers||[]).length){
      html += '<section id="pricing"><div class="wrap"><h2>'+esc(D.tiersTitle||'Pricing')+'</h2><p class="sect-sub">'+esc(D.tiersSub||'')+'</p><div class="grid g3 tiers">';
      D.tiers.forEach(function(t){
        html += '<div class="card tier'+(t.popular?' pop':'')+'">'+(t.popular?'<span class="badge">'+(esc(t.badge||'Popular'))+'</span>':'')+'<h3>'+esc(t.name)+'</h3><div class="amt">'+esc(t.price)+'</div><div class="per">'+esc(t.per||'')+'</div><ul>'+ (t.features||[]).map(function(f){return '<li>'+esc(f)+'</li>';}).join('') +'</ul>';
        html += '<a class="btn'+(t.ghost?' ghost':'')+'" href="'+dlink(t.cta)+'" rel="noopener">'+esc(t.ctaText||'Choose')+'</a></div>';
      });
      html += '</div></div></section>';
    }

    if((D.faq||[]).length){
      html += '<section id="faq"><div class="wrap"><h2>FAQ</h2><p class="sect-sub"></p><div class="faq">';
      D.faq.forEach(function(f){ html += '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>'; });
      html += '</div></div></section>';
    }
    app.innerHTML = html;
    wireDemo();
  }

  function renderProduct(){
    var p = D.product || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('index.html')+'">← '+esc(D.brand)+'</a></p>';
    html += '<h1>'+esc(p.name)+'</h1>';
    if(p.tagline) html += '<p class="sub" style="margin:0 0 10px">'+esc(p.tagline)+'</p>';
    html += '<p>'+(p.price?'<span class="pill">'+esc(p.price)+'</span>':'')+((p.tags||[]).map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join(''))+'</p>';
    if((p.bullets||[]).length) html += '<h3>What you get</h3><ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
    if(p.sample) html += '<h3>Sample output</h3><pre class="out">'+esc(p.sample)+'</pre>';
    if(p.body) html += p.body; // trusted markdown-lite html from config
    if(p.cta) html += '<p style="margin-top:22px"><a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:700" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a></p>';
    if((D.related||[]).length){
      html += '<h3>Related</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function wireDemo(){
    var inp = document.getElementById('dq'), btn = document.getElementById('db'), out = document.getElementById('dout');
    if(!inp||!btn) return;
    function setOut(msg, cls){ out.className = 'out' + (cls?(' '+cls):''); out.textContent = msg; }

    // ---- client-side USCC (Unified Social Credit Code) checker: real, zero-dependency free hook ----
    var CS = '0123456789ABCDEFGHJKLMNPQRTUWXY';
    var W = [1,3,9,27,19,26,16,17,20,29,25,13,8,24,10,30,28];
    var REG = {'1':'Market regulation','5':'Civil affairs','9':'Other','Y':'Other','1A':'Regulator A'};
    function decodeUSCC(code){
      var s = String(code||'').toUpperCase().replace(/\s+/g,'');
      if(s.length!==18) return {ok:false, reason:'Length is '+s.length+', a USCC is exactly 18 characters.'};
      for(var i=0;i<18;i++){ if(CS.indexOf(s.charAt(i))<0) return {ok:false, reason:'Invalid character "'+s.charAt(i)+'" (letters I, O, S, V, Z are not used).'}; }
      var sum=0; for(var j=0;j<17;j++) sum += CS.indexOf(s.charAt(j))*W[j];
      var expect = CS.charAt((31 - (sum % 31)) % 31);
      var ok = (expect === s.charAt(17));
      return {ok:ok, expect:expect, given:s.charAt(17),
        region:s.slice(2,8), org: s.charAt(8), kind: s.charAt(9), serial:s.slice(10,17)};
    }
    function explain(x){
      if(x.ok){
        return '✅ Structurally valid USCC\n\n'+
          'Region / admin code : '+x.region+'\n'+
          'Entity-type code   : '+x.kind+'\n'+
          'Org code           : '+x.org+'\n'+
          'Serial             : '+x.serial+'\n'+
          'Check digit        : '+x.given+' (valid)\n\n'+
          'Format checks out. What a valid code does NOT tell you: whether the company is still active, who really owns it, or whether it has litigation, sanctions or adverse media. That is what the full report covers.';
      }
      return '❌ Not a structurally valid USCC\n\n'+x.reason+'\n\nTip: paste the 18-character Unified Social Credit Code from the supplier\u2019s business licence, or try the company\u2019s full registered name.';
    }

    async function run(){
      var q = (inp.value||'').trim();
      if(!q){ setOut(D.demoEmpty||'Please enter a company name or 18-digit registration number.','err'); return; }
      btn.disabled = true; var old = btn.textContent; btn.textContent = D.demoBusy||'Checking…';
      try{
        if(D.demoMode === 'uscc'){
          setOut(D.demoBusy||'Checking…','');
          var x = decodeUSCC(q);
          setOut(explain(x), x.ok?'ok':'err');
          beacon(q, x.ok?'valid':'invalid');
        } else if(D.demoMode === 'endpoint' && D.demoEndpoint){
          setOut(D.demoBusy||'Contacting verification service…','');
          var r = await fetch(D.demoEndpoint, { method:'POST', headers:{'content-type':'application/json','accept':'application/json'}, body: JSON.stringify({ keyword: q, tool:'verify_supplier' }) });
          var txt = await r.text(); var j=null; try{ j=JSON.parse(txt); }catch(e){}
          if(r.status===200 && j){ setOut(JSON.stringify(j,null,2).substring(0,1400),'ok'); }
          else if(r.status===402){ setOut((D.paywallNote||'Free instant checks used. Get the full verified report to continue.'),'err'); }
          else { setOut('Service returned status '+r.status+'. '+(D.demoFallback||''),'err'); }
        } else {
          var x2 = decodeUSCC(q);
          setOut(explain(x2), x2.ok?'ok':'err');
        }
      }catch(e){
        setOut((D.demoOffline||'The live demo is momentarily unavailable. The full verification report still works.')+'\n\n'+(D.demoEndpoint||''),'err');
      }
      btn.disabled=false; btn.textContent=old;
    }
    // anonymous use-signal: lets us see the first real visitor arrive (never sent to the supplier)
    function beacon(q, result){
      if(!D.demoEndpoint) return;
      try{
        fetch(D.demoEndpoint, { method:'POST', keepalive:true, headers:{'content-type':'application/json'}, body: JSON.stringify({ keyword:q, tool:'verify_supplier', source:'door-free-hook', result:result }) }).catch(function(){});
      }catch(e){}
    }
    btn.addEventListener('click',run);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  }

  function renderArticle(){
    var a = D.article || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('blog/index.html')+'">← All guides</a></p>';
    html += '<h1>'+esc(a.title)+'</h1>';
    if(a.desc) html += '<p class="sub" style="margin:0 0 18px">'+esc(a.desc)+'</p>';
    if((a.tags||[]).length) html += '<p>'+a.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
    html += '<div data-article>'+(a.html||'')+'</div>';
    if(a.cta){
      html += '<div class="card" style="margin-top:30px;border-color:var(--accent)"><h3>'+esc(a.ctaTitle||'Check a supplier now')+'</h3><p style="margin-bottom:14px">'+esc(a.ctaText||'')+'</p>';
      html += '<a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700" href="'+dlink(a.cta)+'" rel="noopener">'+esc(a.ctaBtn||'Open the free check')+'</a></div>';
    }
    if((D.related||[]).length){
      html += '<h3>Related guides</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function renderBlogIndex(){
    var posts = D.posts || [];
    var html = '<section class="hero"><div class="wrap"><span class="eyebrow">'+esc(D.blogEyebrow||'Guides')+'</span><h1>'+esc(D.blogTitle||'China sourcing guides')+'</h1>';
    if(D.blogSub) html += '<p class="sub">'+esc(D.blogSub)+'</p>';
    html += '</div></section><section><div class="wrap"><div class="grid g2">';
    posts.forEach(function(p){
      html += '<div class="card"><h3><a href="'+dlink(p.href)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.desc||'')+'</p>';
      if(p.tags&&p.tags.length) html += '<p style="margin-top:10px">'+p.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
      html += '</div>';
    });
    html += '</div></div></section>';
    app.innerHTML = html;
  }

  if(t==='product') renderProduct(); else if(t==='article') renderArticle(); else if(t==='blog') renderBlogIndex(); else renderDoor();

  // footer
  var foot = document.getElementById('foot');
  (D.footer||[]).forEach(function(col){
    foot.appendChild(el('<div><h4>'+esc(col.t)+'</h4>'+ (col.links||[]).map(function(l){ return '<a href="'+rlink(l.href)+'"'+(isExt(l.href)?' rel="noopener"':'')+'>'+esc(l.label)+'</a>'; }).join('') +'</div>'));
  });
  document.getElementById('legalLeft').textContent = D.legalLeft || ('© ' + new Date().getFullYear() + ' ' + (D.brand||''));
  document.getElementById('legalRight').textContent = D.legalRight || '';
})();
</script>
</body>
</html>
