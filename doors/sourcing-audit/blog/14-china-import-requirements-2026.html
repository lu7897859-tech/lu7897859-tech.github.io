stered name for an instant structural check — then go further with the full verification guide.","articleCtaBtn":"Open the free check","articlesRelated":[{"label":"Free instant USCC check","href":"../free-uscc-check.html"},{"label":"Tariff stack calculator","href":"../tools/tariff-stack-calculator.html"},{"label":"Pricing & reports","href":"../index.html#pricing"},{"label":"MCP server for AI agents","href":"../mcp-server.html"},{"label":"12 China sourcing scams in 2026","href":"../../articles/12-china-sourcing-scams-2026.html"}],"related":[{"label":"12 China Sourcing Scams in 2026","href":"articles/12-china-sourcing-scams-2026.html"},{"label":"Free USCC checker","href":"doors/sourcing-audit/free-uscc-check.html"}],"article":{"title":"China Import Requirements Checklist for 2026","desc":"A practical checklist for importing from China: HS classification, customs, labeling, duties, and the documents you need before your shipment lands.","tags":["importing from china","customs","hs codes","import compliance"],"html":"<p>Importing from China is not hard because of any single rule. It is hard because the requirements sit with different authorities, apply at different moments, and fail in different ways. A shipment can clear customs and still be unsellable because the label is wrong. A label can be perfect while the goods sit because the duty was miscalculated.<\/p>\n<p>This guide lays out the requirements in the order they hit you, from before you order to after the goods land. It stays general on purpose. Your product and your destination country determine the specifics, and the specifics always come from the destination side, not from the supplier.<\/p>\n<h2>Before you order: classify the product<\/h2>\n<p>Everything downstream depends on one thing: how your product is classified.<\/p>\n<p><strong>HS codes.<\/strong> The Harmonized System is an international classification used by customs authorities worldwide. Your product will have an HS code, and that code determines duty rates, whether a permit or licence is required, and whether special rules apply. Countries extend the international six-digit system with their own additional digits, so the full code is country-specific.<\/p>\n<p>Get the code wrong and the consequences cascade. A wrong code can mean the wrong duty, a refused entry, or a missed requirement that only surfaces after arrival. Ask your supplier for their suggested code, then confirm it against your destination customs authority's own tariff schedule. Do not treat the supplier's code as authoritative — they know their production, not your import law.<\/p>\n<p><strong>Trade agreements.<\/strong> Check whether your country has a preferential arrangement with China. Where one exists, a lower or zero duty rate may apply, but it almost always depends on documentation such as a certificate of origin, and on the goods actually qualifying. Do not assume eligibility. Confirm the rule and the paperwork.<\/p>\n<p><strong>Restrictions and licensing.<\/strong> Some product categories require import licences, permits, or prior registration. Some are restricted or prohibited outright. Identify this before you order, because discovering a licensing requirement after production is expensive.<\/p>\n<h2>Before you order: compliance of the product itself<\/h2>\n<p>Beyond classification, the product must meet the destination market's rules.<\/p>\n<ul>\n<li><strong>Safety standards.<\/strong> Many consumer products must meet mandatory safety requirements in the destination market. Some categories require third-party testing.<\/li>\n<li><strong>Chemical and materials limits.<\/strong> Restrictions on substances commonly apply to products that touch skin, food, or children.<\/li>\n<li><strong>Energy and efficiency rules.<\/strong> Certain electrical goods carry efficiency or energy-labelling requirements.<\/li>\n<li><strong>Certification marks.<\/strong> Depending on the destination, specific marks may be required on the product or packaging.<\/li>\n<\/ul>\n<p>Your supplier may be able to meet these requirements, but the obligation to specify them is yours. If you do not put the requirement in writing before production, you will not get it.<\/p>\n<h2>Documents for customs clearance<\/h2>\n<p>Customs clearance depends on a document set. Typical elements include:<\/p>\n<ul>\n<li><strong>Commercial invoice<\/strong> — value, description, quantity, terms of sale, buyer and seller.<\/li>\n<li><strong>Packing list<\/strong> — cartons, weights, dimensions.<\/li>\n<li><strong>Bill of lading or airway bill<\/strong> — the transport document.<\/li>\n<li><strong>Certificate of origin<\/strong> — if a preferential duty rate is claimed.<\/li>\n<li><strong>Import declaration<\/strong> — filed with the destination customs authority.<\/li>\n<li><strong>Test reports or certificates<\/strong> — where the product category requires them.<\/li>\n<\/ul>\n<p>Errors here are common and avoidable. The invoice description should be specific enough to be classifiable. Vague descriptions like &quot;gifts&quot; or &quot;samples&quot; on a commercial shipment invite inspection. The declared value should be accurate; under-declaration is not a legitimate saving, it is a compliance risk that can be discovered later.<\/p>\n<p><strong>Terms of sale matter to customs.<\/strong> Under common international commercial terms, who arranges freight and who is the importer of record affects your obligations. Confirm who is acting as importer of record and who is responsible for the declaration.<\/p>\n<h2>Duties and taxes<\/h2>\n<p>The destination determines the numbers, not the supplier.<\/p>\n<ul>\n<li><strong>Duty<\/strong> is generally based on the customs value and the HS classification. The rate comes from your country's tariff schedule.<\/li>\n<li><strong>Value-added tax or equivalent<\/strong> typically applies on import in many markets, and is usually recoverable if you are a registered business, depending on local rules.<\/li>\n<li><strong>Other charges<\/strong> may include customs processing fees, port charges, and agent fees.<\/li>\n<\/ul>\n<p>Estimate landed cost — duty, tax, freight, and fees — before you price the product. Many importers lose margin not on the unit price but on the transport and duty they never modelled.<\/p>\n<h2>Labeling<\/h2>\n<p>Labeling is where otherwise-clear shipments fail at retail.<\/p>\n<p>Requirements vary by market and product, but the recurring items are:<\/p>\n<ul>\n<li><strong>Language<\/strong> — the destination market's required language, often in addition to the original.<\/li>\n<li><strong>Mandatory statements<\/strong> — product name, contents, materials, country of origin, and importer or responsible-party details in some markets.<\/li>\n<li><strong>Warnings<\/strong> — category-specific safety warnings.<\/li>\n<li><strong>Traceability<\/strong> — batch, date, or serial information where required.<\/li>\n<\/ul>\n<p>Labeling must be specified to the supplier before production and confirmed on a pre-production sample. Retrofitting labels onto finished goods is slow and costly.<\/p>\n<h2>Packaging and transport<\/h2>\n<p>Packaging protects the goods and, in some cases, carries legal requirements of its own. Wooden packing material is frequently subject to treatment and marking rules to prevent pest movement. Confirm both the legal requirements and the practical durability of the packaging for the route and the handling your goods will face.<\/p>\n<h2>Managing the supplier side<\/h2>\n<p>Everything above assumes your supplier will deliver goods that match what you specified. That assumption needs verification, not hope.<\/p>\n<p>The compliance work you do before ordering is only as good as the entity you order from. A supplier that is winding down will not honour specifications, will not produce test reports it does not have, and will not fix a labeling error. That is why compliance and supplier verification belong in the same process.<\/p>\n<p>Watch the entity as well as the goods. A reduction in registered capital, a sharp fall in job postings, or accumulating enforcement records are all public signs that a supplier may be in difficulty. In one real case, a Zhongshan supplier cut registered capital by CNY 6.44 million — from roughly 10 million to roughly 3.56 million — and its job postings fell from 25 to 3, a drop of 88%, shortly before going silent.<\/p>\n<h2>Quick Verification Checklist<\/h2>\n<ul>\n<li><strong>Confirm the HS code against your destination tariff schedule<\/strong>, not just the supplier's suggestion, and check for licensing requirements.<\/li>\n<li><strong>List every mandatory product standard and certification<\/strong> for your destination and put it in writing before production.<\/li>\n<li><strong>Verify the supplier's legal entity and bank account name match<\/strong> before paying any deposit.<\/li>\n<li><strong>Model landed cost<\/strong> including duty, tax, freight, and agent fees before you set your price.<\/li>\n<li><strong>Approve a pre-production sample with final labeling<\/strong> before mass production begins.<\/li>\n<\/ul>\n<h2>What this means if you are about to pay<\/h2>\n<p>Compliance errors are cheap to fix before production and expensive after arrival, so the checklist belongs upstream of your deposit. Verify the supplier entity and its bank account name at the same time you verify your product requirements. If the supplier cannot answer basic questions about standards, labeling, and documents, treat that as a signal about the whole relationship.<\/p>\n<p><strong>Want to verify a specific supplier before you pay?<\/strong><\/p>\n<p>→ Free instant check: https://lu7897859-tech.github.io/doors/sourcing-audit/<\/p>\n<p>→ Full 5-layer verification guide ($14): https://lunarwave8803.gumroad.com/l/kbgmsy<\/p>","cta":"https://lu7897859-tech.github.io/doors/sourcing-audit/","ctaTitle":"Check a supplier for free, right now","ctaText":"Paste the supplier's 18-digit USCC or full registered name for an instant structural check — then go further with the full verification guide.","ctaBtn":"Open the free check"},"type":"article"};</script>

  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var ROOT = D.root || '';   // -> GH Pages root
  var UP = D.up || '';       // -> door dir ('' or '../')
  function isExt(u){ return /^https?:|^mailto:/.test(String(u||'')); }
  function dlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; if(u.charAt(0)==='#') return UP+'index.html'+u; return UP+u.replace(/^\.?\//,''); }
  function rlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; return ROOT+u.replace(/^\.?\//,''); }
  document.getElementById('brand').textContent = D.brand || '';

  // nav
  var nav = document.getElementById('nav');
  (D.nav || []).forEach(function(n){ nav.appendChild(el('<a href="'+dlink(n.href)+'">'+esc(n.label)+'</a>')); });

  var app = document.getElementById('app');

  function renderDoor(){
    var h = D.hero || {};
    var html = '';
    html += '<section class="hero"><div class="wrap">';
    if(h.eyebrow) html += '<span class="eyebrow">'+esc(h.eyebrow)+'</span>';
    html += '<h1>'+esc(h.h1||'')+'</h1>';
    if(h.sub) html += '<p class="sub">'+esc(h.sub)+'</p>';
    // demo box
    html += '<div class="demo"><div class="dt"><span>'+esc(h.demoTitle||'Try it free')+'</span><b>'+esc(h.demoBadge||'Live')+'</b></div>';
    html += '<div class="row"><input id="dq" placeholder="'+esc(h.demoPlaceholder||'')+'" aria-label="'+esc(h.demoLabel||'query')+'">';
    html += '<button id="db">'+esc(h.demoBtn||'Check')+'</button></div>';
    html += '<div class="out" id="dout"></div>';
    if(h.demoNote) html += '<div class="note">'+esc(h.demoNote)+'</div>';
    html += '</div>';
    if((D.trust||[]).length){ html += '<div class="trust">'+D.trust.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'; }
    html += '</div></section>';

    if((D.steps||[]).length){
      html += '<section><div class="wrap"><h2>'+esc(D.stepsTitle||'How it works')+'</h2><p class="sect-sub">'+esc(D.stepsSub||'')+'</p><div class="grid g3">';
      D.steps.forEach(function(s,i){ html += '<div class="card"><div class="step-n">'+(i+1)+'</div><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div>'; });
      html += '</div></div></section>';
    }

    if((D.products||[]).length){
      html += '<section id="products"><div class="wrap"><h2>'+esc(D.productsTitle||'Products')+'</h2><p class="sect-sub">'+esc(D.productsSub||'')+'</p><div class="grid g3">';
      D.products.forEach(function(p){
        html += '<div class="card prod"><div class="p-top"><div><h3>'+esc(p.name)+'</h3></div>'+(p.price?'<span class="price">'+esc(p.price)+'</span>':'')+'</div>';
        if(p.tagline) html += '<p>'+esc(p.tagline)+'</p>';
        if((p.bullets||[]).length) html += '<ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
        if(p.page) html += '<a class="btn ghost" href="'+dlink(p.page)+'">Details</a>';
        if(p.cta) html += '<a class="btn" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a>';
        html += '</div>';
      });
      html += '</div></div></section>';
    }

    if((D.tiers||[]).length){
      html += '<section id="pricing"><div class="wrap"><h2>'+esc(D.tiersTitle||'Pricing')+'</h2><p class="sect-sub">'+esc(D.tiersSub||'')+'</p><div class="grid g3 tiers">';
      D.tiers.forEach(function(t){
        html += '<div class="card tier'+(t.popular?' pop':'')+'">'+(t.popular?'<span class="badge">'+(esc(t.badge||'Popular'))+'</span>':'')+'<h3>'+esc(t.name)+'</h3><div class="amt">'+esc(t.price)+'</div><div class="per">'+esc(t.per||'')+'</div><ul>'+ (t.features||[]).map(function(f){return '<li>'+esc(f)+'</li>';}).join('') +'</ul>';
        html += '<a class="btn'+(t.ghost?' ghost':'')+'" href="'+dlink(t.cta)+'" rel="noopener">'+esc(t.ctaText||'Choose')+'</a></div>';
      });
      html += '</div></div></section>';
    }

    if((D.faq||[]).length){
      html += '<section id="faq"><div class="wrap"><h2>FAQ</h2><p class="sect-sub"></p><div class="faq">';
      D.faq.forEach(function(f){ html += '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>'; });
      html += '</div></div></section>';
    }
    app.innerHTML = html;
    wireDemo();
  }

  function renderProduct(){
    var p = D.product || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('index.html')+'">← '+esc(D.brand)+'</a></p>';
    html += '<h1>'+esc(p.name)+'</h1>';
    if(p.tagline) html += '<p class="sub" style="margin:0 0 10px">'+esc(p.tagline)+'</p>';
    html += '<p>'+(p.price?'<span class="pill">'+esc(p.price)+'</span>':'')+((p.tags||[]).map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join(''))+'</p>';
    if((p.bullets||[]).length) html += '<h3>What you get</h3><ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
    if(p.sample) html += '<h3>Sample output</h3><pre class="out">'+esc(p.sample)+'</pre>';
    if(p.body) html += p.body; // trusted markdown-lite html from config
    if(p.cta) html += '<p style="margin-top:22px"><a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:700" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a></p>';
    if((D.related||[]).length){
      html += '<h3>Related</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function wireDemo(){
    var inp = document.getElementById('dq'), btn = document.getElementById('db'), out = document.getElementById('dout');
    if(!inp||!btn) return;
    function setOut(msg, cls){ out.className = 'out' + (cls?(' '+cls):''); out.textContent = msg; }

    // ---- client-side USCC (Unified Social Credit Code) checker: real, zero-dependency free hook ----
    var CS = '0123456789ABCDEFGHJKLMNPQRTUWXY';
    var W = [1,3,9,27,19,26,16,17,20,29,25,13,8,24,10,30,28];
    var REG = {'1':'Market regulation','5':'Civil affairs','9':'Other','Y':'Other','1A':'Regulator A'};
    function decodeUSCC(code){
      var s = String(code||'').toUpperCase().replace(/\s+/g,'');
      if(s.length!==18) return {ok:false, reason:'Length is '+s.length+', a USCC is exactly 18 characters.'};
      for(var i=0;i<18;i++){ if(CS.indexOf(s.charAt(i))<0) return {ok:false, reason:'Invalid character "'+s.charAt(i)+'" (letters I, O, S, V, Z are not used).'}; }
      var sum=0; for(var j=0;j<17;j++) sum += CS.indexOf(s.charAt(j))*W[j];
      var expect = CS.charAt((31 - (sum % 31)) % 31);
      var ok = (expect === s.charAt(17));
      return {ok:ok, expect:expect, given:s.charAt(17),
        region:s.slice(2,8), org: s.charAt(8), kind: s.charAt(9), serial:s.slice(10,17)};
    }
    function explain(x){
      if(x.ok){
        return '✅ Structurally valid USCC\n\n'+
          'Region / admin code : '+x.region+'\n'+
          'Entity-type code   : '+x.kind+'\n'+
          'Org code           : '+x.org+'\n'+
          'Serial             : '+x.serial+'\n'+
          'Check digit        : '+x.given+' (valid)\n\n'+
          'Format checks out. What a valid code does NOT tell you: whether the company is still active, who really owns it, or whether it has litigation, sanctions or adverse media. That is what the full report covers.';
      }
      return '❌ Not a structurally valid USCC\n\n'+x.reason+'\n\nTip: paste the 18-character Unified Social Credit Code from the supplier\u2019s business licence, or try the company\u2019s full registered name.';
    }

    async function run(){
      var q = (inp.value||'').trim();
      if(!q){ setOut(D.demoEmpty||'Please enter a company name or 18-digit registration number.','err'); return; }
      btn.disabled = true; var old = btn.textContent; btn.textContent = D.demoBusy||'Checking…';
      try{
        if(D.demoMode === 'uscc'){
          setOut(D.demoBusy||'Checking…','');
          var x = decodeUSCC(q);
          setOut(explain(x), x.ok?'ok':'err');
          beacon(q, x.ok?'valid':'invalid');
        } else if(D.demoMode === 'endpoint' && D.demoEndpoint){
          setOut(D.demoBusy||'Contacting verification service…','');
          var r = await fetch(D.demoEndpoint, { method:'POST', headers:{'content-type':'application/json','accept':'application/json'}, body: JSON.stringify({ keyword: q, tool:'verify_supplier' }) });
          var txt = await r.text(); var j=null; try{ j=JSON.parse(txt); }catch(e){}
          if(r.status===200 && j){ setOut(JSON.stringify(j,null,2).substring(0,1400),'ok'); }
          else if(r.status===402){ setOut((D.paywallNote||'Free instant checks used. Get the full verified report to continue.'),'err'); }
          else { setOut('Service returned status '+r.status+'. '+(D.demoFallback||''),'err'); }
        } else {
          var x2 = decodeUSCC(q);
          setOut(explain(x2), x2.ok?'ok':'err');
        }
      }catch(e){
        setOut((D.demoOffline||'The live demo is momentarily unavailable. The full verification report still works.')+'\n\n'+(D.demoEndpoint||''),'err');
      }
      btn.disabled=false; btn.textContent=old;
    }
    // anonymous use-signal: lets us see the first real visitor arrive (never sent to the supplier)
    function beacon(q, result){
      if(!D.demoEndpoint) return;
      try{
        fetch(D.demoEndpoint, { method:'POST', keepalive:true, headers:{'content-type':'application/json'}, body: JSON.stringify({ keyword:q, tool:'verify_supplier', source:'door-free-hook', result:result }) }).catch(function(){});
      }catch(e){}
    }
    btn.addEventListener('click',run);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  }

  function renderArticle(){
    var a = D.article || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('blog/index.html')+'">← All guides</a></p>';
    html += '<h1>'+esc(a.title)+'</h1>';
    if(a.desc) html += '<p class="sub" style="margin:0 0 18px">'+esc(a.desc)+'</p>';
    if((a.tags||[]).length) html += '<p>'+a.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
    html += '<div data-article>'+(a.html||'')+'</div>';
    if(a.cta){
      html += '<div class="card" style="margin-top:30px;border-color:var(--accent)"><h3>'+esc(a.ctaTitle||'Check a supplier now')+'</h3><p style="margin-bottom:14px">'+esc(a.ctaText||'')+'</p>';
      html += '<a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700" href="'+dlink(a.cta)+'" rel="noopener">'+esc(a.ctaBtn||'Open the free check')+'</a></div>';
    }
    if((D.related||[]).length){
      html += '<h3>Related guides</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function renderBlogIndex(){
    var posts = D.posts || [];
    var html = '<section class="hero"><div class="wrap"><span class="eyebrow">'+esc(D.blogEyebrow||'Guides')+'</span><h1>'+esc(D.blogTitle||'China sourcing guides')+'</h1>';
    if(D.blogSub) html += '<p class="sub">'+esc(D.blogSub)+'</p>';
    html += '</div></section><section><div class="wrap"><div class="grid g2">';
    posts.forEach(function(p){
      html += '<div class="card"><h3><a href="'+dlink(p.href)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.desc||'')+'</p>';
      if(p.tags&&p.tags.length) html += '<p style="margin-top:10px">'+p.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
      html += '</div>';
    });
    html += '</div></div></section>';
    app.innerHTML = html;
  }

  if(t==='product') renderProduct(); else if(t==='article') renderArticle(); else if(t==='blog') renderBlogIndex(); else renderDoor();

  // footer
  var foot = document.getElementById('foot');
  (D.footer||[]).forEach(function(col){
    foot.appendChild(el('<div><h4>'+esc(col.t)+'</h4>'+ (col.links||[]).map(function(l){ return '<a href="'+rlink(l.href)+'"'+(isExt(l.href)?' rel="noopener"':'')+'>'+esc(l.label)+'</a>'; }).join('') +'</div>'));
  });
  document.getElementById('legalLeft').textContent = D.legalLeft || ('© ' + new Date().getFullYear() + ' ' + (D.brand||''));
  document.getElementById('legalRight').textContent = D.legalRight || '';
})();
</script>
