stered name for an instant structural check — then go further with the full verification guide.","articleCtaBtn":"Open the free check","articlesRelated":[{"label":"Free instant USCC check","href":"../free-uscc-check.html"},{"label":"Tariff stack calculator","href":"../tools/tariff-stack-calculator.html"},{"label":"Pricing & reports","href":"../index.html#pricing"},{"label":"MCP server for AI agents","href":"../mcp-server.html"},{"label":"12 China sourcing scams in 2026","href":"../../articles/12-china-sourcing-scams-2026.html"}],"related":[{"label":"12 China Sourcing Scams in 2026","href":"articles/12-china-sourcing-scams-2026.html"},{"label":"Free USCC checker","href":"doors/sourcing-audit/free-uscc-check.html"}],"article":{"title":"Why Your AI Automations Keep Breaking (and How to Catch It Before It Costs You)","desc":"If you've built even a handful of AI-powered automations, you already know the uncomfortable truth: they almost never fail the way software fails in the","tags":["automation","ai","ops"],"html":"<p><strong>Filename:<\/strong> 20260827_035_ai_automation_rules_failure_seo.md<\/p>\n<p><strong>Date:<\/strong> 2026-08-27<\/p>\n<p><strong>Series:<\/strong> AI 自动化系列第 1 篇（新支线；服务 Gumroad 店内 8/26 上架两款 AI 产品：The AI Automation Rule Audit $3 / The Inversion of Control Flaw $9——两品当前零流量、缺内容支撑）<\/p>\n<p><strong>Target keyword:<\/strong> why ai automations fail / ai automation troubleshooting guide / broken automation checklist / ai workflow silent failure / ai automation audit small business<\/p>\n<p><strong>Product tie-in:<\/strong> https://lunarwave8803.gumroad.com/l/dvqab（The AI Automation Rule Audit: 20-Point Diagnostic）＋ https://lunarwave8803.gumroad.com/l/ywxlvy（The Inversion of Control Flaw: Why Your AI Automation Rules Keep Failing）<\/p>\n<p><strong>Word count target:<\/strong> ~1100 words（正文）<\/p>\n<hr>\n<h2>Why Your AI Automations Keep Breaking — and How to Catch It Before It Costs You<\/h2>\n<p><strong>Meta description:<\/strong> Most AI automations never crash — they fail quietly: skipped leads, empty fields, confident wrong output. Here are the 20 failure modes behind almost every broken workflow, plus a 15-minute triage ritual to catch them early.<\/p>\n<hr>\n<p>If you've built even a handful of AI-powered automations, you already know the uncomfortable truth: they almost never fail the way software fails in the movies. There's no dramatic crash. No stack trace in your inbox.<\/p>\n<p>What actually happens is quieter. A lead form gets submitted and nobody follows up. A row lands in your spreadsheet with the total column empty. An AI-written reply goes out, politely and confidently, answering a question the customer didn't ask.<\/p>\n<p>Silent failure is the default failure mode of modern automation — and the longer it runs unnoticed, the more expensive it gets. This guide walks through the twenty failure patterns behind the vast majority of broken workflows, organized into five layers, so you can stop guessing which one bit you this time.<\/p>\n<h2>The three ways automations actually fail<\/h2>\n<p>Before the list, a useful distinction. Not all failures cost the same:<\/p>\n<ul>\n<li><strong>Loud failure<\/strong> — the run throws an error you can see. Annoying, but cheap: you fix it, it stays fixed.<\/li>\n<li><strong>Quiet failure<\/strong> — the run completes &quot;successfully&quot; and produces wrong output. Misspelled names, merged duplicates, replies sent to the wrong segment. This is where money leaks.<\/li>\n<li><strong>Drift<\/strong> — everything works today, then an upstream change (a renamed field, a moved button, an updated model) silently reshapes what flows through, and nobody notices for weeks.<\/li>\n<\/ul>\n<p>Most teams over-invest in catching loud failures and have essentially no defense against the other two. That imbalance is the root problem.<\/p>\n<h2>Twenty failure modes, five layers<\/h2>\n<h3>Layer 1 — Triggers<\/h3>\n<ul>\n<li><strong>Duplicate triggers.<\/strong> The same event fires the flow twice; the customer gets two emails or your ledger gets two rows.<\/li>\n<li><strong>Missed retries.<\/strong> A webhook fires while your endpoint is down; most builders retry a few times, some give up silently — that record simply vanishes from your pipeline.<\/li>\n<li><strong>Timezone off-by-one.<\/strong> Daily summaries arrive at the wrong hour, or worse, jobs meant for &quot;end of day&quot; fire mid-morning for half your customers.<\/li>\n<li><strong>Edit-triggered chaos.<\/strong> The trigger fires not just on creation but on every edit, rerunning the whole chain each time someone fixes a typo.<\/li>\n<\/ul>\n<h3>Layer 2 — Inputs and data<\/h3>\n<ul>\n<li><strong>Silent truncation.<\/strong> Long text fields get clipped at some invisible limit; the automation confidently processes half the order notes.<\/li>\n<li><strong>Date-format ambiguity.<\/strong> 08/04 means April 8 to your form and August 4 to your spreadsheet. Neither system complains.<\/li>\n<li><strong>Locale and currency mixing.<\/strong> Amounts computed across systems disagree because one treats commas as thousand separators and the other treats them as decimals.<\/li>\n<li><strong>Null versus empty string.<\/strong> Your filter says &quot;if field is empty, skip&quot; — and it works beautifully until a source sends <code>&quot;null&quot;<\/code> as literal text instead of an actual null value.<\/li>\n<\/ul>\n<h3>Layer 3 — Logic and branching<\/h3>\n<ul>\n<li><strong>Filter logic inversion.<\/strong> One misplaced AND-versus-OR quietly inverts a condition so the rule matches everyone except who you intended.<\/li>\n<li><strong>Default branches swallowing errors.<\/strong> When something unexpected happens, execution falls into a catch-all path labeled &quot;success.&quot; The run log glows green; the work wasn't done.<\/li>\n<li><strong>Stale thresholds.<\/strong> Rules still compare against numbers, tiers, or tags set a year ago by someone who has left the company.<\/li>\n<li><strong>Overlapping rules fighting.<\/strong> Two automations react to the same event with contradictory actions; last writer wins and outcomes alternate depending on millisecond timing.<\/li>\n<\/ul>\n<h3>Layer 4 — APIs and external dependencies<\/h3>\n<ul>\n<li><strong>Token expiry without alerting.<\/strong> The connection between tools expires; rather than failing, the flow keeps running on cached behavior or just stops while dashboards stay green.<\/li>\n<li><strong>No rate-limit handling.<\/strong> Everything works at test volume; at real volume, requests exceed quotas and responses degrade in ways no one checks.<\/li>\n<li><strong>Upstream schema changes.<\/strong> A connected app renames or reorders a field; your mapping now writes nothing into the field your team actually uses downstream.<\/li>\n<li><strong>Pagination ceilings.<\/strong> Reports sync &quot;fine,&quot; but silently cap at N pages or N hundred rows, so any growth past that point is invisible missing data.<\/li>\n<\/ul>\n<h3>Layer 5 — Monitoring and ownership<\/h3>\n<ul>\n<li><strong>&quot;Didn't error&quot; treated as success.<\/strong> Without a defined correctness metric, uptime becomes the proxy for working — and quiet failures sail through.<\/li>\n<li><strong>No dead-letter pile.<\/strong> Runs that can't complete have nowhere to go, so there's no observable backlog telling you how much work is silently stranded.<\/li>\n<li><strong>No spot-check ritual.<\/strong> Nobody ever opens three random &quot;successful&quot; runs per week and eyeballs whether the outputs are actually right.<\/li>\n<li><strong>Ownerless automations.<\/strong> Built by a founder, a freelancer, or &quot;that one person who's good at this.&quot; When they move on, no one knows what the rules do, let alone when they break.<\/li>\n<\/ul>\n<p>Notice the pattern: <strong>roughly half of the list isn't technical at all.<\/strong> Layers 1–4 are engineering hygiene; Layer 5 is management. Most teams fail at Layer 5 first.<\/p>\n<h2>Why you never see it coming<\/h2>\n<p>Three biases keep silent failures invisible:<\/p>\n<ul>\n<li><strong>Dashboard bias.<\/strong> Green checkmarks dominate the interface, so a completed run *feels* like a correct run.<\/li>\n<li><strong>Build-time testing.<\/strong> You tested it once with clean sample data, it worked, and it entered &quot;done&quot; status in your mind — permanently.<\/li>\n<li><strong>Cost asymmetry.<\/strong> Each individual miss looks tiny (one lead, one row, one email). Only the aggregate, months later — cold leads, refund requests, mysterious inventory gaps — adds up to real money, and by then the trail is cold.<\/li>\n<\/ul>\n<h2>A 15-minute weekly triage ritual<\/h2>\n<p>You don't need enterprise observability to catch most of this. Once a week, pick your single highest-stakes automation and do four things:<\/p>\n<ul>\n<li>Open its recent run history and scan the <strong>last twenty runs<\/strong>.<\/li>\n<li>Count runs whose outcome wasn't the obvious happy path — errors, skips, unusual branches. Note the number; watch whether it trends up over weeks.<\/li>\n<li>Open <strong>three runs marked successful<\/strong> and actually look at the outputs the way a customer or colleague would receive them.<\/li>\n<li>Verify the <strong>one field or outcome a human downstream depends on<\/strong> — the invoice total, the follow-up task, the tag that routes deals.<\/li>\n<\/ul>\n<p>Fifteen minutes, once a week, rotating through your top automations. It catches the majority of quiet failures within one cycle of them appearing.<\/p>\n<p>For a fuller sweep, the same idea exists as a structured walkthrough: the <strong>AI Automation Rule Audit: 20-Point Diagnostic<\/strong> (https://lunarwave8803.gumroad.com/l/dvqab) expands this ritual into twenty concrete checkpoints covering all five layers above — designed to run through a typical small-business setup in an afternoon, not a sprint quarter.<\/p>\n<h2>The deeper issue: who controls the verification<\/h2>\n<p>Many of these failure modes share a single structural root. Broadly: an automation that decides its own inputs are trustworthy, marking its own homework. Data arrives, the flow assumes it's well-formed, branches execute, and the run reports success based on completion rather than correctness. Control has quietly been <strong>inverted<\/strong> — the system grades itself.<\/p>\n<p>That framing — why rules keep failing and how to restructure them so verification sits outside the thing being verified — is the subject of <strong>The Inversion of Control Flaw: Why Your AI Automation Rules Keep Failing<\/strong> (https://lunarwave8803.gumroad.com/l/ywxlvy). If the twenty-point audit tells you *where* your setups break, that report explains the *why* underneath the breaking.<\/p>\n<h2>Frequently asked questions<\/h2>\n<p><strong>How often should I audit my automations?<\/strong><\/p>\n<p>A light weekly spot-check (the ritual above) on your riskiest flows, and a structured full pass quarterly — or immediately after any connected app announces changes to forms, fields, or plans.<\/p>\n<p><strong>What's the single most common failure mode?<\/strong><\/p>\n<p>Default branches treating errors as success (#10), closely followed by silent truncation (#5). Both produce green checkmarks, which is exactly why they survive for months.<\/p>\n<p><strong>Do I need to buy monitoring software?<\/strong><\/p>\n<p>Not to start. Run history plus a weekly calendar block will find most issues. Monitoring tools help once you have dozens of flows and multiple owners.<\/p>\n<p><strong>Are AI-specific failures different from classic automation failures?<\/strong><\/p>\n<p>One important way: AI steps can return *plausible but wrong* output — fluently formatted nonsense. Classic determinism-based testing doesn't fully cover it, which makes explicit output assertions and sampling checks (Layers 2 and 5) even more important.<\/p>\n<h2>Bottom line<\/h2>\n<p>Broken automations rarely announce themselves. They hand you plausible garbage at machine speed and log it as success. Run the fifteen-minute ritual this week; walk the full checklist when you're ready to go deeper. The cheapest time to catch a silent failure was yesterday — the second-cheapest is right now.<\/p>\n<hr>\n<h2>生产备注（非发布正文）<\/h2>\n<ul>\n<li>来源依据：failure-mode 清单为通用工程实践归纳，无引用虚构统计；三源趋势佐证见本轮心跳感知记录（Inkfluence 8/15、Amasty 8/24、Astra 8/13——均确认 AI 产品/自动化类数字品需求带），正文中未引用以避免不可核验出处<\/li>\n<li>链接核验：l/dvqab 与 l/ywxlvy 两链接来自 2026-08-26 02:46 Gumroad 巡检 DOM 直读台账（两款均为 Published 状态）✅<\/li>\n<li>定价忠实：正文仅作产品定位描述与功能边界说明，未标注价格、未承诺收益、无销量背书 ✅<\/li>\n<li>免责性质：属方法论内容，与关税系列分离，不受贸易政策时效影响（evergreen）<\/li>\n<\/ul>\n<h3>Critic 自审（≥80 入库标准）<\/h3>\n<ul>\n<li>逻辑 88：三层失效模型→五层二十模式→监控偏差归因→triage 流程→结构根因→FAQ，递进闭环无明显断层<\/li>\n<li>质量 90：长尾关键词覆盖自然堆叠；标题/meta 符合 SEO 约定；~1120 词符合目标；示例具体可操作<\/li>\n<li>合规 95：无编造数据/统计；产品描述忠实于挂牌信息；不含医疗/金融等高风险断言<\/li>\n<li>链接真实 95：两外链均来自巡检实录，可在库内溯源<\/li>\n<li><strong>综合 92/100 → 通过入库存档<\/strong><\/li>\n<\/ul>","cta":"https://lu7897859-tech.github.io/doors/sourcing-audit/","ctaTitle":"Check a supplier for free, right now","ctaText":"Paste the supplier's 18-digit USCC or full registered name for an instant structural check — then go further with the full verification guide.","ctaBtn":"Open the free check"},"type":"article"};</script>
<script>
(function(){
  var D = window.DOOR || {};
  var t = D.type || 'door';
  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var ROOT = D.root || '';   // -> GH Pages root
  var UP = D.up || '';       // -> door dir ('' or '../')
  function isExt(u){ return /^https?:|^mailto:/.test(String(u||'')); }
  function dlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; if(u.charAt(0)==='#') return UP+'index.html'+u; return UP+u.replace(/^\.?\//,''); }
  function rlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; return ROOT+u.replace(/^\.?\//,''); }
  document.getElementById('brand').textContent = D.brand || '';

  // nav
  var nav = document.getElementById('nav');
  (D.nav || []).forEach(function(n){ nav.appendChild(el('<a href="'+dlink(n.href)+'">'+esc(n.label)+'</a>')); });

  var app = document.getElementById('app');

  function renderDoor(){
    var h = D.hero || {};
    var html = '';
    html += '<section class="hero"><div class="wrap">';
    if(h.eyebrow) html += '<span class="eyebrow">'+esc(h.eyebrow)+'</span>';
    html += '<h1>'+esc(h.h1||'')+'</h1>';
    if(h.sub) html += '<p class="sub">'+esc(h.sub)+'</p>';
    // demo box
    html += '<div class="demo"><div class="dt"><span>'+esc(h.demoTitle||'Try it free')+'</span><b>'+esc(h.demoBadge||'Live')+'</b></div>';
    html += '<div class="row"><input id="dq" placeholder="'+esc(h.demoPlaceholder||'')+'" aria-label="'+esc(h.demoLabel||'query')+'">';
    html += '<button id="db">'+esc(h.demoBtn||'Check')+'</button></div>';
    html += '<div class="out" id="dout"></div>';
    if(h.demoNote) html += '<div class="note">'+esc(h.demoNote)+'</div>';
    html += '</div>';
    if((D.trust||[]).length){ html += '<div class="trust">'+D.trust.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'; }
    html += '</div></section>';

    if((D.steps||[]).length){
      html += '<section><div class="wrap"><h2>'+esc(D.stepsTitle||'How it works')+'</h2><p class="sect-sub">'+esc(D.stepsSub||'')+'</p><div class="grid g3">';
      D.steps.forEach(function(s,i){ html += '<div class="card"><div class="step-n">'+(i+1)+'</div><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div>'; });
      html += '</div></div></section>';
    }

    if((D.products||[]).length){
      html += '<section id="products"><div class="wrap"><h2>'+esc(D.productsTitle||'Products')+'</h2><p class="sect-sub">'+esc(D.productsSub||'')+'</p><div class="grid g3">';
      D.products.forEach(function(p){
        html += '<div class="card prod"><div class="p-top"><div><h3>'+esc(p.name)+'</h3></div>'+(p.price?'<span class="price">'+esc(p.price)+'</span>':'')+'</div>';
        if(p.tagline) html += '<p>'+esc(p.tagline)+'</p>';
        if((p.bullets||[]).length) html += '<ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
        if(p.page) html += '<a class="btn ghost" href="'+dlink(p.page)+'">Details</a>';
        if(p.cta) html += '<a class="btn" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a>';
        html += '</div>';
      });
      html += '</div></div></section>';
    }

    if((D.tiers||[]).length){
      html += '<section id="pricing"><div class="wrap"><h2>'+esc(D.tiersTitle||'Pricing')+'</h2><p class="sect-sub">'+esc(D.tiersSub||'')+'</p><div class="grid g3 tiers">';
      D.tiers.forEach(function(t){
        html += '<div class="card tier'+(t.popular?' pop':'')+'">'+(t.popular?'<span class="badge">'+(esc(t.badge||'Popular'))+'</span>':'')+'<h3>'+esc(t.name)+'</h3><div class="amt">'+esc(t.price)+'</div><div class="per">'+esc(t.per||'')+'</div><ul>'+ (t.features||[]).map(function(f){return '<li>'+esc(f)+'</li>';}).join('') +'</ul>';
        html += '<a class="btn'+(t.ghost?' ghost':'')+'" href="'+dlink(t.cta)+'" rel="noopener">'+esc(t.ctaText||'Choose')+'</a></div>';
      });
      html += '</div></div></section>';
    }

    if((D.faq||[]).length){
      html += '<section id="faq"><div class="wrap"><h2>FAQ</h2><p class="sect-sub"></p><div class="faq">';
      D.faq.forEach(function(f){ html += '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>'; });
      html += '</div></div></section>';
    }
    app.innerHTML = html;
    wireDemo();
  }

  function renderProduct(){
    var p = D.product || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('index.html')+'">← '+esc(D.brand)+'</a></p>';
    html += '<h1>'+esc(p.name)+'</h1>';
    if(p.tagline) html += '<p class="sub" style="margin:0 0 10px">'+esc(p.tagline)+'</p>';
    html += '<p>'+(p.price?'<span class="pill">'+esc(p.price)+'</span>':'')+((p.tags||[]).map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join(''))+'</p>';
    if((p.bullets||[]).length) html += '<h3>What you get</h3><ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
    if(p.sample) html += '<h3>Sample output</h3><pre class="out">'+esc(p.sample)+'</pre>';
    if(p.body) html += p.body; // trusted markdown-lite html from config
    if(p.cta) html += '<p style="margin-top:22px"><a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:700" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a></p>';
    if((D.related||[]).length){
      html += '<h3>Related</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function wireDemo(){
    var inp = document.getElementById('dq'), btn = document.getElementById('db'), out = document.getElementById('dout');
    if(!inp||!btn) return;
    function setOut(msg, cls){ out.className = 'out' + (cls?(' '+cls):''); out.textContent = msg; }

    // ---- client-side USCC (Unified Social Credit Code) checker: real, zero-dependency free hook ----
    var CS = '0123456789ABCDEFGHJKLMNPQRTUWXY';
    var W = [1,3,9,27,19,26,16,17,20,29,25,13,8,24,10,30,28];
    var REG = {'1':'Market regulation','5':'Civil affairs','9':'Other','Y':'Other','1A':'Regulator A'};
    function decodeUSCC(code){
      var s = String(code||'').toUpperCase().replace(/\s+/g,'');
      if(s.length!==18) return {ok:false, reason:'Length is '+s.length+', a USCC is exactly 18 characters.'};
      for(var i=0;i<18;i++){ if(CS.indexOf(s.charAt(i))<0) return {ok:false, reason:'Invalid character "'+s.charAt(i)+'" (letters I, O, S, V, Z are not used).'}; }
      var sum=0; for(var j=0;j<17;j++) sum += CS.indexOf(s.charAt(j))*W[j];
      var expect = CS.charAt((31 - (sum % 31)) % 31);
      var ok = (expect === s.charAt(17));
      return {ok:ok, expect:expect, given:s.charAt(17),
        region:s.slice(2,8), org: s.charAt(8), kind: s.charAt(9), serial:s.slice(10,17)};
    }
    function explain(x){
      if(x.ok){
        return '✅ Structurally valid USCC\n\n'+
          'Region / admin code : '+x.region+'\n'+
          'Entity-type code   : '+x.kind+'\n'+
          'Org code           : '+x.org+'\n'+
          'Serial             : '+x.serial+'\n'+
          'Check digit        : '+x.given+' (valid)\n\n'+
          'Format checks out. What a valid code does NOT tell you: whether the company is still active, who really owns it, or whether it has litigation, sanctions or adverse media. That is what the full report covers.';
      }
      return '❌ Not a structurally valid USCC\n\n'+x.reason+'\n\nTip: paste the 18-character Unified Social Credit Code from the supplier\u2019s business licence, or try the company\u2019s full registered name.';
    }

    async function run(){
      var q = (inp.value||'').trim();
      if(!q){ setOut(D.demoEmpty||'Please enter a company name or 18-digit registration number.','err'); return; }
      btn.disabled = true; var old = btn.textContent; btn.textContent = D.demoBusy||'Checking…';
      try{
        if(D.demoMode === 'uscc'){
          setOut(D.demoBusy||'Checking…','');
          var x = decodeUSCC(q);
          setOut(explain(x), x.ok?'ok':'err');
          beacon(q, x.ok?'valid':'invalid');
        } else if(D.demoMode === 'endpoint' && D.demoEndpoint){
          setOut(D.demoBusy||'Contacting verification service…','');
          var r = await fetch(D.demoEndpoint, { method:'POST', headers:{'content-type':'application/json','accept':'application/json'}, body: JSON.stringify({ keyword: q, tool:'verify_supplier' }) });
          var txt = await r.text(); var j=null; try{ j=JSON.parse(txt); }catch(e){}
          if(r.status===200 && j){ setOut(JSON.stringify(j,null,2).substring(0,1400),'ok'); }
          else if(r.status===402){ setOut((D.paywallNote||'Free instant checks used. Get the full verified report to continue.'),'err'); }
          else { setOut('Service returned status '+r.status+'. '+(D.demoFallback||''),'err'); }
        } else {
          var x2 = decodeUSCC(q);
          setOut(explain(x2), x2.ok?'ok':'err');
        }
      }catch(e){
        setOut((D.demoOffline||'The live demo is momentarily unavailable. The full verification report still works.')+'\n\n'+(D.demoEndpoint||''),'err');
      }
      btn.disabled=false; btn.textContent=old;
    }
    // anonymous use-signal: lets us see the first real visitor arrive (never sent to the supplier)
    function beacon(q, result){
      if(!D.demoEndpoint) return;
      try{
        fetch(D.demoEndpoint, { method:'POST', keepalive:true, headers:{'content-type':'application/json'}, body: JSON.stringify({ keyword:q, tool:'verify_supplier', source:'door-free-hook', result:result }) }).catch(function(){});
      }catch(e){}
    }
    btn.addEventListener('click',run);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  }

  function renderArticle(){
    var a = D.article || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('blog/index.html')+'">← All guides</a></p>';
    html += '<h1>'+esc(a.title)+'</h1>';
    if(a.desc) html += '<p class="sub" style="margin:0 0 18px">'+esc(a.desc)+'</p>';
    if((a.tags||[]).length) html += '<p>'+a.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
    html += '<div data-article>'+(a.html||'')+'</div>';
    if(a.cta){
      html += '<div class="card" style="margin-top:30px;border-color:var(--accent)"><h3>'+esc(a.ctaTitle||'Check a supplier now')+'</h3><p style="margin-bottom:14px">'+esc(a.ctaText||'')+'</p>';
      html += '<a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700" href="'+dlink(a.cta)+'" rel="noopener">'+esc(a.ctaBtn||'Open the free check')+'</a></div>';
    }
    if((D.related||[]).length){
      html += '<h3>Related guides</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function renderBlogIndex(){
    var posts = D.posts || [];
    var html = '<section class="hero"><div class="wrap"><span class="eyebrow">'+esc(D.blogEyebrow||'Guides')+'</span><h1>'+esc(D.blogTitle||'China sourcing guides')+'</h1>';
    if(D.blogSub) html += '<p class="sub">'+esc(D.blogSub)+'</p>';
    html += '</div></section><section><div class="wrap"><div class="grid g2">';
    posts.forEach(function(p){
      html += '<div class="card"><h3><a href="'+dlink(p.href)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.desc||'')+'</p>';
      if(p.tags&&p.tags.length) html += '<p style="margin-top:10px">'+p.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
      html += '</div>';
    });
    html += '</div></div></section>';
    app.innerHTML = html;
  }

  if(t==='product') renderProduct(); else if(t==='article') renderArticle(); else if(t==='blog') renderBlogIndex(); else renderDoor();

  // footer
  var foot = document.getElementById('foot');
  (D.footer||[]).forEach(function(col){
    foot.appendChild(el('<div><h4>'+esc(col.t)+'</h4>'+ (col.links||[]).map(function(l){ return '<a href="'+rlink(l.href)+'"'+(isExt(l.href)?' rel="noopener"':'')+'>'+esc(l.label)+'</a>'; }).join('') +'</div>'));
  });
  document.getElementById('legalLeft').textContent = D.legalLeft || ('© ' + new Date().getFullYear() + ' ' + (D.brand||''));
  document.getElementById('legalRight').textContent = D.legalRight || '';
})();
</script>
