full registered name for an instant structural check — then go further with the full verification guide.","articleCtaBtn":"Open the free check","articlesRelated":[{"label":"Free instant USCC check","href":"../free-uscc-check.html"},{"label":"Tariff stack calculator","href":"../tools/tariff-stack-calculator.html"},{"label":"Pricing & reports","href":"../index.html#pricing"},{"label":"MCP server for AI agents","href":"../mcp-server.html"},{"label":"12 China sourcing scams in 2026","href":"../../articles/12-china-sourcing-scams-2026.html"}],"related":[{"label":"12 China Sourcing Scams in 2026","href":"articles/12-china-sourcing-scams-2026.html"},{"label":"Free USCC checker","href":"doors/sourcing-audit/free-uscc-check.html"}],"article":{"title":"How to Verify a Chinese Supplier's Bank Account Before Paying","desc":"How to verify a Chinese supplier's receiving account, why a mismatched beneficiary is the biggest red flag, and how to cross-check ownership.","tags":["bank account verification","china sourcing","payment fraud","due diligence"],"html":"<p>Of all the ways money is lost in cross-border purchasing, payment to the wrong account is the one that feels most avoidable and happens most often. The reason is not that buyers are careless — it is that the signal is subtle. An invoice arrives, everything looks professional, and the bank beneficiary name differs from the company name by a few words. Many buyers do not notice. The ones who do often accept a plausible explanation.<\/p>\n<p>This guide explains how bank account ownership works for Chinese suppliers, why a mismatched account name is the single loudest warning, and how to cross-check account ownership using public information.<\/p>\n<hr>\n<h2>Why Account Verification Matters More Than Supplier Verification<\/h2>\n<p>You can verify a supplier thoroughly — license, factory address, references — and still pay the wrong person, because payments go to accounts, not to companies. The account is the actual endpoint of your money, and it exists independently of the company you think you are dealing with.<\/p>\n<p>Three distinct failure modes exist. First, the supplier is real but the account belongs to someone else — a relative, a different legal entity, or an intermediary. Second, the supplier is real but you were tricked into paying a fraudster, because a compromised email changed the bank details. Third, the supplier never existed at all — a license was borrowed or the name was chosen to look similar to a real company.<\/p>\n<p>All three are prevented by the same discipline: the beneficiary name on the bank account must match the legal entity you are contracting with, and it must be confirmed by a means other than the email that sent it. Verification of the company tells you who claims to sell to you. Verification of the account tells you who actually gets the money. Only the second is a payment control.<\/p>\n<hr>\n<h2>The Golden Rule: Beneficiary Name Must Match the License<\/h2>\n<p>In the Chinese banking system, the beneficiary name on a corporate account is the exact registered name of the account holder in the official business registry. Banks are strict about this internally. A supplier operating a legitimate corporate account cannot change the displayed beneficiary name to whatever you want; it is tied to their registration.<\/p>\n<p>This gives you a powerful verification tool. Take the supplier's business license (营业执照) and read the registered company name in Chinese — it ends in 有限公司 (Co., Ltd.) or a similar suffix. Then compare the bank beneficiary name on the proforma invoice with that exact Chinese name and its standard English translation.<\/p>\n<p>If the invoice beneficiary says <code>XYZ Trading Co., Ltd<\/code> but the license says <code>Shenzhen ABC Technology Co., Ltd<\/code>, that is not a rounding error. It is the core question of the whole transaction: <strong>who actually receives my money?<\/strong> Before you can trust any other assurance, you need a documented, aligned chain from the company you negotiate with, to the company you contract with, to the account you pay.<\/p>\n<hr>\n<h2>Common Mismatch Explanations and What They Mean<\/h2>\n<p>Suppliers will offer explanations for mismatches. Some are legitimate; most are not, and the distinction matters.<\/p>\n<table><thead><tr><th>Supplier explanation<\/th><th>Legitimacy<\/th><th>What to do<\/th><\/tr><\/thead><tbody><tr><td>&quot;X is our export agent / trading company&quot;<\/td><td>Sometimes real, but shifts risk<\/td><td>Contract with X, not the factory; verify X<\/td><\/tr><tr><td>&quot;X is the boss's personal account, easier&quot;<\/td><td>Weak; personal accounts lack recourse<\/td><td>Refuse for material amounts<\/td><\/tr><tr><td>&quot;Our HK account is for receiving foreign currency&quot;<\/td><td>Common and sometimes real<\/td><td>Verify the HK entity is linked to the mainland entity in writing<\/td><\/tr><tr><td>&quot;We just changed banks, updated details attached&quot;<\/td><td>Classic fraud script<\/td><td>Call the supplier on a known number to confirm<\/td><\/tr><tr><td>&quot;The license is under our partner, business is the same&quot;<\/td><td>Almost always a red flag<\/td><td>Do not proceed without clarification<\/td><\/tr><tr><td>&quot;Company name changed recently, license still old&quot;<\/td><td>Occasionally true<\/td><td>Request the updated license and run a registry check<\/td><\/tr><\/tbody><\/table>\n<p>The pattern to internalize: <strong>anyone can explain a mismatch. Only documents can resolve one.<\/strong> An explanation that is not supported by a registry record, a contract naming the payee, or a signed statement is just a sentence.<\/p>\n<hr>\n<h2>Personal, Offshore, and Hong Kong Accounts<\/h2>\n<p>A request to pay a personal account is one of the clearest signals in the entire sourcing process. It appears in legitimate contexts occasionally — a small workshop or a solo entrepreneur — but even then it is not in your interest. Personal accounts are dangerous for four reasons: there is no corporate remedy, because suing a company and suing an individual are different actions with different asset pools; there is no export documentation trail, which weakens your ability to prove the transaction; they are a fraud hallmark, since fake suppliers almost always use personal or third-party accounts that are easy to open and abandon; and they create tax and legal opacity about who the counterparty really was. If a supplier insists on a personal account for anything beyond a small sample fee, treat it as a hard stop.<\/p>\n<p>Many legitimate Chinese exporters, however, receive foreign currency through a Hong Kong or offshore account, and this is not inherently suspicious — Hong Kong offers easier multi-currency handling and is a standard trade hub. But it introduces a verification step, because your counterparty on the contract is a mainland entity while your payee is a Hong Kong entity. Establish the link: ask for the ownership structure in writing, including who owns the HK company and how it relates to the mainland factory; check that the HK company appears on the contract or invoice as an authorized payee; verify the HK company in the Hong Kong Companies Registry, which is searchable by name; and if the HK company is unrelated and undocumented, treat the payment as going to a third party. A legitimate HK receiving structure can be documented in five minutes by a supplier who actually has one.<\/p>\n<hr>\n<h2>Cross-Checking with Public Data<\/h2>\n<p>You can verify a great deal without any special access, because the following sources are public.<\/p>\n<p><strong>China's National Enterprise Credit Information Publicity System<\/strong> (国家企业信用信息公示系统). Search the full Chinese company name and you get the registration number, legal representative, registered capital, address, business scope, and status. Check that the entity is active and that the name matches exactly. This is the authoritative source and the one to trust when a commercial site disagrees.<\/p>\n<p><strong>Commercial registry mirrors<\/strong> such as Qichacha and Tianyancha-style services. These mirror the same underlying registry data, are often easier to search, and are better at revealing related entities. They are useful for spotting whether the &quot;factory&quot; is actually a shell linked to dozens of other companies.<\/p>\n<p><strong>The business license itself.<\/strong> Cross-check the Unified Social Credit Code (统一社会信用代码, 18 characters) against the registry. A license whose code does not resolve to a real registration is a forgery, regardless of how professional it looks.<\/p>\n<p><strong>Customs registration.<\/strong> Chinese exporters register with customs. If a supplier claims to export, a customs registration check adds evidence, and exporters also appear in third-party trade data services.<\/p>\n<p><strong>Bank verification.<\/strong> Banks will not confirm an account to a stranger for privacy reasons. But your own bank, when processing a wire, can sometimes flag a beneficiary name mismatch before sending. Enter the beneficiary name exactly and note any warning your bank raises. Do not treat a clean wire as proof, however: most banks check formatting, not ownership, so a transfer that goes through tells you the account exists, not that it belongs to the company you think it does.<\/p>\n<hr>\n<h2>The Business Email Compromise Pattern<\/h2>\n<p>The most common high-loss scenario is not a fake supplier — it is a real supplier whose email was compromised, or a lookalike domain registered to intercept the conversation. The typical sequence: you negotiate with a real supplier at a legitimate address; near payment you receive an email from a domain that differs by one character, or a reply-chain message with updated bank details; the new account is offshore or in a name you have not seen; you pay; and the real supplier never receives it. Neither do you get goods.<\/p>\n<p>Defenses are simple but must be followed literally. Confirm bank details by a phone call to a number you already had, never a number in the email. Check the sender's full domain character by character. Never accept bank detail changes in a reply chain; treat every change as a fresh verification. And ask the supplier to state the account details in a signed document, then compare it against the invoice.<\/p>\n<hr>\n<h2>A Verification Workflow You Can Run Today<\/h2>\n<ul>\n<li>Obtain the business license image and the proforma invoice.<\/li>\n<li>Extract the Chinese registered name and the Unified Social Credit Code.<\/li>\n<li>Search both in the national registry and confirm active status and a matching name.<\/li>\n<li>Compare the beneficiary name on the invoice with the registered name.<\/li>\n<li>Compare the account jurisdiction with the company's operating location.<\/li>\n<li>Search the company in a commercial registry for related entities and alerts.<\/li>\n<li>Establish the relationship for any offshore payee in writing.<\/li>\n<li>Confirm bank details by an independent channel such as a phone call to a known number.<\/li>\n<li>Enter the beneficiary name exactly during the wire and note any bank warning.<\/li>\n<li>Keep all of this in one folder, timestamped.<\/li>\n<\/ul>\n<p>Not every mismatch is fraud. Sometimes a real, decent supplier simply uses an affiliated trading entity for exports. In that case the correct move is not to abandon the deal but to contract with the entity you are paying: the contract, the invoice, and the bank account should all name the same legal person. The failure point is never &quot;an explanation exists.&quot; It is &quot;the explanation is not documented and the chain is not aligned.&quot;<\/p>\n<p>One habit makes the whole workflow practical: verify before you negotiate hard, not after. Bank details are easiest to confirm while the supplier still wants something from you — a signed order, a price agreement, a promise of future volume. Once you have agreed terms and are eager to pay, the supplier has less patience for verification and you have less leverage to insist on it. Make account verification a standard, boring precondition of every first payment, applied to every supplier regardless of how trustworthy they seem, so that it never reads as an accusation and never gets skipped for an important order.<\/p>\n<hr>\n<h2>Quick checklist<\/h2>\n<ul>\n<li>[ ] Beneficiary name on the invoice matches the Chinese registered name on the license exactly.<\/li>\n<li>[ ] Unified Social Credit Code verified in the national registry; entity is active.<\/li>\n<li>[ ] Bank account is corporate, not personal, for any material amount.<\/li>\n<li>[ ] Offshore or Hong Kong payee has a documented ownership link to the contracting entity.<\/li>\n<li>[ ] Bank details confirmed by phone to a previously-known number, not the email.<\/li>\n<li>[ ] Sender domain checked character by character.<\/li>\n<li>[ ] Contract, invoice, and beneficiary all name the same legal person.<\/li>\n<li>[ ] Any change of bank details after negotiation triggers a full re-verification.<\/li>\n<li>[ ] Your bank was asked to flag a beneficiary name mismatch before sending.<\/li>\n<li>[ ] All verification evidence is saved, timestamped, in one folder.<\/li>\n<\/ul>\n<p>Verify the account, not just the company. The account is where the money actually goes, and it is the last checkpoint you fully control.<\/p>","cta":"https://lu7897859-tech.github.io/doors/sourcing-audit/","ctaTitle":"Check a supplier for free, right now","ctaText":"Paste the supplier's 18-digit USCC or full registered name for an instant structural check — then go further with the full verification guide.","ctaBtn":"Open the free check"},"type":"article"};</script>
<script>
(function(){
  var D = window.DOOR || {};
  var t = D.type || 'door';
  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var ROOT = D.root || '';   // -> GH Pages root
  var UP = D.up || '';       // -> door dir ('' or '../')
  function isExt(u){ return /^https?:|^mailto:/.test(String(u||'')); }
  function dlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; if(u.charAt(0)==='#') return UP+'index.html'+u; return UP+u.replace(/^\.?\//,''); }
  function rlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; return ROOT+u.replace(/^\.?\//,''); }
  document.getElementById('brand').textContent = D.brand || '';

  // nav
  var nav = document.getElementById('nav');
  (D.nav || []).forEach(function(n){ nav.appendChild(el('<a href="'+dlink(n.href)+'">'+esc(n.label)+'</a>')); });

  var app = document.getElementById('app');

  function renderDoor(){
    var h = D.hero || {};
    var html = '';
    html += '<section class="hero"><div class="wrap">';
    if(h.eyebrow) html += '<span class="eyebrow">'+esc(h.eyebrow)+'</span>';
    html += '<h1>'+esc(h.h1||'')+'</h1>';
    if(h.sub) html += '<p class="sub">'+esc(h.sub)+'</p>';
    // demo box
    html += '<div class="demo"><div class="dt"><span>'+esc(h.demoTitle||'Try it free')+'</span><b>'+esc(h.demoBadge||'Live')+'</b></div>';
    html += '<div class="row"><input id="dq" placeholder="'+esc(h.demoPlaceholder||'')+'" aria-label="'+esc(h.demoLabel||'query')+'">';
    html += '<button id="db">'+esc(h.demoBtn||'Check')+'</button></div>';
    html += '<div class="out" id="dout"></div>';
    if(h.demoNote) html += '<div class="note">'+esc(h.demoNote)+'</div>';
    html += '</div>';
    if((D.trust||[]).length){ html += '<div class="trust">'+D.trust.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'; }
    html += '</div></section>';

    if((D.steps||[]).length){
      html += '<section><div class="wrap"><h2>'+esc(D.stepsTitle||'How it works')+'</h2><p class="sect-sub">'+esc(D.stepsSub||'')+'</p><div class="grid g3">';
      D.steps.forEach(function(s,i){ html += '<div class="card"><div class="step-n">'+(i+1)+'</div><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div>'; });
      html += '</div></div></section>';
    }

    if((D.products||[]).length){
      html += '<section id="products"><div class="wrap"><h2>'+esc(D.productsTitle||'Products')+'</h2><p class="sect-sub">'+esc(D.productsSub||'')+'</p><div class="grid g3">';
      D.products.forEach(function(p){
        html += '<div class="card prod"><div class="p-top"><div><h3>'+esc(p.name)+'</h3></div>'+(p.price?'<span class="price">'+esc(p.price)+'</span>':'')+'</div>';
        if(p.tagline) html += '<p>'+esc(p.tagline)+'</p>';
        if((p.bullets||[]).length) html += '<ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
        if(p.page) html += '<a class="btn ghost" href="'+dlink(p.page)+'">Details</a>';
        if(p.cta) html += '<a class="btn" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a>';
        html += '</div>';
      });
      html += '</div></div></section>';
    }

    if((D.tiers||[]).length){
      html += '<section id="pricing"><div class="wrap"><h2>'+esc(D.tiersTitle||'Pricing')+'</h2><p class="sect-sub">'+esc(D.tiersSub||'')+'</p><div class="grid g3 tiers">';
      D.tiers.forEach(function(t){
        html += '<div class="card tier'+(t.popular?' pop':'')+'">'+(t.popular?'<span class="badge">'+(esc(t.badge||'Popular'))+'</span>':'')+'<h3>'+esc(t.name)+'</h3><div class="amt">'+esc(t.price)+'</div><div class="per">'+esc(t.per||'')+'</div><ul>'+ (t.features||[]).map(function(f){return '<li>'+esc(f)+'</li>';}).join('') +'</ul>';
        html += '<a class="btn'+(t.ghost?' ghost':'')+'" href="'+dlink(t.cta)+'" rel="noopener">'+esc(t.ctaText||'Choose')+'</a></div>';
      });
      html += '</div></div></section>';
    }

    if((D.faq||[]).length){
      html += '<section id="faq"><div class="wrap"><h2>FAQ</h2><p class="sect-sub"></p><div class="faq">';
      D.faq.forEach(function(f){ html += '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>'; });
      html += '</div></div></section>';
    }
    app.innerHTML = html;
    wireDemo();
  }

  function renderProduct(){
    var p = D.product || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('index.html')+'">← '+esc(D.brand)+'</a></p>';
    html += '<h1>'+esc(p.name)+'</h1>';
    if(p.tagline) html += '<p class="sub" style="margin:0 0 10px">'+esc(p.tagline)+'</p>';
    html += '<p>'+(p.price?'<span class="pill">'+esc(p.price)+'</span>':'')+((p.tags||[]).map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join(''))+'</p>';
    if((p.bullets||[]).length) html += '<h3>What you get</h3><ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
    if(p.sample) html += '<h3>Sample output</h3><pre class="out">'+esc(p.sample)+'</pre>';
    if(p.body) html += p.body; // trusted markdown-lite html from config
    if(p.cta) html += '<p style="margin-top:22px"><a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:700" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a></p>';
    if((D.related||[]).length){
      html += '<h3>Related</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function wireDemo(){
    var inp = document.getElementById('dq'), btn = document.getElementById('db'), out = document.getElementById('dout');
    if(!inp||!btn) return;
    function setOut(msg, cls){ out.className = 'out' + (cls?(' '+cls):''); out.textContent = msg; }

    // ---- client-side USCC (Unified Social Credit Code) checker: real, zero-dependency free hook ----
    var CS = '0123456789ABCDEFGHJKLMNPQRTUWXY';
    var W = [1,3,9,27,19,26,16,17,20,29,25,13,8,24,10,30,28];
    var REG = {'1':'Market regulation','5':'Civil affairs','9':'Other','Y':'Other','1A':'Regulator A'};
    function decodeUSCC(code){
      var s = String(code||'').toUpperCase().replace(/\s+/g,'');
      if(s.length!==18) return {ok:false, reason:'Length is '+s.length+', a USCC is exactly 18 characters.'};
      for(var i=0;i<18;i++){ if(CS.indexOf(s.charAt(i))<0) return {ok:false, reason:'Invalid character "'+s.charAt(i)+'" (letters I, O, S, V, Z are not used).'}; }
      var sum=0; for(var j=0;j<17;j++) sum += CS.indexOf(s.charAt(j))*W[j];
      var expect = CS.charAt((31 - (sum % 31)) % 31);
      var ok = (expect === s.charAt(17));
      return {ok:ok, expect:expect, given:s.charAt(17),
        region:s.slice(2,8), org: s.charAt(8), kind: s.charAt(9), serial:s.slice(10,17)};
    }
    function explain(x){
      if(x.ok){
        return '✅ Structurally valid USCC\n\n'+
          'Region / admin code : '+x.region+'\n'+
          'Entity-type code   : '+x.kind+'\n'+
          'Org code           : '+x.org+'\n'+
          'Serial             : '+x.serial+'\n'+
          'Check digit        : '+x.given+' (valid)\n\n'+
          'Format checks out. What a valid code does NOT tell you: whether the company is still active, who really owns it, or whether it has litigation, sanctions or adverse media. That is what the full report covers.';
      }
      return '❌ Not a structurally valid USCC\n\n'+x.reason+'\n\nTip: paste the 18-character Unified Social Credit Code from the supplier\u2019s business licence, or try the company\u2019s full registered name.';
    }

    async function run(){
      var q = (inp.value||'').trim();
      if(!q){ setOut(D.demoEmpty||'Please enter a company name or 18-digit registration number.','err'); return; }
      btn.disabled = true; var old = btn.textContent; btn.textContent = D.demoBusy||'Checking…';
      try{
        if(D.demoMode === 'uscc'){
          setOut(D.demoBusy||'Checking…','');
          var x = decodeUSCC(q);
          setOut(explain(x), x.ok?'ok':'err');
          beacon(q, x.ok?'valid':'invalid');
        } else if(D.demoMode === 'endpoint' && D.demoEndpoint){
          setOut(D.demoBusy||'Contacting verification service…','');
          var r = await fetch(D.demoEndpoint, { method:'POST', headers:{'content-type':'application/json','accept':'application/json'}, body: JSON.stringify({ keyword: q, tool:'verify_supplier' }) });
          var txt = await r.text(); var j=null; try{ j=JSON.parse(txt); }catch(e){}
          if(r.status===200 && j){ setOut(JSON.stringify(j,null,2).substring(0,1400),'ok'); }
          else if(r.status===402){ setOut((D.paywallNote||'Free instant checks used. Get the full verified report to continue.'),'err'); }
          else { setOut('Service returned status '+r.status+'. '+(D.demoFallback||''),'err'); }
        } else {
          var x2 = decodeUSCC(q);
          setOut(explain(x2), x2.ok?'ok':'err');
        }
      }catch(e){
        setOut((D.demoOffline||'The live demo is momentarily unavailable. The full verification report still works.')+'\n\n'+(D.demoEndpoint||''),'err');
      }
      btn.disabled=false; btn.textContent=old;
    }
    // anonymous use-signal: lets us see the first real visitor arrive (never sent to the supplier)
    function beacon(q, result){
      if(!D.demoEndpoint) return;
      try{
        fetch(D.demoEndpoint, { method:'POST', keepalive:true, headers:{'content-type':'application/json'}, body: JSON.stringify({ keyword:q, tool:'verify_supplier', source:'door-free-hook', result:result }) }).catch(function(){});
      }catch(e){}
    }
    btn.addEventListener('click',run);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  }

  function renderArticle(){
    var a = D.article || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('blog/index.html')+'">← All guides</a></p>';
    html += '<h1>'+esc(a.title)+'</h1>';
    if(a.desc) html += '<p class="sub" style="margin:0 0 18px">'+esc(a.desc)+'</p>';
    if((a.tags||[]).length) html += '<p>'+a.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
    html += '<div data-article>'+(a.html||'')+'</div>';
    if(a.cta){
      html += '<div class="card" style="margin-top:30px;border-color:var(--accent)"><h3>'+esc(a.ctaTitle||'Check a supplier now')+'</h3><p style="margin-bottom:14px">'+esc(a.ctaText||'')+'</p>';
      html += '<a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700" href="'+dlink(a.cta)+'" rel="noopener">'+esc(a.ctaBtn||'Open the free check')+'</a></div>';
    }
    if((D.related||[]).length){
      html += '<h3>Related guides</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function renderBlogIndex(){
    var posts = D.posts || [];
    var html = '<section class="hero"><div class="wrap"><span class="eyebrow">'+esc(D.blogEyebrow||'Guides')+'</span><h1>'+esc(D.blogTitle||'China sourcing guides')+'</h1>';
    if(D.blogSub) html += '<p class="sub">'+esc(D.blogSub)+'</p>';
    html += '</div></section><section><div class="wrap"><div class="grid g2">';
    posts.forEach(function(p){
      html += '<div class="card"><h3><a href="'+dlink(p.href)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.desc||'')+'</p>';
      if(p.tags&&p.tags.length) html += '<p style="margin-top:10px">'+p.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
      html += '</div>';
    });
    html += '</div></div></section>';
    app.innerHTML = html;
  }

  if(t==='product') renderProduct(); else if(t==='article') renderArticle(); else if(t==='blog') renderBlogIndex(); else renderDoor();

  // footer
  var foot = document.getElementById('foot');
  (D.footer||[]).forEach(function(col){
    foot.appendChild(el('<div><h4>'+esc(col.t)+'</h4>'+ (col.links||[]).map(function(l){ return '<a href="'+rlink(l.href)+'"'+(isExt(l.href)?' rel="noopener"':'')+'>'+esc(l.label)+'</a>'; }).join('') +'</div>'));
  });
  document.getElementById('legalLeft').textContent = D.legalLeft || ('© ' + new Date().getFullYear() + ' ' + (D.brand||''));
  document.getElementById('legalRight').textContent = D.legalRight || '';
})();
</script>
