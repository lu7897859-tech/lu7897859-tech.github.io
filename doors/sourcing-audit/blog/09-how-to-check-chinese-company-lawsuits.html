on guide.","articleCtaBtn":"Open the free check","articlesRelated":[{"label":"Free instant USCC check","href":"../free-uscc-check.html"},{"label":"Pricing & reports","href":"../index.html#pricing"},{"label":"MCP server for AI agents","href":"../mcp-server.html"},{"label":"12 China sourcing scams in 2026","href":"../../articles/12-china-sourcing-scams-2026.html"}],"related":[{"label":"12 China Sourcing Scams in 2026","href":"articles/12-china-sourcing-scams-2026.html"},{"label":"Free USCC checker","href":"doors/sourcing-audit/free-uscc-check.html"}],"article":{"title":"How to Check a Chinese Company's Lawsuits and Enforcement","desc":"Where Chinese court judgments, enforcement records, and the dishonest-debtor list live, and how to read a company's litigation and enforcement history.","tags":["china due diligence","litigation search","laolai","supplier risk"],"html":"<p>A supplier can look healthy on a website and still be buried in lawsuits. Money judgments that have not been paid, court enforcement actions that are ongoing, and a place on the dishonest-debtor list are the clearest available signals that a company is under financial stress — and they are public.<\/p>\n<p>The problem for a Western buyer is that these records live in Chinese, inside systems that were not designed for foreign users. This article explains where each type of record lives, what the key terms mean, and how to read what you find.<\/p>\n<h2>Where Chinese litigation and enforcement records live<\/h2>\n<p>Three categories matter most, and they are distinct.<\/p>\n<p><strong>Court judgment records.<\/strong> Chinese courts publish many judgments and case documents through public judicial databases. Searching by company name can surface cases where the company was a plaintiff, a defendant, or a party in a commercial dispute. These show you what disagreements the company has been in and roughly how they ended.<\/p>\n<p><strong>Enforcement records.<\/strong> When a court judgment is not paid, the winning party can apply to the court for enforcement against the debtor. This creates an enforcement record. In Chinese records you will see the term &quot;被执行&quot; (bèi zhíxíng), which means the company is a subject of court enforcement — effectively, a judgment creditor is pursuing it through the courts.<\/p>\n<p><strong>The dishonest-debtor list.<\/strong> If a debtor has the capacity to pay but refuses to comply with an enforcement order, a court can place the company and, in some cases, its legal representative on the dishonest-debtor list. This is commonly called the &quot;laolai&quot; (老赖) list. Being on it is a serious reputational and practical problem: it typically restricts the person and company in banking, travel, and high-value transactions.<\/p>\n<p>These records connect to the national enterprise credit system, run through the market regulator. The same system also holds basic registration data, which is what you cross-check against.<\/p>\n<h2>What each signal actually means<\/h2>\n<p>The terms are not interchangeable, and reading them correctly is the whole skill.<\/p>\n<ul>\n<li><strong>A judgment against a company<\/strong> means a case was decided. It does not mean the company refused to pay, and it does not by itself mean the company is insolvent. Many healthy companies have judgments.<\/li>\n<li><strong>An enforcement record<\/strong> means a judgment was not satisfied and the creditor went to court to collect. This is a stronger negative signal, because it indicates a payment that was resisted long enough to require enforcement.<\/li>\n<li><strong>A laolai listing<\/strong> is the strongest of the three. It indicates a refusal to comply despite capacity. For a buyer, it should effectively end the conversation about paying that company in advance.<\/li>\n<\/ul>\n<p>Read the pattern, not one record. A single old enforcement matter that was resolved is very different from multiple recent enforcement cases, especially if the amounts are growing or the company is repeatedly defending the same type of dispute.<\/p>\n<h2>How to search effectively<\/h2>\n<p>Chinese records are sensitive to how you enter the name. A few practical points:<\/p>\n<ul>\n<li>Search by the exact registered company name in Chinese characters. Trading names, English names, and abbreviations will often return nothing or the wrong entity.<\/li>\n<li>Use the Unified Social Credit Code (USCC) if you have it. The USCC is an 18-character code with a check digit. It identifies the entity uniquely, which avoids the name-matching problem entirely.<\/li>\n<li>Try the legal representative's name as well. Compliance issues, enforcement matters, and restrictions often attach to the person, not only the company.<\/li>\n<li>Check historical names. Chinese companies rename themselves, and an older record may sit under a previous name.<\/li>\n<li>Look at dates. A record from years ago that has since been resolved is far less relevant than activity in the past 12 to 24 months.<\/li>\n<\/ul>\n<p>If a supplier is unwilling to provide its registered name or USCC, treat that as information in itself. A legitimate company has no reason to hide an identifier that appears on every invoice and business licence.<\/p>\n<h2>What a Chinese business licence tells you<\/h2>\n<p>The business licence is the foundational document, and it is worth understanding the fields, because every record search starts there:<\/p>\n<ul>\n<li><strong>Name<\/strong> — the registered legal name, in Chinese.<\/li>\n<li><strong>USCC<\/strong> — the 18-character identifier.<\/li>\n<li><strong>Legal representative<\/strong> — the person legally responsible for the company.<\/li>\n<li><strong>Registered capital<\/strong> — the subscribed capital. This is not the same as paid-in capital.<\/li>\n<li><strong>Registered address<\/strong> — the address of record, which may differ from where the work happens.<\/li>\n<li><strong>Business scope<\/strong> — what the company is permitted to do. A supplier whose scope does not include its claimed activity is a red flag.<\/li>\n<li><strong>Establishment date<\/strong> — when the company was formed. A very recent entity claiming decades of experience deserves scrutiny.<\/li>\n<li><strong>Term<\/strong> — the registered operating period.<\/li>\n<\/ul>\n<p>Note that a well-formed USCC proves format validity only. It does not prove the company is active, solvent, or controlled by the person negotiating with you. It is the anchor for verification, not the verification itself.<\/p>\n<h2>Reading a company's financial trajectory from public signals<\/h2>\n<p>Some of the most useful signals are not lawsuits at all. They are changes in the company's basic facts over time.<\/p>\n<p>In a documented real case, a supplier in Zhongshan cut its registered capital by CNY 6.44 million, reducing it from roughly 10 million to about 3.56 million, and at the same time its job postings fell from 25 to 3 — a drop of about 88% — shortly before the company went silent. Each signal alone is ambiguous. A capital reduction can be routine; a hiring pause can be seasonal. Together, and close to a period of silence, they describe a company being wound down.<\/p>\n<p>This is why historical snapshots matter as much as the current record. A company that looked fine a year ago can look very different now, and public data lets you see the direction of travel.<\/p>\n<h2>Common mistakes buyers make<\/h2>\n<ul>\n<li>Relying on the supplier's own claims of certifications and awards, which are often marketing rather than verification.<\/li>\n<li>Trusting a platform badge. &quot;Gold Supplier&quot; on Alibaba is a paid advertising and subscription slot, not an independent trust badge, and it says nothing about litigation history.<\/li>\n<li>Searching in English and concluding &quot;no records found.&quot;<\/li>\n<li>Checking only the company and never the legal representative or the ownership structure.<\/li>\n<li>Treating one old resolved case as disqualifying, or ignoring a cluster of recent ones.<\/li>\n<\/ul>\n<h2>Quick Verification Checklist<\/h2>\n<ul>\n<li>Get the exact Chinese registered name and the USCC from an invoice or the licence before searching anything.<\/li>\n<li>Search court judgment records, enforcement records (&quot;被执行&quot;), and the dishonest-debtor (laolai) list for the company and its legal representative.<\/li>\n<li>Look for recent activity in the past 12 to 24 months rather than isolated historical cases.<\/li>\n<li>Compare registration data over time for capital reductions, address changes, and scope changes.<\/li>\n<li>Cross-check that the name on the platform listing matches the name on the licence and the payment beneficiary.<\/li>\n<\/ul>\n<h2>What this means if you are about to pay<\/h2>\n<p>Litigation and enforcement records are public, cheap to check, and decisive when they are bad. If you are about to wire a deposit to a company whose enforcement history you have never looked at, you are paying on faith. A short records check before payment is the cheapest insurance in sourcing.<\/p>\n<p><strong>Want to verify a specific supplier before you pay?<\/strong><\/p>\n<p>→ Free instant check: https://lu7897859-tech.github.io/doors/sourcing-audit/<\/p>\n<p>→ Full 5-layer verification guide ($14): https://lunarwave8803.gumroad.com/l/kbgmsy<\/p>","cta":"https://lu7897859-tech.github.io/doors/sourcing-audit/","ctaTitle":"Check a supplier for free, right now","ctaText":"Paste the supplier's 18-digit USCC or full registered name for an instant structural check — then go further with the full verification guide.","ctaBtn":"Open the free check"},"type":"article"};</script>

  function dlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; if(u.charAt(0)==='#') return UP+'index.html'+u; return UP+u.replace(/^\.?\//,''); }
  function rlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; return ROOT+u.replace(/^\.?\//,''); }
  document.getElementById('brand').textContent = D.brand || '';

  // nav
  var nav = document.getElementById('nav');
  (D.nav || []).forEach(function(n){ nav.appendChild(el('<a href="'+dlink(n.href)+'">'+esc(n.label)+'</a>')); });

  var app = document.getElementById('app');

  function renderDoor(){
    var h = D.hero || {};
    var html = '';
    html += '<section class="hero"><div class="wrap">';
    if(h.eyebrow) html += '<span class="eyebrow">'+esc(h.eyebrow)+'</span>';
    html += '<h1>'+esc(h.h1||'')+'</h1>';
    if(h.sub) html += '<p class="sub">'+esc(h.sub)+'</p>';
    // demo box
    html += '<div class="demo"><div class="dt"><span>'+esc(h.demoTitle||'Try it free')+'</span><b>'+esc(h.demoBadge||'Live')+'</b></div>';
    html += '<div class="row"><input id="dq" placeholder="'+esc(h.demoPlaceholder||'')+'" aria-label="'+esc(h.demoLabel||'query')+'">';
    html += '<button id="db">'+esc(h.demoBtn||'Check')+'</button></div>';
    html += '<div class="out" id="dout"></div>';
    if(h.demoNote) html += '<div class="note">'+esc(h.demoNote)+'</div>';
    html += '</div>';
    if((D.trust||[]).length){ html += '<div class="trust">'+D.trust.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'; }
    html += '</div></section>';

    if((D.steps||[]).length){
      html += '<section><div class="wrap"><h2>'+esc(D.stepsTitle||'How it works')+'</h2><p class="sect-sub">'+esc(D.stepsSub||'')+'</p><div class="grid g3">';
      D.steps.forEach(function(s,i){ html += '<div class="card"><div class="step-n">'+(i+1)+'</div><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div>'; });
      html += '</div></div></section>';
    }

    if((D.products||[]).length){
      html += '<section id="products"><div class="wrap"><h2>'+esc(D.productsTitle||'Products')+'</h2><p class="sect-sub">'+esc(D.productsSub||'')+'</p><div class="grid g3">';
      D.products.forEach(function(p){
        html += '<div class="card prod"><div class="p-top"><div><h3>'+esc(p.name)+'</h3></div>'+(p.price?'<span class="price">'+esc(p.price)+'</span>':'')+'</div>';
        if(p.tagline) html += '<p>'+esc(p.tagline)+'</p>';
        if((p.bullets||[]).length) html += '<ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
        if(p.page) html += '<a class="btn ghost" href="'+dlink(p.page)+'">Details</a>';
        if(p.cta) html += '<a class="btn" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a>';
        html += '</div>';
      });
      html += '</div></div></section>';
    }

    if((D.tiers||[]).length){
      html += '<section id="pricing"><div class="wrap"><h2>'+esc(D.tiersTitle||'Pricing')+'</h2><p class="sect-sub">'+esc(D.tiersSub||'')+'</p><div class="grid g3 tiers">';
      D.tiers.forEach(function(t){
        html += '<div class="card tier'+(t.popular?' pop':'')+'">'+(t.popular?'<span class="badge">'+(esc(t.badge||'Popular'))+'</span>':'')+'<h3>'+esc(t.name)+'</h3><div class="amt">'+esc(t.price)+'</div><div class="per">'+esc(t.per||'')+'</div><ul>'+ (t.features||[]).map(function(f){return '<li>'+esc(f)+'</li>';}).join('') +'</ul>';
        html += '<a class="btn'+(t.ghost?' ghost':'')+'" href="'+dlink(t.cta)+'" rel="noopener">'+esc(t.ctaText||'Choose')+'</a></div>';
      });
      html += '</div></div></section>';
    }

    if((D.faq||[]).length){
      html += '<section id="faq"><div class="wrap"><h2>FAQ</h2><p class="sect-sub"></p><div class="faq">';
      D.faq.forEach(function(f){ html += '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>'; });
      html += '</div></div></section>';
    }
    app.innerHTML = html;
    wireDemo();
  }

  function renderProduct(){
    var p = D.product || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('index.html')+'">← '+esc(D.brand)+'</a></p>';
    html += '<h1>'+esc(p.name)+'</h1>';
    if(p.tagline) html += '<p class="sub" style="margin:0 0 10px">'+esc(p.tagline)+'</p>';
    html += '<p>'+(p.price?'<span class="pill">'+esc(p.price)+'</span>':'')+((p.tags||[]).map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join(''))+'</p>';
    if((p.bullets||[]).length) html += '<h3>What you get</h3><ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
    if(p.sample) html += '<h3>Sample output</h3><pre class="out">'+esc(p.sample)+'</pre>';
    if(p.body) html += p.body; // trusted markdown-lite html from config
    if(p.cta) html += '<p style="margin-top:22px"><a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:700" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a></p>';
    if((D.related||[]).length){
      html += '<h3>Related</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function wireDemo(){
    var inp = document.getElementById('dq'), btn = document.getElementById('db'), out = document.getElementById('dout');
    if(!inp||!btn) return;
    function setOut(msg, cls){ out.className = 'out' + (cls?(' '+cls):''); out.textContent = msg; }

    // ---- client-side USCC (Unified Social Credit Code) checker: real, zero-dependency free hook ----
    var CS = '0123456789ABCDEFGHJKLMNPQRTUWXY';
    var W = [1,3,9,27,19,26,16,17,20,29,25,13,8,24,10,30,28];
    var REG = {'1':'Market regulation','5':'Civil affairs','9':'Other','Y':'Other','1A':'Regulator A'};
    function decodeUSCC(code){
      var s = String(code||'').toUpperCase().replace(/\s+/g,'');
      if(s.length!==18) return {ok:false, reason:'Length is '+s.length+', a USCC is exactly 18 characters.'};
      for(var i=0;i<18;i++){ if(CS.indexOf(s.charAt(i))<0) return {ok:false, reason:'Invalid character "'+s.charAt(i)+'" (letters I, O, S, V, Z are not used).'}; }
      var sum=0; for(var j=0;j<17;j++) sum += CS.indexOf(s.charAt(j))*W[j];
      var expect = CS.charAt((31 - (sum % 31)) % 31);
      var ok = (expect === s.charAt(17));
      return {ok:ok, expect:expect, given:s.charAt(17),
        region:s.slice(2,8), org: s.charAt(8), kind: s.charAt(9), serial:s.slice(10,17)};
    }
    function explain(x){
      if(x.ok){
        return '✅ Structurally valid USCC\n\n'+
          'Region / admin code : '+x.region+'\n'+
          'Entity-type code   : '+x.kind+'\n'+
          'Org code           : '+x.org+'\n'+
          'Serial             : '+x.serial+'\n'+
          'Check digit        : '+x.given+' (valid)\n\n'+
          'Format checks out. What a valid code does NOT tell you: whether the company is still active, who really owns it, or whether it has litigation, sanctions or adverse media. That is what the full report covers.';
      }
      return '❌ Not a structurally valid USCC\n\n'+x.reason+'\n\nTip: paste the 18-character Unified Social Credit Code from the supplier\u2019s business licence, or try the company\u2019s full registered name.';
    }

    async function run(){
      var q = (inp.value||'').trim();
      if(!q){ setOut(D.demoEmpty||'Please enter a company name or 18-digit registration number.','err'); return; }
      btn.disabled = true; var old = btn.textContent; btn.textContent = D.demoBusy||'Checking…';
      try{
        if(D.demoMode === 'uscc'){
          setOut(D.demoBusy||'Checking…','');
          var x = decodeUSCC(q);
          setOut(explain(x), x.ok?'ok':'err');
          beacon(q, x.ok?'valid':'invalid');
        } else if(D.demoMode === 'endpoint' && D.demoEndpoint){
          setOut(D.demoBusy||'Contacting verification service…','');
          var r = await fetch(D.demoEndpoint, { method:'POST', headers:{'content-type':'application/json','accept':'application/json'}, body: JSON.stringify({ keyword: q, tool:'verify_supplier' }) });
          var txt = await r.text(); var j=null; try{ j=JSON.parse(txt); }catch(e){}
          if(r.status===200 && j){ setOut(JSON.stringify(j,null,2).substring(0,1400),'ok'); }
          else if(r.status===402){ setOut((D.paywallNote||'Free instant checks used. Get the full verified report to continue.'),'err'); }
          else { setOut('Service returned status '+r.status+'. '+(D.demoFallback||''),'err'); }
        } else {
          var x2 = decodeUSCC(q);
          setOut(explain(x2), x2.ok?'ok':'err');
        }
      }catch(e){
        setOut((D.demoOffline||'The live demo is momentarily unavailable. The full verification report still works.')+'\n\n'+(D.demoEndpoint||''),'err');
      }
      btn.disabled=false; btn.textContent=old;
    }
    // anonymous use-signal: lets us see the first real visitor arrive (never sent to the supplier)
    function beacon(q, result){
      if(!D.demoEndpoint) return;
      try{
        fetch(D.demoEndpoint, { method:'POST', keepalive:true, headers:{'content-type':'application/json'}, body: JSON.stringify({ keyword:q, tool:'verify_supplier', source:'door-free-hook', result:result }) }).catch(function(){});
      }catch(e){}
    }
    btn.addEventListener('click',run);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  }

  function renderArticle(){
    var a = D.article || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('blog/index.html')+'">← All guides</a></p>';
    html += '<h1>'+esc(a.title)+'</h1>';
    if(a.desc) html += '<p class="sub" style="margin:0 0 18px">'+esc(a.desc)+'</p>';
    if((a.tags||[]).length) html += '<p>'+a.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
    html += '<div data-article>'+(a.html||'')+'</div>';
    if(a.cta){
      html += '<div class="card" style="margin-top:30px;border-color:var(--accent)"><h3>'+esc(a.ctaTitle||'Check a supplier now')+'</h3><p style="margin-bottom:14px">'+esc(a.ctaText||'')+'</p>';
      html += '<a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700" href="'+dlink(a.cta)+'" rel="noopener">'+esc(a.ctaBtn||'Open the free check')+'</a></div>';
    }
    if((D.related||[]).length){
      html += '<h3>Related guides</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function renderBlogIndex(){
    var posts = D.posts || [];
    var html = '<section class="hero"><div class="wrap"><span class="eyebrow">'+esc(D.blogEyebrow||'Guides')+'</span><h1>'+esc(D.blogTitle||'China sourcing guides')+'</h1>';
    if(D.blogSub) html += '<p class="sub">'+esc(D.blogSub)+'</p>';
    html += '</div></section><section><div class="wrap"><div class="grid g2">';
    posts.forEach(function(p){
      html += '<div class="card"><h3><a href="'+dlink(p.href)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.desc||'')+'</p>';
      if(p.tags&&p.tags.length) html += '<p style="margin-top:10px">'+p.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
      html += '</div>';
    });
    html += '</div></div></section>';
    app.innerHTML = html;
  }

  if(t==='product') renderProduct(); else if(t==='article') renderArticle(); else if(t==='blog') renderBlogIndex(); else renderDoor();

  // footer
  var foot = document.getElementById('foot');
  (D.footer||[]).forEach(function(col){
    foot.appendChild(el('<div><h4>'+esc(col.t)+'</h4>'+ (col.links||[]).map(function(l){ return '<a href="'+rlink(l.href)+'"'+(isExt(l.href)?' rel="noopener"':'')+'>'+esc(l.label)+'</a>'; }).join('') +'</div>'));
  });
  document.getElementById('legalLeft').textContent = D.legalLeft || ('© ' + new Date().getFullYear() + ' ' + (D.brand||''));
  document.getElementById('legalRight').textContent = D.legalRight || '';
})();
</script>
