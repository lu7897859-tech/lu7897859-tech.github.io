stered name for an instant structural check — then go further with the full verification guide.","articleCtaBtn":"Open the free check","articlesRelated":[{"label":"Free instant USCC check","href":"../free-uscc-check.html"},{"label":"Tariff stack calculator","href":"../tools/tariff-stack-calculator.html"},{"label":"Pricing & reports","href":"../index.html#pricing"},{"label":"MCP server for AI agents","href":"../mcp-server.html"},{"label":"12 China sourcing scams in 2026","href":"../../articles/12-china-sourcing-scams-2026.html"}],"related":[{"label":"12 China Sourcing Scams in 2026","href":"articles/12-china-sourcing-scams-2026.html"},{"label":"Free USCC checker","href":"doors/sourcing-audit/free-uscc-check.html"}],"article":{"title":"Safest Payment Terms When Sourcing from China","desc":"Compare T/T, deposits, escrow and trade assurance, and letters of credit by risk level, plus the account-name rule that prevents most payment fraud.","tags":["payment terms","china sourcing","trade assurance","supplier risk"],"html":"<p>Most money lost in sourcing from China is not lost on quality. It is lost on payment. The buyer sends funds to an account, the supplier goes quiet, and there is no practical recovery. The payment method and the account details decide whether you have any recourse at all.<\/p>\n<p>This guide orders the common payment terms by risk, explains what each actually protects, and ends with the single practice that prevents most losses.<\/p>\n<h2>The risk ladder<\/h2>\n<p>Payment terms differ mainly in who holds the money and when the supplier gets it.<\/p>\n<p><strong>Full advance by T/T (bank transfer).<\/strong> You wire the entire amount before production. The supplier holds all the leverage. If the supplier disappears, your only remedy is a dispute across borders and languages. This is the worst term commercially and the most common cause of total loss.<\/p>\n<p><strong>Deposit plus balance before shipment.<\/strong> You pay a deposit, commonly around a third, and the rest when the goods are ready. This is the standard structure in the industry. It is better than full advance because you retain the balance as leverage. It is not safe because the balance is still released before you have seen the goods, and because the deposit itself is at risk if the supplier never produces.<\/p>\n<p><strong>Deposit plus balance against documents or after inspection.<\/strong> The balance is released after an inspection result you accept, or against shipping documents. This materially improves your position because the largest payment follows evidence. It is the structure to push for on any order that matters.<\/p>\n<p><strong>Escrow and platform trade assurance.<\/strong> A platform holds the funds and releases them according to agreed conditions. This is the strongest common protection because you are paying into a mediated structure rather than into a stranger's account. Its protection is only as good as the platform's rules and the supplier's participation, and many suppliers will push to move you off it.<\/p>\n<p><strong>Letters of credit (L/C).<\/strong> A bank commits to pay the supplier against a defined set of documents. The bank's involvement means the supplier is paid only on compliant documents. L/Cs are strong for large orders but carry their own complexity — document discrepancies are common, fees apply, and the mechanism suits larger transactions rather than small ones.<\/p>\n<h2>What each term actually protects<\/h2>\n<ul>\n<li><strong>Full advance<\/strong> protects the supplier. It depends entirely on trust in the entity.<\/li>\n<li><strong>Deposit plus balance before shipment<\/strong> protects you somewhat, but only until the balance leaves.<\/li>\n<li><strong>Balance after inspection<\/strong> shifts the decision point to when you have evidence.<\/li>\n<li><strong>Escrow or trade assurance<\/strong> gives you a process and, in principle, a recovery path.<\/li>\n<li><strong>L/C<\/strong> gives you a bank's document check in place of your own verification.<\/li>\n<\/ul>\n<p>No term protects you from a supplier that never intended to deliver, except the ones where money is still held by a third party when the problem becomes clear.<\/p>\n<h2>The account-name rule<\/h2>\n<p>This single rule prevents the majority of payment losses, and it is not a technicality.<\/p>\n<p><strong>The name on the receiving bank account must match the legal name on the business licence of the contracting entity.<\/strong><\/p>\n<p>If the account name is a personal name, a different company, or a name that does not match the licence you verified, stop. Do not proceed to &quot;sort it out later.&quot; That mismatch is the point at which funds become untraceable and recovery becomes effectively impossible.<\/p>\n<p>Suppliers often explain a mismatch with a plausible story: a related company handles payments, the boss's personal account is faster, the old account is being changed. Some of these stories are true. It does not matter. A legitimate supplier can receive payment into an account in its own registered name. If they cannot, the problem is theirs to solve, not yours to absorb.<\/p>\n<p>Other payment red flags to treat as hard stops:<\/p>\n<ul>\n<li><strong>Pressure to wire outside the platform's escrow or trade assurance.<\/strong> The request to move off-platform removes your only mediator. Treat it as a signal, not a preference.<\/li>\n<li><strong>Recent capital reduction.<\/strong> Registered capital being reduced is a public event and a sign the entity is contracting. In one real case, a supplier in Zhongshan reduced registered capital by CNY 6.44 million — from roughly 10 million to roughly 3.56 million — shortly before going silent.<\/li>\n<li><strong>Mass layoffs.<\/strong> A sharp fall in job postings indicates shrinking operations. The same supplier's postings fell from 25 to 3, a drop of 88%.<\/li>\n<li><strong>Urgency.<\/strong> Pressure to pay immediately, today, before a deadline, is a technique. Real suppliers have payment terms they use every day.<\/li>\n<\/ul>\n<h2>Practical safest practice<\/h2>\n<p><strong>Verify the entity first, then agree terms, then pay.<\/strong> In that order, never another. Paying first and verifying later inverts the whole point of verification.<\/p>\n<p><strong>Keep the deposit as small as you can negotiate and tie the balance to inspection.<\/strong> For a first order with a new supplier, the goal is to have as little money at risk at the moment of maximum uncertainty.<\/p>\n<p><strong>Use the platform's mediated payment where it exists.<\/strong> If a supplier refuses trade assurance or escrow without a good reason, price that refusal as risk.<\/p>\n<p><strong>Get the bank details from an independent channel.<\/strong> Do not accept bank details sent by email or chat without confirming them through a second, separate contact such as a phone call to a number you found independently. Payment-detail tampering and impersonation are common enough that confirming details out-of-band is routine good practice.<\/p>\n<p><strong>Pay in tranches and document each one.<\/strong> Each payment should have an invoice, a purpose, and a matching contract term.<\/p>\n<p><strong>Put the terms in the contract, not in chat.<\/strong> A payment schedule agreed in a WeChat thread is worth very little in a dispute. The deposit percentage, the trigger for the balance, the inspection standard, and the account name should all appear in the purchase contract itself, in language both sides have signed. If a supplier is reluctant to put agreed terms in writing, that reluctance is information.<\/p>\n<p><strong>Match the term to the size and novelty of the order.<\/strong> Large orders justify the cost of an L/C. Small first orders with a verified supplier may not. What matters is that the amount of money exposed at the moment of highest uncertainty stays as small as you can make it, and that the release of the largest payment is tied to something you can see.<\/p>\n<h2>Quick Verification Checklist<\/h2>\n<ul>\n<li><strong>Verify the legal entity by name and USCC<\/strong> before agreeing to any payment terms.<\/li>\n<li><strong>Confirm the bank account name matches the licence name exactly.<\/strong> Any mismatch is a stop.<\/li>\n<li><strong>Push for balance after inspection or against documents<\/strong> rather than before shipment.<\/li>\n<li><strong>Keep the first deposit as low as possible<\/strong> and never full advance with a new supplier.<\/li>\n<li><strong>Confirm bank details through a second independent channel<\/strong> before you send anything.<\/li>\n<\/ul>\n<h2>What this means if you are about to pay<\/h2>\n<p>Your payment method determines whether you have recourse, so it deserves as much attention as your unit price. The account-name rule is the highest-value single check in the entire sourcing process. If the name on the account is not the name on the licence, or a supplier pushes you off escrow, treat it as the moment to stop rather than the moment to hurry.<\/p>\n<p><strong>Want to verify a specific supplier before you pay?<\/strong><\/p>\n<p>→ Free instant check: https://lu7897859-tech.github.io/doors/sourcing-audit/<\/p>\n<p>→ Full 5-layer verification guide ($14): https://lunarwave8803.gumroad.com/l/kbgmsy<\/p>","cta":"https://lu7897859-tech.github.io/doors/sourcing-audit/","ctaTitle":"Check a supplier for free, right now","ctaText":"Paste the supplier's 18-digit USCC or full registered name for an instant structural check — then go further with the full verification guide.","ctaBtn":"Open the free check"},"type":"article"};</script>

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var ROOT = D.root || '';   // -> GH Pages root
  var UP = D.up || '';       // -> door dir ('' or '../')
  function isExt(u){ return /^https?:|^mailto:/.test(String(u||'')); }
  function dlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; if(u.charAt(0)==='#') return UP+'index.html'+u; return UP+u.replace(/^\.?\//,''); }
  function rlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; return ROOT+u.replace(/^\.?\//,''); }
  document.getElementById('brand').textContent = D.brand || '';

  // nav
  var nav = document.getElementById('nav');
  (D.nav || []).forEach(function(n){ nav.appendChild(el('<a href="'+dlink(n.href)+'">'+esc(n.label)+'</a>')); });

  var app = document.getElementById('app');

  function renderDoor(){
    var h = D.hero || {};
    var html = '';
    html += '<section class="hero"><div class="wrap">';
    if(h.eyebrow) html += '<span class="eyebrow">'+esc(h.eyebrow)+'</span>';
    html += '<h1>'+esc(h.h1||'')+'</h1>';
    if(h.sub) html += '<p class="sub">'+esc(h.sub)+'</p>';
    // demo box
    html += '<div class="demo"><div class="dt"><span>'+esc(h.demoTitle||'Try it free')+'</span><b>'+esc(h.demoBadge||'Live')+'</b></div>';
    html += '<div class="row"><input id="dq" placeholder="'+esc(h.demoPlaceholder||'')+'" aria-label="'+esc(h.demoLabel||'query')+'">';
    html += '<button id="db">'+esc(h.demoBtn||'Check')+'</button></div>';
    html += '<div class="out" id="dout"></div>';
    if(h.demoNote) html += '<div class="note">'+esc(h.demoNote)+'</div>';
    html += '</div>';
    if((D.trust||[]).length){ html += '<div class="trust">'+D.trust.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'; }
    html += '</div></section>';

    if((D.steps||[]).length){
      html += '<section><div class="wrap"><h2>'+esc(D.stepsTitle||'How it works')+'</h2><p class="sect-sub">'+esc(D.stepsSub||'')+'</p><div class="grid g3">';
      D.steps.forEach(function(s,i){ html += '<div class="card"><div class="step-n">'+(i+1)+'</div><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div>'; });
      html += '</div></div></section>';
    }

    if((D.products||[]).length){
      html += '<section id="products"><div class="wrap"><h2>'+esc(D.productsTitle||'Products')+'</h2><p class="sect-sub">'+esc(D.productsSub||'')+'</p><div class="grid g3">';
      D.products.forEach(function(p){
        html += '<div class="card prod"><div class="p-top"><div><h3>'+esc(p.name)+'</h3></div>'+(p.price?'<span class="price">'+esc(p.price)+'</span>':'')+'</div>';
        if(p.tagline) html += '<p>'+esc(p.tagline)+'</p>';
        if((p.bullets||[]).length) html += '<ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
        if(p.page) html += '<a class="btn ghost" href="'+dlink(p.page)+'">Details</a>';
        if(p.cta) html += '<a class="btn" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a>';
        html += '</div>';
      });
      html += '</div></div></section>';
    }

    if((D.tiers||[]).length){
      html += '<section id="pricing"><div class="wrap"><h2>'+esc(D.tiersTitle||'Pricing')+'</h2><p class="sect-sub">'+esc(D.tiersSub||'')+'</p><div class="grid g3 tiers">';
      D.tiers.forEach(function(t){
        html += '<div class="card tier'+(t.popular?' pop':'')+'">'+(t.popular?'<span class="badge">'+(esc(t.badge||'Popular'))+'</span>':'')+'<h3>'+esc(t.name)+'</h3><div class="amt">'+esc(t.price)+'</div><div class="per">'+esc(t.per||'')+'</div><ul>'+ (t.features||[]).map(function(f){return '<li>'+esc(f)+'</li>';}).join('') +'</ul>';
        html += '<a class="btn'+(t.ghost?' ghost':'')+'" href="'+dlink(t.cta)+'" rel="noopener">'+esc(t.ctaText||'Choose')+'</a></div>';
      });
      html += '</div></div></section>';
    }

    if((D.faq||[]).length){
      html += '<section id="faq"><div class="wrap"><h2>FAQ</h2><p class="sect-sub"></p><div class="faq">';
      D.faq.forEach(function(f){ html += '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>'; });
      html += '</div></div></section>';
    }
    app.innerHTML = html;
    wireDemo();
  }

  function renderProduct(){
    var p = D.product || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('index.html')+'">← '+esc(D.brand)+'</a></p>';
    html += '<h1>'+esc(p.name)+'</h1>';
    if(p.tagline) html += '<p class="sub" style="margin:0 0 10px">'+esc(p.tagline)+'</p>';
    html += '<p>'+(p.price?'<span class="pill">'+esc(p.price)+'</span>':'')+((p.tags||[]).map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join(''))+'</p>';
    if((p.bullets||[]).length) html += '<h3>What you get</h3><ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
    if(p.sample) html += '<h3>Sample output</h3><pre class="out">'+esc(p.sample)+'</pre>';
    if(p.body) html += p.body; // trusted markdown-lite html from config
    if(p.cta) html += '<p style="margin-top:22px"><a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:700" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a></p>';
    if((D.related||[]).length){
      html += '<h3>Related</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function wireDemo(){
    var inp = document.getElementById('dq'), btn = document.getElementById('db'), out = document.getElementById('dout');
    if(!inp||!btn) return;
    function setOut(msg, cls){ out.className = 'out' + (cls?(' '+cls):''); out.textContent = msg; }

    // ---- client-side USCC (Unified Social Credit Code) checker: real, zero-dependency free hook ----
    var CS = '0123456789ABCDEFGHJKLMNPQRTUWXY';
    var W = [1,3,9,27,19,26,16,17,20,29,25,13,8,24,10,30,28];
    var REG = {'1':'Market regulation','5':'Civil affairs','9':'Other','Y':'Other','1A':'Regulator A'};
    function decodeUSCC(code){
      var s = String(code||'').toUpperCase().replace(/\s+/g,'');
      if(s.length!==18) return {ok:false, reason:'Length is '+s.length+', a USCC is exactly 18 characters.'};
      for(var i=0;i<18;i++){ if(CS.indexOf(s.charAt(i))<0) return {ok:false, reason:'Invalid character "'+s.charAt(i)+'" (letters I, O, S, V, Z are not used).'}; }
      var sum=0; for(var j=0;j<17;j++) sum += CS.indexOf(s.charAt(j))*W[j];
      var expect = CS.charAt((31 - (sum % 31)) % 31);
      var ok = (expect === s.charAt(17));
      return {ok:ok, expect:expect, given:s.charAt(17),
        region:s.slice(2,8), org: s.charAt(8), kind: s.charAt(9), serial:s.slice(10,17)};
    }
    function explain(x){
      if(x.ok){
        return '✅ Structurally valid USCC\n\n'+
          'Region / admin code : '+x.region+'\n'+
          'Entity-type code   : '+x.kind+'\n'+
          'Org code           : '+x.org+'\n'+
          'Serial             : '+x.serial+'\n'+
          'Check digit        : '+x.given+' (valid)\n\n'+
          'Format checks out. What a valid code does NOT tell you: whether the company is still active, who really owns it, or whether it has litigation, sanctions or adverse media. That is what the full report covers.';
      }
      return '❌ Not a structurally valid USCC\n\n'+x.reason+'\n\nTip: paste the 18-character Unified Social Credit Code from the supplier\u2019s business licence, or try the company\u2019s full registered name.';
    }

    async function run(){
      var q = (inp.value||'').trim();
      if(!q){ setOut(D.demoEmpty||'Please enter a company name or 18-digit registration number.','err'); return; }
      btn.disabled = true; var old = btn.textContent; btn.textContent = D.demoBusy||'Checking…';
      try{
        if(D.demoMode === 'uscc'){
          setOut(D.demoBusy||'Checking…','');
          var x = decodeUSCC(q);
          setOut(explain(x), x.ok?'ok':'err');
          beacon(q, x.ok?'valid':'invalid');
        } else if(D.demoMode === 'endpoint' && D.demoEndpoint){
          setOut(D.demoBusy||'Contacting verification service…','');
          var r = await fetch(D.demoEndpoint, { method:'POST', headers:{'content-type':'application/json','accept':'application/json'}, body: JSON.stringify({ keyword: q, tool:'verify_supplier' }) });
          var txt = await r.text(); var j=null; try{ j=JSON.parse(txt); }catch(e){}
          if(r.status===200 && j){ setOut(JSON.stringify(j,null,2).substring(0,1400),'ok'); }
          else if(r.status===402){ setOut((D.paywallNote||'Free instant checks used. Get the full verified report to continue.'),'err'); }
          else { setOut('Service returned status '+r.status+'. '+(D.demoFallback||''),'err'); }
        } else {
          var x2 = decodeUSCC(q);
          setOut(explain(x2), x2.ok?'ok':'err');
        }
      }catch(e){
        setOut((D.demoOffline||'The live demo is momentarily unavailable. The full verification report still works.')+'\n\n'+(D.demoEndpoint||''),'err');
      }
      btn.disabled=false; btn.textContent=old;
    }
    // anonymous use-signal: lets us see the first real visitor arrive (never sent to the supplier)
    function beacon(q, result){
      if(!D.demoEndpoint) return;
      try{
        fetch(D.demoEndpoint, { method:'POST', keepalive:true, headers:{'content-type':'application/json'}, body: JSON.stringify({ keyword:q, tool:'verify_supplier', source:'door-free-hook', result:result }) }).catch(function(){});
      }catch(e){}
    }
    btn.addEventListener('click',run);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  }

  function renderArticle(){
    var a = D.article || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('blog/index.html')+'">← All guides</a></p>';
    html += '<h1>'+esc(a.title)+'</h1>';
    if(a.desc) html += '<p class="sub" style="margin:0 0 18px">'+esc(a.desc)+'</p>';
    if((a.tags||[]).length) html += '<p>'+a.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
    html += '<div data-article>'+(a.html||'')+'</div>';
    if(a.cta){
      html += '<div class="card" style="margin-top:30px;border-color:var(--accent)"><h3>'+esc(a.ctaTitle||'Check a supplier now')+'</h3><p style="margin-bottom:14px">'+esc(a.ctaText||'')+'</p>';
      html += '<a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700" href="'+dlink(a.cta)+'" rel="noopener">'+esc(a.ctaBtn||'Open the free check')+'</a></div>';
    }
    if((D.related||[]).length){
      html += '<h3>Related guides</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function renderBlogIndex(){
    var posts = D.posts || [];
    var html = '<section class="hero"><div class="wrap"><span class="eyebrow">'+esc(D.blogEyebrow||'Guides')+'</span><h1>'+esc(D.blogTitle||'China sourcing guides')+'</h1>';
    if(D.blogSub) html += '<p class="sub">'+esc(D.blogSub)+'</p>';
    html += '</div></section><section><div class="wrap"><div class="grid g2">';
    posts.forEach(function(p){
      html += '<div class="card"><h3><a href="'+dlink(p.href)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.desc||'')+'</p>';
      if(p.tags&&p.tags.length) html += '<p style="margin-top:10px">'+p.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
      html += '</div>';
    });
    html += '</div></div></section>';
    app.innerHTML = html;
  }

  if(t==='product') renderProduct(); else if(t==='article') renderArticle(); else if(t==='blog') renderBlogIndex(); else renderDoor();

  // footer
  var foot = document.getElementById('foot');
  (D.footer||[]).forEach(function(col){
    foot.appendChild(el('<div><h4>'+esc(col.t)+'</h4>'+ (col.links||[]).map(function(l){ return '<a href="'+rlink(l.href)+'"'+(isExt(l.href)?' rel="noopener"':'')+'>'+esc(l.label)+'</a>'; }).join('') +'</div>'));
  });
  document.getElementById('legalLeft').textContent = D.legalLeft || ('© ' + new Date().getFullYear() + ' ' + (D.brand||''));
  document.getElementById('legalRight').textContent = D.legalRight || '';
})();
</script>
