stered name for an instant structural check — then go further with the full verification guide.","articleCtaBtn":"Open the free check","articlesRelated":[{"label":"Free instant USCC check","href":"../free-uscc-check.html"},{"label":"Tariff stack calculator","href":"../tools/tariff-stack-calculator.html"},{"label":"Pricing & reports","href":"../index.html#pricing"},{"label":"MCP server for AI agents","href":"../mcp-server.html"},{"label":"12 China sourcing scams in 2026","href":"../../articles/12-china-sourcing-scams-2026.html"}],"related":[{"label":"12 China Sourcing Scams in 2026","href":"articles/12-china-sourcing-scams-2026.html"},{"label":"Free USCC checker","href":"doors/sourcing-audit/free-uscc-check.html"}],"article":{"title":"China Supplier Deposit Safety: How Much Should You Really Pay?","desc":"How much deposit is safe with a Chinese supplier, the red flags that put your money at risk, and how escrow and letters of credit work in practice.","tags":["china sourcing","supplier deposits","payment risk","escrow"],"html":"<p>Paying a deposit is the moment a sourcing deal stops being a conversation and becomes real financial exposure. Until money moves, you have leverage. After it moves, you have a claim. Understanding how much to send, when to send it, and what protects it is the single most valuable skill in cross-border purchasing — more valuable than negotiating a lower unit price, because a lost deposit wipes out the margin on a whole year of orders.<\/p>\n<p>This guide covers the realistic deposit range for Chinese suppliers, the signals that a deposit is likely to disappear, the true risk difference between 30% and 50%, and the practical mechanics of escrow and irrevocable letters of credit.<\/p>\n<hr>\n<h2>Why Deposits Exist and What Is Normal<\/h2>\n<p>Chinese factories operate on thin working capital. A typical small-to-mid factory may run production on revolving credit, supplier terms from its own raw material vendors, and customer deposits. When you place an order, the factory has to buy materials, schedule machine time, and pay labor before your goods ship.<\/p>\n<p>The deposit serves three functions from the supplier's side: it funds raw material purchase for your order, it filters serious buyers from window-shoppers, and it protects against cancellation after production has started. Understanding this tells you where the negotiation space is: a large, well-capitalized factory has less commercial reason to demand a big deposit, while a supplier desperate for cash flow has a strong reason to demand one — and that desperation is not always a good sign.<\/p>\n<p>For standard, non-customized goods from a factory you have not worked with before, the normal range is <strong>30% deposit, 70% against copy of bill of lading<\/strong> or against inspection. Treat anything wildly outside that as a signal.<\/p>\n<table><thead><tr><th>Deposit level<\/th><th>Typical context<\/th><th>Buyer risk level<\/th><\/tr><\/thead><tbody><tr><td>0–10%<\/td><td>Established relationship, or supplier with strong balance sheet<\/td><td>Low for buyer, high for supplier<\/td><\/tr><tr><td>20–30%<\/td><td>Standard first order, non-custom goods<\/td><td>Market normal<\/td><\/tr><tr><td>30–40%<\/td><td>Custom tooling, custom packaging, or mid-size order<\/td><td>Manageable with milestones<\/td><\/tr><tr><td>50%+<\/td><td>Custom molds, long lead time, or supplier cash-flow pressure<\/td><td>Elevated — requires protection<\/td><\/tr><tr><td>100% upfront<\/td><td>Rare; usually signals an intermediary or scam<\/td><td>Very high<\/td><\/tr><\/tbody><\/table>\n<hr>\n<h2>30% vs 50%: The Real Risk Difference<\/h2>\n<p>The difference is not just arithmetic. It changes the incentive structure.<\/p>\n<p>At <strong>30% deposit<\/strong>, the supplier still has 70% of the contract value outstanding. Producing and shipping your order is the only way to collect it, so their incentive to complete is strong, and if you walk away they lose a meaningful but survivable amount. At <strong>50% deposit<\/strong>, the supplier has already collected half the money. If production costs run around 60–70% of the sale price for many manufactured goods, a 50% deposit can approach or exceed the supplier's cash cost on your order. At that point the marginal incentive to finish declines, and the supplier may find it easier to keep the deposit and blame a &quot;quality dispute&quot; than to finish and chase the balance.<\/p>\n<p>A useful mental model: <strong>your deposit should be smaller than the supplier's remaining cost to complete your order.<\/strong> When the deposit exceeds what the supplier has already spent, you have handed them an option to stop.<\/p>\n<p>The commonly quoted 50/50 split is presented as balanced, but it is not neutral. Recovering a 50% deposit is materially harder than recovering a 30% one, both because the amount is larger and because suppliers who demand large upfront deposits are disproportionately likely to be under financial stress.<\/p>\n<p>If a supplier insists on more than 30% and will not accept milestones, restructure rather than refuse outright:<\/p>\n<ul>\n<li>Split the order into tranches, each with its own deposit and delivery.<\/li>\n<li>Tie larger deposits to verifiable milestones such as sample approval, material purchase receipts, or production line photos showing your order ID.<\/li>\n<li>Add a third-party inspection gate before the balance is due.<\/li>\n<\/ul>\n<hr>\n<h2>Red Flags That Your Deposit Is at Risk<\/h2>\n<p>The following patterns are warnings, and several together should stop the payment entirely.<\/p>\n<p>Payment red flags:<\/p>\n<ul>\n<li>Bank account name does not match the company name on the invoice or business license.<\/li>\n<li>Requests to pay into a personal account, a &quot;friend's&quot; account, or an offshore account without explanation.<\/li>\n<li>Sudden change of bank details by email — a classic business email compromise pattern.<\/li>\n<li>Pressure to pay within hours, framed as &quot;price will expire&quot; or &quot;production slot closing.&quot;<\/li>\n<li>Refusal to accept any payment protection mechanism, including escrow, an L/C, or platform buyer protection.<\/li>\n<li>Willingness to accept a suspiciously large deposit without a proforma invoice or contract.<\/li>\n<\/ul>\n<p>Supplier-behavior red flags include no verifiable physical address, or an address that resolves to a residential block; a business license registered recently relative to claims of long experience; reluctance to do a live video walkthrough; communication limited to one person who is always traveling; and prices substantially below the market floor for the category.<\/p>\n<p>Order red flags include custom tooling paid in full before any sample is produced, no written specification beyond a chat message with a photo, and unwillingness to name an inspection standard such as an AQL level or dimensional tolerance.<\/p>\n<hr>\n<h2>Payment Methods, Escrow, and Letters of Credit<\/h2>\n<p>Not all payment rails are equal from the buyer's perspective.<\/p>\n<table><thead><tr><th>Method<\/th><th>Buyer protection<\/th><th>Speed<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Irrevocable Letter of Credit (L/C at sight)<\/td><td>High<\/td><td>Slow<\/td><td>Bank-to-bank; requires bank compliance<\/td><\/tr><tr><td>Escrow via a platform<\/td><td>High<\/td><td>Medium<\/td><td>Dispute window usually limited<\/td><\/tr><tr><td>Platform buyer protection<\/td><td>Medium<\/td><td>Medium<\/td><td>Covers some claims only; see its limits<\/td><\/tr><tr><td>Telegraphic transfer to corporate account<\/td><td>Low<\/td><td>Fast<\/td><td>Standard practice; recoverable only via contract<\/td><\/tr><tr><td>Telegraphic transfer to personal account<\/td><td>Very low<\/td><td>Fast<\/td><td>Avoid for any material amount<\/td><\/tr><tr><td>Cryptocurrency or cash-app style transfer<\/td><td>None<\/td><td>Fast<\/td><td>No recourse<\/td><\/tr><\/tbody><\/table>\n<p>Escrow inserts a neutral party between your money and the supplier's bank account. You fund the escrow, the supplier is notified that funds are secured and begins production, and money releases when agreed conditions are met. The critical limitations: the dispute window closes and then releases funds automatically, so track it like a deadline; &quot;met the spec&quot; is defined by what you actually wrote; escrow protects against non-delivery better than against quality disputes because non-delivery is objective while quality is a judgment; and custom one-off products are poorly served because there is no reference standard.<\/p>\n<p>An irrevocable L/C is a bank undertaking: the issuing bank pays the supplier's bank when compliant documents are presented — bill of lading, invoice, packing list, inspection certificate. The supplier never receives cash until goods are shipped. Practical notes: expect bank fees on both ends plus a possible deposit margin, and for small orders those fees can exceed the protection value; banks pay against documents, not reality, so a typo in a name can cause rejection; allow days to weeks for setup. Use an L/C when the order is large, the supplier is new, and the value at risk justifies the cost.<\/p>\n<hr>\n<h2>Structuring Payments to Reduce Exposure<\/h2>\n<p>A practical structure for a first order with a new supplier:<\/p>\n<ul>\n<li><strong>Sample fee<\/strong> — small, paid normally, treated as a cost of verification.<\/li>\n<li><strong>30% deposit<\/strong> against a signed contract with a named specification and an inspection clause.<\/li>\n<li><strong>40% against pre-shipment inspection pass<\/strong>, using a third-party inspector you nominate.<\/li>\n<li><strong>30% against copy of bill of lading<\/strong>, with originals released on payment.<\/li>\n<li><strong>Hold a retention<\/strong> of 5–10% for 30–60 days on custom goods to cover defects found after arrival.<\/li>\n<\/ul>\n<p>This is more paperwork than most suppliers prefer, and some will refuse the retention. The retention is negotiable; the inspection gate is not. Tie every milestone to a verifiable event — contract signature, inspection pass, document issuance — and never to a date alone. A payment schedule with no conditions is simply a schedule for paying whether or not you get goods.<\/p>\n<hr>\n<h2>If the Deposit Is Already Gone<\/h2>\n<p>If you have paid and the supplier has gone silent, speed matters more than anything else. Act within days, not weeks.<\/p>\n<ul>\n<li>Confirm the silence is real — check for a public holiday, and try an alternate channel.<\/li>\n<li>Send a formal written demand to every address and email on record, creating a documented trail.<\/li>\n<li>Contact your bank immediately to see whether a recall is possible; it usually works only before settlement.<\/li>\n<li>If paid via a platform with escrow, open a dispute before the window closes.<\/li>\n<li>If paid by card, explore chargeback — card networks sometimes cover non-delivery.<\/li>\n<li>Assemble evidence: contract, invoices, chat records, payment receipts, and specification documents.<\/li>\n<li>Escalate to platform trust and safety, and consider a local collection agency or legal channel.<\/li>\n<\/ul>\n<p>Realistic recovery rates vary enormously. Payments made by card or through platform escrow recover far more often than wire transfers to a corporate account, which in turn recover more often than wires to personal accounts. Written contracts with an arbitration clause materially improve your position.<\/p>\n<hr>\n<h2>Quick checklist<\/h2>\n<p>Before you send any deposit:<\/p>\n<ul>\n<li>[ ] Business license name matches the exact name on the invoice <strong>and<\/strong> the bank account beneficiary.<\/li>\n<li>[ ] Bank account is corporate, in the same jurisdiction as the license, with no third-party beneficiary.<\/li>\n<li>[ ] Bank details were confirmed through a second, independent channel, not only the email that sent them.<\/li>\n<li>[ ] Contract is signed, with a named specification, inspection standard, and delivery date.<\/li>\n<li>[ ] Deposit is 30% or less for a first order, or is protected by escrow or an L/C.<\/li>\n<li>[ ] A pre-shipment inspection gate exists before the balance is released.<\/li>\n<li>[ ] You have a retention or warranty clause for custom goods.<\/li>\n<li>[ ] You have a written escalation path: who to contact, at which bank, in which city.<\/li>\n<li>[ ] You can afford to lose the deposit — if not, restructure or protect it.<\/li>\n<\/ul>\n<p>A deposit should buy you progress, not hope.<\/p>\n<p>Beyond the mechanical terms, there is a behavioral pattern worth watching throughout the relationship: how does the supplier respond when you ask for something that reduces your risk? A supplier who becomes defensive, evasive, or urgent when asked to confirm a bank account, provide a business license, or add an inspection gate is telling you something. The best suppliers in China understand that professional buyers manage risk, and they expect to be asked. A supplier who treats every risk-reduction request as a burden is a supplier who is managing their own risk differently from yours.<\/p>\n<p>The most common legitimate pushback you will encounter is that payment terms are &quot;factory policy.&quot; Treat this as a starting position in a negotiation, not a final one. Every term — the deposit percentage, the milestone structure, the inspection right — is negotiable unless the supplier has already decided you are not worth negotiating with. If they want the order, they will negotiate. If they will not negotiate on terms that protect your deposit, that is itself a signal worth acting on.<\/p>\n<p>It also helps to separate the two things a deposit is measuring at the same time: the supplier's need for cash and the buyer's level of commitment. A supplier who demands a large deposit from a brand-new buyer, before any sample or reference has been verified, is pricing in the expectation that most conversations do not convert. You do not have to accept that anchor. Start from the market norm, offer a structure with milestones and an inspection gate, and let the supplier's willingness to negotiate tell you how much they want the order. When the terms are transparent and verifiable on both sides, the negotiation itself becomes a form of due diligence. Structure it so that every stage is verifiable, and the money you send is always smaller than the work the supplier still has to do.<\/p>","cta":"https://lu7897859-tech.github.io/doors/sourcing-audit/","ctaTitle":"Check a supplier for free, right now","ctaText":"Paste the supplier's 18-digit USCC or full registered name for an instant structural check — then go further with the full verification guide.","ctaBtn":"Open the free check"},"type":"article"};</script>
<script>
(function(){
  var D = window.DOOR || {};
  var t = D.type || 'door';
  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var ROOT = D.root || '';   // -> GH Pages root
  var UP = D.up || '';       // -> door dir ('' or '../')
  function isExt(u){ return /^https?:|^mailto:/.test(String(u||'')); }
  function dlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; if(u.charAt(0)==='#') return UP+'index.html'+u; return UP+u.replace(/^\.?\//,''); }
  function rlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; return ROOT+u.replace(/^\.?\//,''); }
  document.getElementById('brand').textContent = D.brand || '';

  // nav
  var nav = document.getElementById('nav');
  (D.nav || []).forEach(function(n){ nav.appendChild(el('<a href="'+dlink(n.href)+'">'+esc(n.label)+'</a>')); });

  var app = document.getElementById('app');

  function renderDoor(){
    var h = D.hero || {};
    var html = '';
    html += '<section class="hero"><div class="wrap">';
    if(h.eyebrow) html += '<span class="eyebrow">'+esc(h.eyebrow)+'</span>';
    html += '<h1>'+esc(h.h1||'')+'</h1>';
    if(h.sub) html += '<p class="sub">'+esc(h.sub)+'</p>';
    // demo box
    html += '<div class="demo"><div class="dt"><span>'+esc(h.demoTitle||'Try it free')+'</span><b>'+esc(h.demoBadge||'Live')+'</b></div>';
    html += '<div class="row"><input id="dq" placeholder="'+esc(h.demoPlaceholder||'')+'" aria-label="'+esc(h.demoLabel||'query')+'">';
    html += '<button id="db">'+esc(h.demoBtn||'Check')+'</button></div>';
    html += '<div class="out" id="dout"></div>';
    if(h.demoNote) html += '<div class="note">'+esc(h.demoNote)+'</div>';
    html += '</div>';
    if((D.trust||[]).length){ html += '<div class="trust">'+D.trust.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'; }
    html += '</div></section>';

    if((D.steps||[]).length){
      html += '<section><div class="wrap"><h2>'+esc(D.stepsTitle||'How it works')+'</h2><p class="sect-sub">'+esc(D.stepsSub||'')+'</p><div class="grid g3">';
      D.steps.forEach(function(s,i){ html += '<div class="card"><div class="step-n">'+(i+1)+'</div><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div>'; });
      html += '</div></div></section>';
    }

    if((D.products||[]).length){
      html += '<section id="products"><div class="wrap"><h2>'+esc(D.productsTitle||'Products')+'</h2><p class="sect-sub">'+esc(D.productsSub||'')+'</p><div class="grid g3">';
      D.products.forEach(function(p){
        html += '<div class="card prod"><div class="p-top"><div><h3>'+esc(p.name)+'</h3></div>'+(p.price?'<span class="price">'+esc(p.price)+'</span>':'')+'</div>';
        if(p.tagline) html += '<p>'+esc(p.tagline)+'</p>';
        if((p.bullets||[]).length) html += '<ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
        if(p.page) html += '<a class="btn ghost" href="'+dlink(p.page)+'">Details</a>';
        if(p.cta) html += '<a class="btn" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a>';
        html += '</div>';
      });
      html += '</div></div></section>';
    }

    if((D.tiers||[]).length){
      html += '<section id="pricing"><div class="wrap"><h2>'+esc(D.tiersTitle||'Pricing')+'</h2><p class="sect-sub">'+esc(D.tiersSub||'')+'</p><div class="grid g3 tiers">';
      D.tiers.forEach(function(t){
        html += '<div class="card tier'+(t.popular?' pop':'')+'">'+(t.popular?'<span class="badge">'+(esc(t.badge||'Popular'))+'</span>':'')+'<h3>'+esc(t.name)+'</h3><div class="amt">'+esc(t.price)+'</div><div class="per">'+esc(t.per||'')+'</div><ul>'+ (t.features||[]).map(function(f){return '<li>'+esc(f)+'</li>';}).join('') +'</ul>';
        html += '<a class="btn'+(t.ghost?' ghost':'')+'" href="'+dlink(t.cta)+'" rel="noopener">'+esc(t.ctaText||'Choose')+'</a></div>';
      });
      html += '</div></div></section>';
    }

    if((D.faq||[]).length){
      html += '<section id="faq"><div class="wrap"><h2>FAQ</h2><p class="sect-sub"></p><div class="faq">';
      D.faq.forEach(function(f){ html += '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>'; });
      html += '</div></div></section>';
    }
    app.innerHTML = html;
    wireDemo();
  }

  function renderProduct(){
    var p = D.product || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('index.html')+'">← '+esc(D.brand)+'</a></p>';
    html += '<h1>'+esc(p.name)+'</h1>';
    if(p.tagline) html += '<p class="sub" style="margin:0 0 10px">'+esc(p.tagline)+'</p>';
    html += '<p>'+(p.price?'<span class="pill">'+esc(p.price)+'</span>':'')+((p.tags||[]).map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join(''))+'</p>';
    if((p.bullets||[]).length) html += '<h3>What you get</h3><ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
    if(p.sample) html += '<h3>Sample output</h3><pre class="out">'+esc(p.sample)+'</pre>';
    if(p.body) html += p.body; // trusted markdown-lite html from config
    if(p.cta) html += '<p style="margin-top:22px"><a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:700" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a></p>';
    if((D.related||[]).length){
      html += '<h3>Related</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function wireDemo(){
    var inp = document.getElementById('dq'), btn = document.getElementById('db'), out = document.getElementById('dout');
    if(!inp||!btn) return;
    function setOut(msg, cls){ out.className = 'out' + (cls?(' '+cls):''); out.textContent = msg; }

    // ---- client-side USCC (Unified Social Credit Code) checker: real, zero-dependency free hook ----
    var CS = '0123456789ABCDEFGHJKLMNPQRTUWXY';
    var W = [1,3,9,27,19,26,16,17,20,29,25,13,8,24,10,30,28];
    var REG = {'1':'Market regulation','5':'Civil affairs','9':'Other','Y':'Other','1A':'Regulator A'};
    function decodeUSCC(code){
      var s = String(code||'').toUpperCase().replace(/\s+/g,'');
      if(s.length!==18) return {ok:false, reason:'Length is '+s.length+', a USCC is exactly 18 characters.'};
      for(var i=0;i<18;i++){ if(CS.indexOf(s.charAt(i))<0) return {ok:false, reason:'Invalid character "'+s.charAt(i)+'" (letters I, O, S, V, Z are not used).'}; }
      var sum=0; for(var j=0;j<17;j++) sum += CS.indexOf(s.charAt(j))*W[j];
      var expect = CS.charAt((31 - (sum % 31)) % 31);
      var ok = (expect === s.charAt(17));
      return {ok:ok, expect:expect, given:s.charAt(17),
        region:s.slice(2,8), org: s.charAt(8), kind: s.charAt(9), serial:s.slice(10,17)};
    }
    function explain(x){
      if(x.ok){
        return '✅ Structurally valid USCC\n\n'+
          'Region / admin code : '+x.region+'\n'+
          'Entity-type code   : '+x.kind+'\n'+
          'Org code           : '+x.org+'\n'+
          'Serial             : '+x.serial+'\n'+
          'Check digit        : '+x.given+' (valid)\n\n'+
          'Format checks out. What a valid code does NOT tell you: whether the company is still active, who really owns it, or whether it has litigation, sanctions or adverse media. That is what the full report covers.';
      }
      return '❌ Not a structurally valid USCC\n\n'+x.reason+'\n\nTip: paste the 18-character Unified Social Credit Code from the supplier\u2019s business licence, or try the company\u2019s full registered name.';
    }

    async function run(){
      var q = (inp.value||'').trim();
      if(!q){ setOut(D.demoEmpty||'Please enter a company name or 18-digit registration number.','err'); return; }
      btn.disabled = true; var old = btn.textContent; btn.textContent = D.demoBusy||'Checking…';
      try{
        if(D.demoMode === 'uscc'){
          setOut(D.demoBusy||'Checking…','');
          var x = decodeUSCC(q);
          setOut(explain(x), x.ok?'ok':'err');
          beacon(q, x.ok?'valid':'invalid');
        } else if(D.demoMode === 'endpoint' && D.demoEndpoint){
          setOut(D.demoBusy||'Contacting verification service…','');
          var r = await fetch(D.demoEndpoint, { method:'POST', headers:{'content-type':'application/json','accept':'application/json'}, body: JSON.stringify({ keyword: q, tool:'verify_supplier' }) });
          var txt = await r.text(); var j=null; try{ j=JSON.parse(txt); }catch(e){}
          if(r.status===200 && j){ setOut(JSON.stringify(j,null,2).substring(0,1400),'ok'); }
          else if(r.status===402){ setOut((D.paywallNote||'Free instant checks used. Get the full verified report to continue.'),'err'); }
          else { setOut('Service returned status '+r.status+'. '+(D.demoFallback||''),'err'); }
        } else {
          var x2 = decodeUSCC(q);
          setOut(explain(x2), x2.ok?'ok':'err');
        }
      }catch(e){
        setOut((D.demoOffline||'The live demo is momentarily unavailable. The full verification report still works.')+'\n\n'+(D.demoEndpoint||''),'err');
      }
      btn.disabled=false; btn.textContent=old;
    }
    // anonymous use-signal: lets us see the first real visitor arrive (never sent to the supplier)
    function beacon(q, result){
      if(!D.demoEndpoint) return;
      try{
        fetch(D.demoEndpoint, { method:'POST', keepalive:true, headers:{'content-type':'application/json'}, body: JSON.stringify({ keyword:q, tool:'verify_supplier', source:'door-free-hook', result:result }) }).catch(function(){});
      }catch(e){}
    }
    btn.addEventListener('click',run);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  }

  function renderArticle(){
    var a = D.article || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('blog/index.html')+'">← All guides</a></p>';
    html += '<h1>'+esc(a.title)+'</h1>';
    if(a.desc) html += '<p class="sub" style="margin:0 0 18px">'+esc(a.desc)+'</p>';
    if((a.tags||[]).length) html += '<p>'+a.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
    html += '<div data-article>'+(a.html||'')+'</div>';
    if(a.cta){
      html += '<div class="card" style="margin-top:30px;border-color:var(--accent)"><h3>'+esc(a.ctaTitle||'Check a supplier now')+'</h3><p style="margin-bottom:14px">'+esc(a.ctaText||'')+'</p>';
      html += '<a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700" href="'+dlink(a.cta)+'" rel="noopener">'+esc(a.ctaBtn||'Open the free check')+'</a></div>';
    }
    if((D.related||[]).length){
      html += '<h3>Related guides</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function renderBlogIndex(){
    var posts = D.posts || [];
    var html = '<section class="hero"><div class="wrap"><span class="eyebrow">'+esc(D.blogEyebrow||'Guides')+'</span><h1>'+esc(D.blogTitle||'China sourcing guides')+'</h1>';
    if(D.blogSub) html += '<p class="sub">'+esc(D.blogSub)+'</p>';
    html += '</div></section><section><div class="wrap"><div class="grid g2">';
    posts.forEach(function(p){
      html += '<div class="card"><h3><a href="'+dlink(p.href)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.desc||'')+'</p>';
      if(p.tags&&p.tags.length) html += '<p style="margin-top:10px">'+p.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
      html += '</div>';
    });
    html += '</div></div></section>';
    app.innerHTML = html;
  }

  if(t==='product') renderProduct(); else if(t==='article') renderArticle(); else if(t==='blog') renderBlogIndex(); else renderDoor();

  // footer
  var foot = document.getElementById('foot');
  (D.footer||[]).forEach(function(col){
    foot.appendChild(el('<div><h4>'+esc(col.t)+'</h4>'+ (col.links||[]).map(function(l){ return '<a href="'+rlink(l.href)+'"'+(isExt(l.href)?' rel="noopener"':'')+'>'+esc(l.label)+'</a>'; }).join('') +'</div>'));
  });
  document.getElementById('legalLeft').textContent = D.legalLeft || ('© ' + new Date().getFullYear() + ' ' + (D.brand||''));
  document.getElementById('legalRight').textContent = D.legalRight || '';
})();
</script>
