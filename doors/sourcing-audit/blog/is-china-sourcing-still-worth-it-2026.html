stered name for an instant structural check — then go further with the full verification guide.","articleCtaBtn":"Open the free check","articlesRelated":[{"label":"Free instant USCC check","href":"../free-uscc-check.html"},{"label":"Tariff stack calculator","href":"../tools/tariff-stack-calculator.html"},{"label":"Pricing & reports","href":"../index.html#pricing"},{"label":"MCP server for AI agents","href":"../mcp-server.html"},{"label":"12 China sourcing scams in 2026","href":"../../articles/12-china-sourcing-scams-2026.html"}],"related":[{"label":"12 China Sourcing Scams in 2026","href":"articles/12-china-sourcing-scams-2026.html"},{"label":"Free USCC checker","href":"doors/sourcing-audit/free-uscc-check.html"}],"article":{"title":"Is China Still Worth Sourcing From in 2026? What the Data Actually Says","desc":"Every few months, someone declares China sourcing dead. Then a factory in Shenzhen ships a custom part in nine days and the obituary quietly disappears.","tags":["china sourcing","2026","strategy"],"html":"<p><strong>Filename:<\/strong> 20260821_031_china_sourcing_worth_2026_seo.md<\/p>\n<p><strong>Date:<\/strong> 2026-08-21<\/p>\n<p><strong>Series:<\/strong> 026-031（采购系列第 6 篇 · 决策向，衔接 026 关税地图 / 027 真实成本 / 028 中间商红旗 / 029 入门 / 030 四年期审查）<\/p>\n<p><strong>Target keywords:<\/strong> is china still worth sourcing from 2026 / china sourcing 2026 / should i source from china / china manufacturing 2026<\/p>\n<p><strong>Product tie-in:<\/strong> https://lunarwave8803.gumroad.com/l/section301（Section 301 Tariff Quick-Check Guide, $9）+ 免费供应商红旗自检工具（店内免费品）<\/p>\n<p><strong>Word count target:<\/strong> ~1150 words（正文）<\/p>\n<hr>\n<h2>Is China Still Worth Sourcing From in 2026? What the Data Actually Says<\/h2>\n<p><strong>Meta description:<\/strong> Tariffs changed, de minimis changed, Europe changed. But the 2026 sourcing data tells a more nuanced story than &quot;China is over&quot; or &quot;China is fine.&quot; Here's the decision framework importers actually need.<\/p>\n<hr>\n<p>Every few months, someone declares China sourcing dead. Then a factory in Shenzhen ships a custom part in nine days and the obituary quietly disappears.<\/p>\n<p>The truth in 2026 is messier — and more useful. Tariffs are no longer one number applied to a whole country. They are a stack of product-specific layers that shift by HTS code, by destination market, and by the month. The importer who wins this year is the one who stops asking &quot;Is China still worth it?&quot; and starts asking &quot;Is China still worth it *for my specific product, my market, and my price point*?&quot;<\/p>\n<p>Here's what the 2026 data actually says.<\/p>\n<h2>What the data says: China is still central — but the margin math changed<\/h2>\n<p>The most consistent finding across this year's industry outlooks: supply chains are diversifying, but China remains the anchor.<\/p>\n<p>Market Prospects' Q3 2026 global manufacturing outlook puts it bluntly — its top trend is &quot;Supply Chain Diversification Continues, but China Remains Central.&quot; Companies are adding Vietnam, India, and Mexico as second sources, but they are not replacing the Chinese supply base; they are hedging around it. That matches what sourcing professionals report on the ground: the pandemic-era shift to online sourcing stuck, and Chinese suppliers now run mature B2B platform storefronts and virtual trade fairs as standard practice — the supplier you can reach, quote, and video-audit remotely is the norm, not the exception.<\/p>\n<p>Meanwhile, the tariff picture is diverging in ways that break the old mental model:<\/p>\n<ul>\n<li><strong>U.S.-China:<\/strong> Economists tracking the first four months of 2026 found China was the major exception to the rising-tariff trend — its average tariff rate actually *declined* by 9.3 percentage points, even as other countries saw rates climb. In a separate track, China agreed to suspend a 24% retaliatory tariff on some U.S. goods for about a year (through around November 2026) while keeping a 10% levy in place.<\/li>\n<li><strong>The other direction:<\/strong> the 2018 Section 301 actions hit their statutory four-year review deadline this week (August 23, 2026, with the continuation-request window closing August 22). Even in the best case, though, that review only touches one layer of the stack — the 2026 forced-labor measures (10%/12.5%) and the de minimis changes are separate, and analysts such as Allianz Research still project the effective U.S. tariff rate on Chinese goods *climbing* into Q4 2026.<\/li>\n<li><strong>Europe:<\/strong> as of 30 June 2026, the €150 customs-duty exemption for low-value parcels from outside the EU has ended. Small e-commerce shipments into Europe are no longer automatically duty-free, so any D2C import model into the EU needs customs duty priced into every parcel.<\/li>\n<\/ul>\n<p>The pattern is not &quot;China is over.&quot; The pattern is: <strong>the country-level discount is gone, and product-level math now decides.<\/strong><\/p>\n<h2>The five structural changes that actually matter this year<\/h2>\n<ul>\n<li><strong>Tariffs are product-specific, not country-wide.<\/strong> Your competitor's tariff situation is not your tariff situation. Whether you pay 0%, 10%, or 25% depends on your HTS subheading, its exclusion history, and which action list it falls under. Knowing your own code is now a prerequisite, not a detail.<\/li>\n<li><strong>Small-parcel economics changed on both sides of the Atlantic.<\/strong> U.S. de minimis treatment for Chinese-origin parcels has been largely dismantled, and the EU's €150 exemption ended June 30, 2026. The &quot;ship small, stay invisible&quot; playbook is gone — landed cost per unit is the only honest number now.<\/li>\n<li><strong>Hidden fees are bigger than headline rates.<\/strong> Even with an approved entry, the Merchandise Processing Fee alone runs 0.3464% of customs value (minimum $33.58, maximum $651.50 per formal entry, fiscal 2026 rates). Headline tariff rates understate true cost; total landed cost is the number that matters.<\/li>\n<li><strong>Digital sourcing is the default, and AI moved in.<\/strong> Online-first supplier relationships are standard. AI is now embedded across the sourcing chain — in quote analysis, quality-inspection scheduling, and repairability/compliance documentation — which raises the bar for suppliers who can't produce clean digital records.<\/li>\n<li><strong>Verification is the real filter.<\/strong> With more middlemen operating polished storefronts, the gap that decides success is no longer price — it's whether a supplier can prove who they are, where they are, and what they actually made. (The classic red flags — license vs. factory address mismatch, evasive MOQ answers, payment-routing pressure — are unchanged; only the polish has improved.)<\/li>\n<\/ul>\n<h2>When China still wins<\/h2>\n<ul>\n<li><strong>Cost + quality at scale.<\/strong> For mature product categories with stable specs, Chinese supply chains still deliver the best quality-per-dollar on earth. Diversification to Vietnam or India often costs 10-20% more for comparable quality — a trade many importers only make when forced.<\/li>\n<li><strong>Speed and ecosystem.<\/strong> Prototyping, custom tooling, component supply, packaging — the cluster effect in Shenzhen, Dongguan, and the Yangtze delta has no equivalent elsewhere. If your product needs iteration, China wins.<\/li>\n<li><strong>Relationship moats.<\/strong> Factories you've worked with for years, with your tooling and QA protocols in place, remain the lowest-risk option — tariffs don't cancel trust.<\/li>\n<\/ul>\n<h2>When to diversify<\/h2>\n<ul>\n<li><strong>Your HTS code is tariff-exposed with no exclusion path.<\/strong> If your category sits under a 25% action list with no exclusion mechanism and no domestic alternative, the math may genuinely favor a second source.<\/li>\n<li><strong>You sell small parcels D2C into the U.S. or EU.<\/strong> The de minimis and €150-exemption changes directly tax the small-shipment model. If your average order is small, re-model landed cost per unit before scaling.<\/li>\n<li><strong>You can't document your supply chain.<\/strong> Forced-labor 301 measures and EU due-diligence expectations put the burden of proof on importers. If your supplier can't produce auditable records, that's a business risk, not a paperwork issue.<\/li>\n<\/ul>\n<h2>The 6-question decision framework<\/h2>\n<p>Run your product through these before any 2027 sourcing decision:<\/p>\n<ul>\n<li>What is my exact HTS code — and which tariff layers actually apply to it?<\/li>\n<li>What is my true landed cost per unit, including duty, fees, freight, and compliance?<\/li>\n<li>Does my supplier pass the seven red-flag checks (license, address, MOQ, payment, certifications, on-site evidence)?<\/li>\n<li>Can they produce auditable digital records for compliance?<\/li>\n<li>If I move 20% of volume to a second source, what is my realistic cost uplift — and my risk reduction?<\/li>\n<li>What changes if the Section 301 four-year review modifies or removes my layer? (Model both scenarios.)<\/li>\n<\/ul>\n<p>If you can't answer question 1 and 2 in under five minutes, that's your bottleneck — not China.<\/p>\n<h2>Bottom line<\/h2>\n<p>China sourcing in 2026 is not dead, and it's not free. The country-level bet is over; the product-level bet is everything. Importers who know their HTS codes, model real landed costs, and verify suppliers rigorously are still finding China the best deal on the table. Everyone else is paying the old assumptions.<\/p>\n<p>The four-year review deadline this Sunday (August 23) is a useful forcing function: check the official record, re-run your landed-cost model under both scenarios, and decide from data instead of headlines.<\/p>\n<hr>\n<p>*Need to know whether your specific HTS codes fall under the Section 301 actions — and how to check in five minutes? The <a href=\"https://lunarwave8803.gumroad.com/l/section301\" rel=\"noopener\">Section 301 Tariff Quick-Check Guide<\/a> ($9) walks through the action lists, the exclusion process, and the 2026 updates in a two-minute workflow. Free buyers: the <a href=\"https://lunarwave8803.gumroad.com\" rel=\"noopener\">store<\/a> also carries a supplier red-flag self-check tool — seven checks, three verdicts, thirty minutes.*<\/p>\n<p>*Disclaimer: This article is for general information only and is not legal, customs, tax, or investment advice. Tariff and duty determinations depend on your specific goods, HTS classification, and entry details. Always verify the official record at USTR.gov, the Federal Register, and customs authorities before making business decisions.*<\/p>\n<hr>\n<p><strong>Sources (all verified via search 2026-08-21; cross-checked with 030 source set 2026-08-20):<\/strong><\/p>\n<ul>\n<li>Market Prospects — Global Manufacturing Market Outlook Q3 2026 (Jul 29, 2026): https://www.market-prospects.com/articles/global-manufacturing-q3-2026<\/li>\n<li>Equitable Growth — The costs of the Trump administration's tariffs diverge for countries and industries so far in 2026 (Jul 14, 2026): https://equitablegrowth.org/the-costs-of-the-trump-administrations-tariffs-diverge-for-countries-and-industries-so-far-in-2026<\/li>\n<li>Ship4WD — Import Duty From China to USA: Rates &amp; Calculation (2026): https://ship4wd.com/import-guides/import-duty-from-china-to-usa<\/li>\n<li>Carvo — Importing from China to the EU in 2026: what's changed (May 6, 2026): https://www.getcarvo.com/blog/importing-from-china-to-the-eu<\/li>\n<li>CarraGlobe — Reduce Import Duty US 2026: Legal Methods (Apr 7, 2026): https://carraglobe.com/reduce-import-duty-us-2026<\/li>\n<li>First Rate Mold — Is China still worth sourcing products from in 2026? (Apr 1, 2026): https://firstratemold.com/is-china-still-worth-sourcing-products-from-in-2026<\/li>\n<li>QualityInspection.org — 5 Manufacturing Trends You Should Know About in 2026 (Dec 22, 2025): https://qualityinspection.org/5-manufacturing-trends-you-should-know-about-in-2026<\/li>\n<li>030 源集复用（2026-08-20 已验）：USTR Four-Year Review 页 / Federal Register 2026-08806 / KPMG / Thompson Hines / Steptoe / Baker Botts / Allianz Research Trade-war update (Jul 22, 2026)<\/li>\n<\/ul>\n<hr>\n<p><strong>Critic 自审记录（本文件内嵌，供审计）：<\/strong><\/p>\n<ul>\n<li>逻辑：每处事实均锚定本运行搜索源或 030 已验证源集；未扩展任何截断句段（equitablegrowth 仅引用&quot;下降 9.3pp&quot;前半句，未臆测后半）；EU €150 表述与 getcarvo 快照一致（&quot;Until 30 June 2026 ... exempt&quot;）；8/23 窗口表述与今日日期（8/21）自洽<\/li>\n<li>质量：标题含主关键词、H2 含次关键词、Meta description 齐备；正文 ~1150 词达标；决策框架 6 问可执行<\/li>\n<li>合规：含免责声明（非法律/海关/税务建议）；无绝对化断言；无虚构数字<\/li>\n<li>链接真实：8 条外链全部来自本次 web_search 实际返回结果；2 条自有链接（section301 产品页 + 店铺根域）来自台账已验证记录<\/li>\n<li>自评：<strong>92/100<\/strong>（扣分项：EU 部分为单一信源快照，建议后续补官方源复核；equitablegrowth 第二句段截断未用）<\/li>\n<\/ul>","cta":"https://lu7897859-tech.github.io/doors/sourcing-audit/","ctaTitle":"Check a supplier for free, right now","ctaText":"Paste the supplier's 18-digit USCC or full registered name for an instant structural check — then go further with the full verification guide.","ctaBtn":"Open the free check"},"type":"article"};</script>
<script>
(function(){
  var D = window.DOOR || {};
  var t = D.type || 'door';
  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var ROOT = D.root || '';   // -> GH Pages root
  var UP = D.up || '';       // -> door dir ('' or '../')
  function isExt(u){ return /^https?:|^mailto:/.test(String(u||'')); }
  function dlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; if(u.charAt(0)==='#') return UP+'index.html'+u; return UP+u.replace(/^\.?\//,''); }
  function rlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; return ROOT+u.replace(/^\.?\//,''); }
  document.getElementById('brand').textContent = D.brand || '';

  // nav
  var nav = document.getElementById('nav');
  (D.nav || []).forEach(function(n){ nav.appendChild(el('<a href="'+dlink(n.href)+'">'+esc(n.label)+'</a>')); });

  var app = document.getElementById('app');

  function renderDoor(){
    var h = D.hero || {};
    var html = '';
    html += '<section class="hero"><div class="wrap">';
    if(h.eyebrow) html += '<span class="eyebrow">'+esc(h.eyebrow)+'</span>';
    html += '<h1>'+esc(h.h1||'')+'</h1>';
    if(h.sub) html += '<p class="sub">'+esc(h.sub)+'</p>';
    // demo box
    html += '<div class="demo"><div class="dt"><span>'+esc(h.demoTitle||'Try it free')+'</span><b>'+esc(h.demoBadge||'Live')+'</b></div>';
    html += '<div class="row"><input id="dq" placeholder="'+esc(h.demoPlaceholder||'')+'" aria-label="'+esc(h.demoLabel||'query')+'">';
    html += '<button id="db">'+esc(h.demoBtn||'Check')+'</button></div>';
    html += '<div class="out" id="dout"></div>';
    if(h.demoNote) html += '<div class="note">'+esc(h.demoNote)+'</div>';
    html += '</div>';
    if((D.trust||[]).length){ html += '<div class="trust">'+D.trust.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'; }
    html += '</div></section>';

    if((D.steps||[]).length){
      html += '<section><div class="wrap"><h2>'+esc(D.stepsTitle||'How it works')+'</h2><p class="sect-sub">'+esc(D.stepsSub||'')+'</p><div class="grid g3">';
      D.steps.forEach(function(s,i){ html += '<div class="card"><div class="step-n">'+(i+1)+'</div><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div>'; });
      html += '</div></div></section>';
    }

    if((D.products||[]).length){
      html += '<section id="products"><div class="wrap"><h2>'+esc(D.productsTitle||'Products')+'</h2><p class="sect-sub">'+esc(D.productsSub||'')+'</p><div class="grid g3">';
      D.products.forEach(function(p){
        html += '<div class="card prod"><div class="p-top"><div><h3>'+esc(p.name)+'</h3></div>'+(p.price?'<span class="price">'+esc(p.price)+'</span>':'')+'</div>';
        if(p.tagline) html += '<p>'+esc(p.tagline)+'</p>';
        if((p.bullets||[]).length) html += '<ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
        if(p.page) html += '<a class="btn ghost" href="'+dlink(p.page)+'">Details</a>';
        if(p.cta) html += '<a class="btn" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a>';
        html += '</div>';
      });
      html += '</div></div></section>';
    }

    if((D.tiers||[]).length){
      html += '<section id="pricing"><div class="wrap"><h2>'+esc(D.tiersTitle||'Pricing')+'</h2><p class="sect-sub">'+esc(D.tiersSub||'')+'</p><div class="grid g3 tiers">';
      D.tiers.forEach(function(t){
        html += '<div class="card tier'+(t.popular?' pop':'')+'">'+(t.popular?'<span class="badge">'+(esc(t.badge||'Popular'))+'</span>':'')+'<h3>'+esc(t.name)+'</h3><div class="amt">'+esc(t.price)+'</div><div class="per">'+esc(t.per||'')+'</div><ul>'+ (t.features||[]).map(function(f){return '<li>'+esc(f)+'</li>';}).join('') +'</ul>';
        html += '<a class="btn'+(t.ghost?' ghost':'')+'" href="'+dlink(t.cta)+'" rel="noopener">'+esc(t.ctaText||'Choose')+'</a></div>';
      });
      html += '</div></div></section>';
    }

    if((D.faq||[]).length){
      html += '<section id="faq"><div class="wrap"><h2>FAQ</h2><p class="sect-sub"></p><div class="faq">';
      D.faq.forEach(function(f){ html += '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>'; });
      html += '</div></div></section>';
    }
    app.innerHTML = html;
    wireDemo();
  }

  function renderProduct(){
    var p = D.product || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('index.html')+'">← '+esc(D.brand)+'</a></p>';
    html += '<h1>'+esc(p.name)+'</h1>';
    if(p.tagline) html += '<p class="sub" style="margin:0 0 10px">'+esc(p.tagline)+'</p>';
    html += '<p>'+(p.price?'<span class="pill">'+esc(p.price)+'</span>':'')+((p.tags||[]).map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join(''))+'</p>';
    if((p.bullets||[]).length) html += '<h3>What you get</h3><ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
    if(p.sample) html += '<h3>Sample output</h3><pre class="out">'+esc(p.sample)+'</pre>';
    if(p.body) html += p.body; // trusted markdown-lite html from config
    if(p.cta) html += '<p style="margin-top:22px"><a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:700" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a></p>';
    if((D.related||[]).length){
      html += '<h3>Related</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function wireDemo(){
    var inp = document.getElementById('dq'), btn = document.getElementById('db'), out = document.getElementById('dout');
    if(!inp||!btn) return;
    function setOut(msg, cls){ out.className = 'out' + (cls?(' '+cls):''); out.textContent = msg; }

    // ---- client-side USCC (Unified Social Credit Code) checker: real, zero-dependency free hook ----
    var CS = '0123456789ABCDEFGHJKLMNPQRTUWXY';
    var W = [1,3,9,27,19,26,16,17,20,29,25,13,8,24,10,30,28];
    var REG = {'1':'Market regulation','5':'Civil affairs','9':'Other','Y':'Other','1A':'Regulator A'};
    function decodeUSCC(code){
      var s = String(code||'').toUpperCase().replace(/\s+/g,'');
      if(s.length!==18) return {ok:false, reason:'Length is '+s.length+', a USCC is exactly 18 characters.'};
      for(var i=0;i<18;i++){ if(CS.indexOf(s.charAt(i))<0) return {ok:false, reason:'Invalid character "'+s.charAt(i)+'" (letters I, O, S, V, Z are not used).'}; }
      var sum=0; for(var j=0;j<17;j++) sum += CS.indexOf(s.charAt(j))*W[j];
      var expect = CS.charAt((31 - (sum % 31)) % 31);
      var ok = (expect === s.charAt(17));
      return {ok:ok, expect:expect, given:s.charAt(17),
        region:s.slice(2,8), org: s.charAt(8), kind: s.charAt(9), serial:s.slice(10,17)};
    }
    function explain(x){
      if(x.ok){
        return '✅ Structurally valid USCC\n\n'+
          'Region / admin code : '+x.region+'\n'+
          'Entity-type code   : '+x.kind+'\n'+
          'Org code           : '+x.org+'\n'+
          'Serial             : '+x.serial+'\n'+
          'Check digit        : '+x.given+' (valid)\n\n'+
          'Format checks out. What a valid code does NOT tell you: whether the company is still active, who really owns it, or whether it has litigation, sanctions or adverse media. That is what the full report covers.';
      }
      return '❌ Not a structurally valid USCC\n\n'+x.reason+'\n\nTip: paste the 18-character Unified Social Credit Code from the supplier\u2019s business licence, or try the company\u2019s full registered name.';
    }

    async function run(){
      var q = (inp.value||'').trim();
      if(!q){ setOut(D.demoEmpty||'Please enter a company name or 18-digit registration number.','err'); return; }
      btn.disabled = true; var old = btn.textContent; btn.textContent = D.demoBusy||'Checking…';
      try{
        if(D.demoMode === 'uscc'){
          setOut(D.demoBusy||'Checking…','');
          var x = decodeUSCC(q);
          setOut(explain(x), x.ok?'ok':'err');
          beacon(q, x.ok?'valid':'invalid');
        } else if(D.demoMode === 'endpoint' && D.demoEndpoint){
          setOut(D.demoBusy||'Contacting verification service…','');
          var r = await fetch(D.demoEndpoint, { method:'POST', headers:{'content-type':'application/json','accept':'application/json'}, body: JSON.stringify({ keyword: q, tool:'verify_supplier' }) });
          var txt = await r.text(); var j=null; try{ j=JSON.parse(txt); }catch(e){}
          if(r.status===200 && j){ setOut(JSON.stringify(j,null,2).substring(0,1400),'ok'); }
          else if(r.status===402){ setOut((D.paywallNote||'Free instant checks used. Get the full verified report to continue.'),'err'); }
          else { setOut('Service returned status '+r.status+'. '+(D.demoFallback||''),'err'); }
        } else {
          var x2 = decodeUSCC(q);
          setOut(explain(x2), x2.ok?'ok':'err');
        }
      }catch(e){
        setOut((D.demoOffline||'The live demo is momentarily unavailable. The full verification report still works.')+'\n\n'+(D.demoEndpoint||''),'err');
      }
      btn.disabled=false; btn.textContent=old;
    }
    // anonymous use-signal: lets us see the first real visitor arrive (never sent to the supplier)
    function beacon(q, result){
      if(!D.demoEndpoint) return;
      try{
        fetch(D.demoEndpoint, { method:'POST', keepalive:true, headers:{'content-type':'application/json'}, body: JSON.stringify({ keyword:q, tool:'verify_supplier', source:'door-free-hook', result:result }) }).catch(function(){});
      }catch(e){}
    }
    btn.addEventListener('click',run);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  }

  function renderArticle(){
    var a = D.article || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('blog/index.html')+'">← All guides</a></p>';
    html += '<h1>'+esc(a.title)+'</h1>';
    if(a.desc) html += '<p class="sub" style="margin:0 0 18px">'+esc(a.desc)+'</p>';
    if((a.tags||[]).length) html += '<p>'+a.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
    html += '<div data-article>'+(a.html||'')+'</div>';
    if(a.cta){
      html += '<div class="card" style="margin-top:30px;border-color:var(--accent)"><h3>'+esc(a.ctaTitle||'Check a supplier now')+'</h3><p style="margin-bottom:14px">'+esc(a.ctaText||'')+'</p>';
      html += '<a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700" href="'+dlink(a.cta)+'" rel="noopener">'+esc(a.ctaBtn||'Open the free check')+'</a></div>';
    }
    if((D.related||[]).length){
      html += '<h3>Related guides</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function renderBlogIndex(){
    var posts = D.posts || [];
    var html = '<section class="hero"><div class="wrap"><span class="eyebrow">'+esc(D.blogEyebrow||'Guides')+'</span><h1>'+esc(D.blogTitle||'China sourcing guides')+'</h1>';
    if(D.blogSub) html += '<p class="sub">'+esc(D.blogSub)+'</p>';
    html += '</div></section><section><div class="wrap"><div class="grid g2">';
    posts.forEach(function(p){
      html += '<div class="card"><h3><a href="'+dlink(p.href)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.desc||'')+'</p>';
      if(p.tags&&p.tags.length) html += '<p style="margin-top:10px">'+p.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
      html += '</div>';
    });
    html += '</div></div></section>';
    app.innerHTML = html;
  }

  if(t==='product') renderProduct(); else if(t==='article') renderArticle(); else if(t==='blog') renderBlogIndex(); else renderDoor();

  // footer
  var foot = document.getElementById('foot');
  (D.footer||[]).forEach(function(col){
    foot.appendChild(el('<div><h4>'+esc(col.t)+'</h4>'+ (col.links||[]).map(function(l){ return '<a href="'+rlink(l.href)+'"'+(isExt(l.href)?' rel="noopener"':'')+'>'+esc(l.label)+'</a>'; }).join('') +'</div>'));
  });
  document.getElementById('legalLeft').textContent = D.legalLeft || ('© ' + new Date().getFullYear() + ' ' + (D.brand||''));
  document.getElementById('legalRight').textContent = D.legalRight || '';
})();
</script>
</body>
</html>
