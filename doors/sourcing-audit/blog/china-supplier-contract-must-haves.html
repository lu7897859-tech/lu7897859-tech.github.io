stered name for an instant structural check — then go further with the full verification guide.","articleCtaBtn":"Open the free check","articlesRelated":[{"label":"Free instant USCC check","href":"../free-uscc-check.html"},{"label":"Tariff stack calculator","href":"../tools/tariff-stack-calculator.html"},{"label":"Pricing & reports","href":"../index.html#pricing"},{"label":"MCP server for AI agents","href":"../mcp-server.html"},{"label":"12 China sourcing scams in 2026","href":"../../articles/12-china-sourcing-scams-2026.html"}],"related":[{"label":"12 China Sourcing Scams in 2026","href":"articles/12-china-sourcing-scams-2026.html"},{"label":"Free USCC checker","href":"doors/sourcing-audit/free-uscc-check.html"}],"article":{"title":"China Supply Contract Must-Have Clauses for International Buyers","desc":"Essential clauses in a China purchase contract: governing law, arbitration venue (CIETAC, HKIAC), quality, damages, and force majeure traps.","tags":["china contract","arbitration","cietac","international trade law"],"html":"<p>A purchase contract with a Chinese supplier is not a formality. It is the document that determines whether you have a remedy when something goes wrong — and the clauses that matter most are exactly the ones suppliers prefer to leave vague. The difference between a contract that is enforceable and one that is decorative usually comes down to about eight clauses.<\/p>\n<p>This guide covers what each essential clause should say, the realistic options for governing law and dispute resolution, how to write quality terms that actually work, and the specific traps around force majeure and bilingual versions.<\/p>\n<hr>\n<h2>Clause 1: Parties, Signatory Authority, and Governing Law<\/h2>\n<p>Name the correct legal entity with its full registered Chinese name and its Unified Social Credit Code. This is the entity your contract can enforce against, so getting it wrong means you have a contract with no one.<\/p>\n<p>Ensure the signatory has authority. The legal representative may sign directly, while anyone else should provide a power of attorney (授权委托书) or a company chop. Chinese contracts are commonly sealed with the company chop (公章), and a chop-sealed contract is standard and enforceable. Most importantly, match the signing entity to the invoicing entity and the bank beneficiary — a chain that is aligned across contract, invoice, and account is far easier to enforce than one that is not.<\/p>\n<p>If the person you have been negotiating with is a salesperson with no chop and no authorization, you have a relationship, not a contract. Ask for the chop or a signed authorization before paying anything.<\/p>\n<hr>\n<p>Which law governs the contract is the next foundational choice, and it deserves the same care as the identity of the parties. Under Chinese law, a foreign-related contract may be governed by the law the parties choose. If no law is chosen, the contract is likely governed by the law of the party whose performance best characterizes it — often the seller, meaning Chinese law and Chinese courts. Two consequences follow: choosing the law matters, because silence usually means Chinese law applies by default; and enforcement matters more than the choice, because a judgment from a foreign court is often hard to enforce in China while an arbitral award is far easier under the New York Convention, which China and most trading nations have joined.<\/p>\n<table><thead><tr><th>Choice<\/th><th>Enforcement<\/th><th>Notes<\/th><\/tr><\/thead><tbody><tr><td>Chinese law<\/td><td>Standard; matches the supplier<\/td><td>Familiar to Chinese courts and arbitrators<\/td><\/tr><tr><td>Buyer's home law<\/td><td>Common for buyers<\/td><td>Workable in arbitration; not in Chinese courts<\/td><\/tr><tr><td>Neutral third-country law (e.g. English or Singapore law)<\/td><td>Common in trade<\/td><td>Needs a matching arbitration seat<\/td><\/tr><tr><td>No choice<\/td><td>Defaults toward Chinese law<\/td><td>Avoid — you lose control<\/td><\/tr><\/tbody><\/table>\n<p>A practical and common choice is a neutral arbitration seat with the seat's law, or Chinese law with international arbitration. Be careful of a contract that chooses English law but provides for a Chinese court: that combination is internally inconsistent and likely non-functional. The law and the forum should agree, and if they do not, the clause may fail when you need it most.<\/p>\n<p>It is worth understanding why buyers care so much about this clause when most contracts never reach a dispute. The value of a contract is not in the happy path but in the rare failure, and the cost of a failure is asymmetric: a supplier who breaches keeps your money, while a buyer who sues must pay to chase it across borders. Governing law and forum determine which of those two positions you occupy. A contract governed by Chinese law and litigated in a Chinese court is cheap and familiar for the supplier and near-impossible for a distant buyer to use. A contract with a neutral seat and a clear arbitration clause is a genuine, if slow, remedy.<\/p>\n<p>A second reason is settlement behavior. Suppliers and their advisors know which clauses are enforceable, and negotiations shift when the counterparty believes you can actually pursue a claim. An arbitration clause that names an institution and a seat changes the tone of a dispute before any filing occurs, because it converts an idle threat into a credible one. When you draft this clause, therefore, do not ask only whether it is fair. Ask whether it is usable: can you afford the filing fee, can you find counsel, and can you enforce the result where the supplier banks and holds assets. If the answer to any of those is no, the clause is decoration.<\/p>\n<hr>\n<h2>Clause 3: Dispute Resolution and Arbitration Seat<\/h2>\n<p>This is the most consequential clause in the contract. If you get one thing right, get this one right.<\/p>\n<table><thead><tr><th>Venue<\/th><th>Character<\/th><th>Enforcement abroad<\/th><\/tr><\/thead><tbody><tr><td>CIETAC (China International Economic and Trade Arbitration Commission)<\/td><td>Chinese, well-established, located in China<\/td><td>Awards enforceable under the New York Convention<\/td><\/tr><tr><td>HKIAC (Hong Kong International Arbitration Centre)<\/td><td>Neutral, common law, Hong Kong<\/td><td>Excellent enforcement record<\/td><\/tr><tr><td>SIAC (Singapore)<\/td><td>Neutral, common law<\/td><td>Excellent enforcement<\/td><\/tr><tr><td>ICC<\/td><td>International, higher cost<\/td><td>Widely enforceable<\/td><\/tr><tr><td>Chinese court litigation<\/td><td>Slow, domestic<\/td><td>Foreign judgments hard to enforce<\/td><\/tr><tr><td>Buyer's home court<\/td><td>Convenient for buyer<\/td><td>Effectively unenforceable in China<\/td><\/tr><\/tbody><\/table>\n<p>For most first-time buyers, HKIAC or SIAC offers a neutral common-law seat with strong enforcement, and both are customary in China trade. CIETAC is cheaper and more familiar to Chinese suppliers and is a reasonable choice when the amounts are moderate. Litigation in a Chinese court is the least attractive path for a foreign buyer, because a foreign judgment is difficult to enforce against Chinese assets.<\/p>\n<p>The clause should specify the institution, the seat, the language, the number of arbitrators (typically one for smaller disputes and three for larger), and that the award is final and binding.<\/p>\n<hr>\n<h2>Clause 4: Specification and Quality Acceptance<\/h2>\n<p>Vague quality language is the biggest source of lost disputes, because quality must be defined by reference to measurable criteria. Include a named specification document as an annex, with drawings, dimensions, and tolerances; material requirements, ideally naming a standard such as a steel grade or polymer designation; a physical approved sample, sealed and signed by both parties and kept by each; an inspection standard such as an AQL with the sampling level and defect classifications; the right to nominate a third-party inspector; and the point and time of inspection, such as pre-shipment at the supplier's premises.<\/p>\n<p>Then specify the consequence of failure — rework, replacement, rejection, and refund — and a claim window after arrival for latent defects. A quality clause that says only &quot;goods must be of good quality&quot; gives you almost nothing. A clause that names an AQL, a specification annex, and a named inspector gives you a usable remedy. This clause is where disputes are won before they happen, so it is worth more drafting time than the price clause.<\/p>\n<p>A useful discipline is to translate every quality expectation into something a third party could measure without arguing. &quot;Premium feel&quot; is not measurable. &quot;Tensile strength at least X, surface roughness below Y, color within two Pantone steps of the approved sample, and no visible defects under a defined light source at a defined distance&quot; is measurable. The more of your expectations you can express in that form, the more of them a third-party inspector can enforce on your behalf before the goods leave the factory, which is far cheaper and faster than arguing about them after arrival.<\/p>\n<p>Keep the approved sample physically, and keep it sealed. In practice, the single most powerful quality document in a China purchase contract is a sealed, photographed, dated sample signed by both parties, because it converts an argument about taste into a comparison of two physical objects. Where the product genuinely cannot be sampled, such as a large machine or a bespoke item, replace the sample with a signed specification drawing set and a first-article approval process, so that at least the first unit is verified before the rest are produced.<\/p>\n<hr>\n<h2>Clause 5: Price, Payment, and Delivery Terms<\/h2>\n<p>Specify the unit price, currency, quantity, and total; the Incoterms version and term such as FOB Shenzhen, Incoterms 2020; payment milestones with percentages and triggers; the delivery date and the definition of delivery, whether shipment date or arrival date; permissions for partial shipment and transshipment; and the consequences of late delivery.<\/p>\n<p>Tie every payment to a verifiable event: contract signature, pre-shipment inspection pass, or bill of lading issuance. A payment schedule with no conditions is a schedule for paying whether or not you get goods. Where production is long and custom, add a retention or a final tranche held until after arrival.<\/p>\n<hr>\n<h2>Clause 6: Breach, Remedies, and Damages<\/h2>\n<p>Define what happens on failure, because a contract with no remedy is only a description of an intention.<\/p>\n<ul>\n<li><strong>Late delivery.<\/strong> A liquidated damages rate per day, capped at a percentage of the order value, is standard and enforceable if reasonable.<\/li>\n<li><strong>Non-conforming goods.<\/strong> The right to reject, require replacement, or demand a price reduction.<\/li>\n<li><strong>Non-delivery.<\/strong> Full refund of amounts paid, plus agreed damages.<\/li>\n<li><strong>Consequential losses.<\/strong> Note that these are hard to recover under Chinese law; a liquidated damages clause is often the realistic path.<\/li>\n<li><strong>Termination.<\/strong> The right to terminate on material breach, with refund of deposits.<\/li>\n<li><strong>Set-off.<\/strong> The right to withhold payments against claims.<\/li>\n<\/ul>\n<p>Liquidated damages are preferred over attempting to prove actual losses, which is costly and uncertain. Keep the cap commercially reasonable, because Chinese law permits adjustment of penalties that are disproportionate.<\/p>\n<hr>\n<h2>Clause 7: Force Majeure — The Trap<\/h2>\n<p>Force majeure clauses are the most abused in Chinese trade, because a broad clause gives the supplier an escape hatch for almost any disruption. Watch for overbroad definitions that include &quot;changes in policy,&quot; &quot;supply chain issues,&quot; or &quot;market conditions&quot; — these are business risks, not force majeure. Watch, too, for notice requirements that the supplier must satisfy within a short window, missing mitigation duties that would require the supplier to resume performance, and the absence of any termination right when the event is prolonged.<\/p>\n<p>Tighten the clause: define force majeure narrowly, require prompt written notice with evidence, impose a duty to mitigate and resume, and add a termination right if the event lasts beyond a stated period such as sixty days, with refund of deposits. Since 2020, some suppliers have cited epidemic measures for routine delays, so require that the event actually prevented performance and that the supplier prove it. Chinese law also recognizes a &quot;change of circumstances&quot; doctrine (情势变更) that can allow adjustment, and courts have at times recognized force majeure certificates, so the contractual language should tighten rather than loosen the supplier's ability to escape.<\/p>\n<hr>\n<h2>Clause 8: Bilingual Versions and Additional Protections<\/h2>\n<p>Trade contracts are often bilingual, Chinese and English, which creates a classic trap: minor drafting differences that change meaning, and no rule about which prevails. Handle it by stating the language of the contract and which version prevails in a conflict — commonly the English version, or the version in the seat's language; by keeping one authoritative text rather than two independently drafted texts that differ; by using a competent translator and checking the Chinese against the commercial intent, not just linguistic accuracy; and by attaching the specification and annexes in both languages, referencing the same document. If the contract does not say which language prevails, a dispute can turn on translation rather than on the deal.<\/p>\n<p>Additional clauses worth including: confidentiality and IP, especially for custom tooling and designs; tooling ownership and retrieval rights, so that if you pay for a mold you own it and can get it; non-circumvention, to prevent the supplier selling your design directly into your market; a warranty period after delivery with a defined remedy; inspection rights during production, not only at the end; assignment and subcontracting controls; and a notices clause with valid addresses, emails, and deemed receipt rules.<\/p>\n<p>A Chinese supplier presented with a foreign-drafted, arbitration-seated, English-law contract may refuse or stall. Practical tactics help:<\/p>\n<ul>\n<li>Start from a plain, short contract that focuses on the clauses carrying money risk, rather than a fifty-page document that will never be signed.<\/li>\n<li>Accept CIETAC if HKIAC is a sticking point, provided the rules and seat are clearly specified.<\/li>\n<li>Keep liquidated damages reasonable, since an unreasonable cap invites refusal.<\/li>\n<li>Use the platform's order terms as a supplement rather than a substitute for a real contract.<\/li>\n<li>Have the contract reviewed in both languages before signing, and reconcile the two texts.<\/li>\n<\/ul>\n<p>A signed, modest contract beats an unsigned, perfect one.<\/p>\n<hr>\n<h2>Quick checklist<\/h2>\n<ul>\n<li>[ ] Contract names the correct legal entity, with credit code, and a signatory with authority or a chop.<\/li>\n<li>[ ] Governing law is explicitly chosen and consistent with the forum.<\/li>\n<li>[ ] The dispute clause names the institution, seat, language, and number of arbitrators.<\/li>\n<li>[ ] A specification annex, tolerances, and an approved sealed sample are included.<\/li>\n<li>[ ] An AQL or equivalent acceptance standard is stated, with the right to nominate an inspector.<\/li>\n<li>[ ] Payment milestones are tied to inspection and shipping documents.<\/li>\n<li>[ ] Liquidated damages are defined for late delivery and non-delivery, with a reasonable cap.<\/li>\n<li>[ ] Force majeure is narrowly defined, requires prompt notice and evidence, and allows termination.<\/li>\n<li>[ ] Tooling ownership and retrieval rights are stated.<\/li>\n<li>[ ] The prevailing language of the bilingual contract is stated.<\/li>\n<li>[ ] The signing entity matches the invoicing entity and the bank beneficiary.<\/li>\n<\/ul>\n<p>Get these clauses right and the contract becomes a tool. Get them wrong and you have paid for a document that cannot help you.<\/p>","cta":"https://lu7897859-tech.github.io/doors/sourcing-audit/","ctaTitle":"Check a supplier for free, right now","ctaText":"Paste the supplier's 18-digit USCC or full registered name for an instant structural check — then go further with the full verification guide.","ctaBtn":"Open the free check"},"type":"article"};</script>
<script>
(function(){
  var D = window.DOOR || {};
  var t = D.type || 'door';
  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var ROOT = D.root || '';   // -> GH Pages root
  var UP = D.up || '';       // -> door dir ('' or '../')
  function isExt(u){ return /^https?:|^mailto:/.test(String(u||'')); }
  function dlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; if(u.charAt(0)==='#') return UP+'index.html'+u; return UP+u.replace(/^\.?\//,''); }
  function rlink(u){ u = String(u==null?'#':u); if(isExt(u)) return u; return ROOT+u.replace(/^\.?\//,''); }
  document.getElementById('brand').textContent = D.brand || '';

  // nav
  var nav = document.getElementById('nav');
  (D.nav || []).forEach(function(n){ nav.appendChild(el('<a href="'+dlink(n.href)+'">'+esc(n.label)+'</a>')); });

  var app = document.getElementById('app');

  function renderDoor(){
    var h = D.hero || {};
    var html = '';
    html += '<section class="hero"><div class="wrap">';
    if(h.eyebrow) html += '<span class="eyebrow">'+esc(h.eyebrow)+'</span>';
    html += '<h1>'+esc(h.h1||'')+'</h1>';
    if(h.sub) html += '<p class="sub">'+esc(h.sub)+'</p>';
    // demo box
    html += '<div class="demo"><div class="dt"><span>'+esc(h.demoTitle||'Try it free')+'</span><b>'+esc(h.demoBadge||'Live')+'</b></div>';
    html += '<div class="row"><input id="dq" placeholder="'+esc(h.demoPlaceholder||'')+'" aria-label="'+esc(h.demoLabel||'query')+'">';
    html += '<button id="db">'+esc(h.demoBtn||'Check')+'</button></div>';
    html += '<div class="out" id="dout"></div>';
    if(h.demoNote) html += '<div class="note">'+esc(h.demoNote)+'</div>';
    html += '</div>';
    if((D.trust||[]).length){ html += '<div class="trust">'+D.trust.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>'; }
    html += '</div></section>';

    if((D.steps||[]).length){
      html += '<section><div class="wrap"><h2>'+esc(D.stepsTitle||'How it works')+'</h2><p class="sect-sub">'+esc(D.stepsSub||'')+'</p><div class="grid g3">';
      D.steps.forEach(function(s,i){ html += '<div class="card"><div class="step-n">'+(i+1)+'</div><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p></div>'; });
      html += '</div></div></section>';
    }

    if((D.products||[]).length){
      html += '<section id="products"><div class="wrap"><h2>'+esc(D.productsTitle||'Products')+'</h2><p class="sect-sub">'+esc(D.productsSub||'')+'</p><div class="grid g3">';
      D.products.forEach(function(p){
        html += '<div class="card prod"><div class="p-top"><div><h3>'+esc(p.name)+'</h3></div>'+(p.price?'<span class="price">'+esc(p.price)+'</span>':'')+'</div>';
        if(p.tagline) html += '<p>'+esc(p.tagline)+'</p>';
        if((p.bullets||[]).length) html += '<ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
        if(p.page) html += '<a class="btn ghost" href="'+dlink(p.page)+'">Details</a>';
        if(p.cta) html += '<a class="btn" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a>';
        html += '</div>';
      });
      html += '</div></div></section>';
    }

    if((D.tiers||[]).length){
      html += '<section id="pricing"><div class="wrap"><h2>'+esc(D.tiersTitle||'Pricing')+'</h2><p class="sect-sub">'+esc(D.tiersSub||'')+'</p><div class="grid g3 tiers">';
      D.tiers.forEach(function(t){
        html += '<div class="card tier'+(t.popular?' pop':'')+'">'+(t.popular?'<span class="badge">'+(esc(t.badge||'Popular'))+'</span>':'')+'<h3>'+esc(t.name)+'</h3><div class="amt">'+esc(t.price)+'</div><div class="per">'+esc(t.per||'')+'</div><ul>'+ (t.features||[]).map(function(f){return '<li>'+esc(f)+'</li>';}).join('') +'</ul>';
        html += '<a class="btn'+(t.ghost?' ghost':'')+'" href="'+dlink(t.cta)+'" rel="noopener">'+esc(t.ctaText||'Choose')+'</a></div>';
      });
      html += '</div></div></section>';
    }

    if((D.faq||[]).length){
      html += '<section id="faq"><div class="wrap"><h2>FAQ</h2><p class="sect-sub"></p><div class="faq">';
      D.faq.forEach(function(f){ html += '<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>'; });
      html += '</div></div></section>';
    }
    app.innerHTML = html;
    wireDemo();
  }

  function renderProduct(){
    var p = D.product || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('index.html')+'">← '+esc(D.brand)+'</a></p>';
    html += '<h1>'+esc(p.name)+'</h1>';
    if(p.tagline) html += '<p class="sub" style="margin:0 0 10px">'+esc(p.tagline)+'</p>';
    html += '<p>'+(p.price?'<span class="pill">'+esc(p.price)+'</span>':'')+((p.tags||[]).map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join(''))+'</p>';
    if((p.bullets||[]).length) html += '<h3>What you get</h3><ul>'+p.bullets.map(function(b){return '<li>'+esc(b)+'</li>';}).join('')+'</ul>';
    if(p.sample) html += '<h3>Sample output</h3><pre class="out">'+esc(p.sample)+'</pre>';
    if(p.body) html += p.body; // trusted markdown-lite html from config
    if(p.cta) html += '<p style="margin-top:22px"><a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:12px 18px;font-weight:700" href="'+dlink(p.cta)+'" rel="noopener">'+esc(p.ctaText||'Get it')+'</a></p>';
    if((D.related||[]).length){
      html += '<h3>Related</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function wireDemo(){
    var inp = document.getElementById('dq'), btn = document.getElementById('db'), out = document.getElementById('dout');
    if(!inp||!btn) return;
    function setOut(msg, cls){ out.className = 'out' + (cls?(' '+cls):''); out.textContent = msg; }

    // ---- client-side USCC (Unified Social Credit Code) checker: real, zero-dependency free hook ----
    var CS = '0123456789ABCDEFGHJKLMNPQRTUWXY';
    var W = [1,3,9,27,19,26,16,17,20,29,25,13,8,24,10,30,28];
    var REG = {'1':'Market regulation','5':'Civil affairs','9':'Other','Y':'Other','1A':'Regulator A'};
    function decodeUSCC(code){
      var s = String(code||'').toUpperCase().replace(/\s+/g,'');
      if(s.length!==18) return {ok:false, reason:'Length is '+s.length+', a USCC is exactly 18 characters.'};
      for(var i=0;i<18;i++){ if(CS.indexOf(s.charAt(i))<0) return {ok:false, reason:'Invalid character "'+s.charAt(i)+'" (letters I, O, S, V, Z are not used).'}; }
      var sum=0; for(var j=0;j<17;j++) sum += CS.indexOf(s.charAt(j))*W[j];
      var expect = CS.charAt((31 - (sum % 31)) % 31);
      var ok = (expect === s.charAt(17));
      return {ok:ok, expect:expect, given:s.charAt(17),
        region:s.slice(2,8), org: s.charAt(8), kind: s.charAt(9), serial:s.slice(10,17)};
    }
    function explain(x){
      if(x.ok){
        return '✅ Structurally valid USCC\n\n'+
          'Region / admin code : '+x.region+'\n'+
          'Entity-type code   : '+x.kind+'\n'+
          'Org code           : '+x.org+'\n'+
          'Serial             : '+x.serial+'\n'+
          'Check digit        : '+x.given+' (valid)\n\n'+
          'Format checks out. What a valid code does NOT tell you: whether the company is still active, who really owns it, or whether it has litigation, sanctions or adverse media. That is what the full report covers.';
      }
      return '❌ Not a structurally valid USCC\n\n'+x.reason+'\n\nTip: paste the 18-character Unified Social Credit Code from the supplier\u2019s business licence, or try the company\u2019s full registered name.';
    }

    async function run(){
      var q = (inp.value||'').trim();
      if(!q){ setOut(D.demoEmpty||'Please enter a company name or 18-digit registration number.','err'); return; }
      btn.disabled = true; var old = btn.textContent; btn.textContent = D.demoBusy||'Checking…';
      try{
        if(D.demoMode === 'uscc'){
          setOut(D.demoBusy||'Checking…','');
          var x = decodeUSCC(q);
          setOut(explain(x), x.ok?'ok':'err');
          beacon(q, x.ok?'valid':'invalid');
        } else if(D.demoMode === 'endpoint' && D.demoEndpoint){
          setOut(D.demoBusy||'Contacting verification service…','');
          var r = await fetch(D.demoEndpoint, { method:'POST', headers:{'content-type':'application/json','accept':'application/json'}, body: JSON.stringify({ keyword: q, tool:'verify_supplier' }) });
          var txt = await r.text(); var j=null; try{ j=JSON.parse(txt); }catch(e){}
          if(r.status===200 && j){ setOut(JSON.stringify(j,null,2).substring(0,1400),'ok'); }
          else if(r.status===402){ setOut((D.paywallNote||'Free instant checks used. Get the full verified report to continue.'),'err'); }
          else { setOut('Service returned status '+r.status+'. '+(D.demoFallback||''),'err'); }
        } else {
          var x2 = decodeUSCC(q);
          setOut(explain(x2), x2.ok?'ok':'err');
        }
      }catch(e){
        setOut((D.demoOffline||'The live demo is momentarily unavailable. The full verification report still works.')+'\n\n'+(D.demoEndpoint||''),'err');
      }
      btn.disabled=false; btn.textContent=old;
    }
    // anonymous use-signal: lets us see the first real visitor arrive (never sent to the supplier)
    function beacon(q, result){
      if(!D.demoEndpoint) return;
      try{
        fetch(D.demoEndpoint, { method:'POST', keepalive:true, headers:{'content-type':'application/json'}, body: JSON.stringify({ keyword:q, tool:'verify_supplier', source:'door-free-hook', result:result }) }).catch(function(){});
      }catch(e){}
    }
    btn.addEventListener('click',run);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') run(); });
  }

  function renderArticle(){
    var a = D.article || {};
    var html = '<section style="border-top:0"><div class="wrap"><article class="doc">';
    html += '<p><a href="'+dlink('blog/index.html')+'">← All guides</a></p>';
    html += '<h1>'+esc(a.title)+'</h1>';
    if(a.desc) html += '<p class="sub" style="margin:0 0 18px">'+esc(a.desc)+'</p>';
    if((a.tags||[]).length) html += '<p>'+a.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
    html += '<div data-article>'+(a.html||'')+'</div>';
    if(a.cta){
      html += '<div class="card" style="margin-top:30px;border-color:var(--accent)"><h3>'+esc(a.ctaTitle||'Check a supplier now')+'</h3><p style="margin-bottom:14px">'+esc(a.ctaText||'')+'</p>';
      html += '<a class="btn" style="display:inline-block;background:var(--accent);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700" href="'+dlink(a.cta)+'" rel="noopener">'+esc(a.ctaBtn||'Open the free check')+'</a></div>';
    }
    if((D.related||[]).length){
      html += '<h3>Related guides</h3><div>';
      D.related.forEach(function(r){ html += '<a class="btn ghost" style="display:inline-block;margin:4px 8px 4px 0;border:1px solid var(--line);border-radius:10px;padding:9px 14px" href="'+dlink(r.href)+'">'+esc(r.label)+'</a>'; });
      html += '</div>';
    }
    html += '</article></div></section>';
    app.innerHTML = html;
  }

  function renderBlogIndex(){
    var posts = D.posts || [];
    var html = '<section class="hero"><div class="wrap"><span class="eyebrow">'+esc(D.blogEyebrow||'Guides')+'</span><h1>'+esc(D.blogTitle||'China sourcing guides')+'</h1>';
    if(D.blogSub) html += '<p class="sub">'+esc(D.blogSub)+'</p>';
    html += '</div></section><section><div class="wrap"><div class="grid g2">';
    posts.forEach(function(p){
      html += '<div class="card"><h3><a href="'+dlink(p.href)+'">'+esc(p.title)+'</a></h3><p>'+esc(p.desc||'')+'</p>';
      if(p.tags&&p.tags.length) html += '<p style="margin-top:10px">'+p.tags.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join('')+'</p>';
      html += '</div>';
    });
    html += '</div></div></section>';
    app.innerHTML = html;
  }

  if(t==='product') renderProduct(); else if(t==='article') renderArticle(); else if(t==='blog') renderBlogIndex(); else renderDoor();

  // footer
  var foot = document.getElementById('foot');
  (D.footer||[]).forEach(function(col){
    foot.appendChild(el('<div><h4>'+esc(col.t)+'</h4>'+ (col.links||[]).map(function(l){ return '<a href="'+rlink(l.href)+'"'+(isExt(l.href)?' rel="noopener"':'')+'>'+esc(l.label)+'</a>'; }).join('') +'</div>'));
  });
  document.getElementById('legalLeft').textContent = D.legalLeft || ('© ' + new Date().getFullYear() + ' ' + (D.brand||''));
  document.getElementById('legalRight').textContent = D.legalRight || '';
})();
</script>
